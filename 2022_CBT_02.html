  <script>
    let rawQuizData = [];
    try {
      const jsonText = document.getElementById("quiz-data").textContent;
      rawQuizData = JSON.parse(jsonText);
    } catch (e) {
      alert("문제 데이터를 불러오는 중 오류가 발생했습니다. JSON 형식을 확인해주세요.");
      console.error("JSON Parsing Error:", e);
    }

    let currentIdx = 0;
    let userAnswers = new Array(rawQuizData.length).fill(null);

    const questionBadge = document.getElementById("question-badge");
    const categoryBadge = document.getElementById("category-badge");
    const questionCounter = document.getElementById("question-counter");
    const questionText = document.getElementById("question-text");
    const questionImage = document.getElementById("question-image");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const resultAlert = document.getElementById("result-alert");
    const rationalesList = document.getElementById("rationales-list");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const navGrid = document.getElementById("nav-grid");
    const scoreDisplay = document.getElementById("score-display");
    const progressBar = document.getElementById("progress-bar");
    const resetBtn = document.getElementById("reset-btn");
    const editModal = document.getElementById("edit-modal");
    const nextBtnTop = document.getElementById("next-btn-top");

    function initNavGrid() {
      navGrid.innerHTML = "";
      rawQuizData.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.innerText = idx + 1;
        btn.id = `nav-btn-${idx}`;
        btn.className = "w-7 h-7 md:w-8 md:h-8 rounded font-bold text-xs border border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200 transition shadow-sm";
        btn.onclick = () => loadQuestion(idx);
        navGrid.appendChild(btn);
      });
      updateScoreAndProgress();
    }

    function updateScoreAndProgress() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null && rawQuizData[idx].o[ans].a === 1) correctCount++;
      });
      scoreDisplay.innerText = `${correctCount} / ${answeredCount} (총 ${rawQuizData.length}문항)`;
      progressBar.style.width = `${(answeredCount / rawQuizData.length) * 100}%`;

      rawQuizData.forEach((_, idx) => {
        const navBtn = document.getElementById(`nav-btn-${idx}`);
        if(!navBtn) return;
        if (userAnswers[idx] === null) {
          navBtn.className = `w-7 h-7 md:w-8 md:h-8 rounded font-bold text-xs border shadow-sm ${idx === currentIdx ? 'border-indigo-600 ring-2 ring-indigo-400 bg-white text-indigo-700 scale-110' : 'border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200'}`;
        } else {
          const isUserCorrect = rawQuizData[idx].o[userAnswers[idx]].a === 1;
          navBtn.className = `w-7 h-7 md:w-8 md:h-8 rounded font-bold text-xs shadow-sm bg-${isUserCorrect ? 'emerald' : 'rose'}-500 text-white ${idx === currentIdx ? `ring-2 ring-${isUserCorrect ? 'emerald' : 'rose'}-300 scale-110` : ''}`;
        }
      });
    }

    function loadQuestion(idx) {
      if (idx < 0 || idx >= rawQuizData.length) return;
      currentIdx = idx;
      const q = rawQuizData[idx];

      window.scrollTo(0, 0);

      questionBadge.innerText = `문항 ${q.id || (idx+1)}`;
      categoryBadge.innerText = q.c;
      questionCounter.innerText = `${idx + 1} / ${rawQuizData.length}`;
      questionText.innerText = q.q;
      
      if(q.img && q.img.trim() !== "") {
          questionImage.src = q.img;
          questionImage.classList.remove('hidden');
      } else {
          questionImage.src = "";
          questionImage.classList.add('hidden');
      }

      optionsContainer.innerHTML = "";
      const selected = userAnswers[idx];

      q.o.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3 text-sm md:text-base font-medium shadow-sm ";
        
        if (selected === null) {
          btn.className += "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 text-slate-800";
          btn.onclick = () => selectOption(optIdx);
        } else {
          if (opt.a === 1) btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold z-10 scale-[1.01]";
          else if (selected === optIdx) btn.className += "border-rose-500 bg-rose-50 text-rose-900";
          else btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
          btn.disabled = true;
        }

        const iconSpan = document.createElement("span");
        iconSpan.className = "pt-0.5 shrink-0"; 
        if (selected !== null) {
          if (opt.a === 1) iconSpan.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-xl drop-shadow-md"></i>';
          else if (selected === optIdx) iconSpan.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-xl"></i>';
          else iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-300 text-xl"></i>';
        } else {
          iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-400 text-xl group-hover:text-indigo-600"></i>';
        }

        const textSpan = document.createElement("span");
        textSpan.className = "flex-1 leading-relaxed";
        textSpan.innerText = opt.t;
        
        btn.appendChild(iconSpan);
        btn.appendChild(textSpan);
        optionsContainer.appendChild(btn);
      });

      if (selected !== null) {
        renderExplanation(selectedIdx);
        explanationBox.classList.remove("hidden");
      } else {
        explanationBox.classList.add("hidden");
      }

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === rawQuizData.length - 1;
      nextBtnTop.disabled = idx === rawQuizData.length - 1;
      updateScoreAndProgress();
    }

    function selectOption(optIdx) {
      userAnswers[currentIdx] = optIdx;
      loadQuestion(currentIdx);
    }

    function renderExplanation(selectedIdx) {
      const q = rawQuizData[currentIdx];
      const isCorrect = q.o[selectedIdx].a === 1;

      if (isCorrect) {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-emerald-900 bg-emerald-100 border border-emerald-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-2xl drop-shadow"></i> <div>정답입니다! 완벽하게 이해하셨습니다.</div>';
      } else {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-rose-900 bg-rose-100 border border-rose-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 text-2xl drop-shadow"></i> <div>오답입니다. 아래 보기별 해설을 반드시 확인하세요.</div>';
      }

      rationalesList.innerHTML = "";
      q.o.forEach((opt) => {
        const item = document.createElement("div");
        item.className = `p-3 rounded-lg border shadow-sm ${opt.a === 1 ? 'bg-emerald-50/80 border-emerald-200' : 'bg-white border-slate-200'}`;
        
        const header = document.createElement("div");
        header.className = "font-bold mb-1.5 flex items-start gap-2";
        if (opt.a === 1) header.innerHTML = `<span class="bg-emerald-600 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5 shadow-sm">정답 보기</span> <span class="text-emerald-900">${opt.t}</span>`;
        else header.innerHTML = `<span class="bg-slate-400 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5">오답 보기</span> <span class="text-slate-800">${opt.t}</span>`;
        
        const body = document.createElement("div");
        body.className = "text-xs md:text-sm text-slate-600 pl-1 leading-relaxed";
        body.innerText = opt.r;

        item.appendChild(header);
        item.appendChild(body);
        rationalesList.appendChild(item);
      });
    }

    function openEditModal() {
      const q = rawQuizData[currentIdx];
      document.getElementById('edit-cat').value = q.c;
      document.getElementById('edit-q').value = q.q;
      
      if(q.img && q.img.trim() !== "") {
          document.getElementById('edit-img-base64').value = q.img;
          document.getElementById('edit-img-preview').src = q.img;
          document.getElementById('edit-img-preview').classList.remove('hidden');
          document.getElementById('btn-clear-img').classList.remove('hidden');
      } else {
          clearImage(); 
      }

      for(let i=0; i<4; i++) {
        document.getElementById(`edit-opt-${i}`).value = q.o[i].t;
        document.getElementById(`edit-rat-${i}`).value = q.o[i].r;
        if(q.o[i].a === 1) {
          document.querySelector(`input[name="edit-ans"][value="${i}"]`).checked = true;
        }
      }
      
      document.body.classList.add('modal-open');
      editModal.classList.remove('hidden');
    }

    function closeEditModal() {
      document.body.classList.remove('modal-open');
      editModal.classList.add('hidden');
    }

    function saveEditedQuestion() {
      const q = rawQuizData[currentIdx];
      q.c = document.getElementById('edit-cat').value;
      q.q = document.getElementById('edit-q').value;
      q.img = document.getElementById('edit-img-base64').value;
      
      const correctVal = document.querySelector('input[name="edit-ans"]:checked').value;
      
      for(let i=0; i<4; i++) {
        q.o[i].t = document.getElementById(`edit-opt-${i}`).value;
        q.o[i].r = document.getElementById(`edit-rat-${i}`).value;
        q.o[i].a = (i.toString() === correctVal) ? 1 : 0;
      }
      
      closeEditModal();
      loadQuestion(currentIdx);
      alert("문제가 성공적으로 수정되었습니다.\n\n※ 영구 저장을 원하시면 상단의 [수정본 다운로드] 버튼을 클릭하세요!");
    }

    function addNewQuestion() {
      const newQ = {
        id: rawQuizData.length + 1,
        c: "새 카테고리",
        q: "여기에 새로운 문제를 입력하세요.",
        img: "",
        o: [
          { t: "① 보기 1", a: 1, r: "해설 1" },
          { t: "② 보기 2", a: 0, r: "해설 2" },
          { t: "③ 보기 3", a: 0, r: "해설 3" },
          { t: "④ 보기 4", a: 0, r: "해설 4" }
        ]
      };
      rawQuizData.push(newQ);
      userAnswers.push(null);
      initNavGrid();
      loadQuestion(rawQuizData.length - 1);
      openEditModal(); 
    }

    function deleteCurrentQuestion() {
      if(rawQuizData.length <= 1) {
          alert("최소 1개의 문제는 남아있어야 합니다.");
          return;
      }
      if(confirm("정말로 이 문제를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.")) {
          rawQuizData.splice(currentIdx, 1);
          userAnswers.splice(currentIdx, 1);
          
          rawQuizData.forEach((q, i) => q.id = i + 1);
          
          initNavGrid();
          closeEditModal();
          
          let nextIdx = currentIdx >= rawQuizData.length ? rawQuizData.length - 1 : currentIdx;
          loadQuestion(nextIdx);
      }
    }

    function encodeImageFileAsURL(element) {
      const file = element.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        document.getElementById('edit-img-base64').value = reader.result;
        document.getElementById('edit-img-preview').src = reader.result;
        document.getElementById('edit-img-preview').classList.remove('hidden');
        document.getElementById('btn-clear-img').classList.remove('hidden');
      }
      reader.readAsDataURL(file);
    }

    function clearImage() {
      document.getElementById('edit-img-upload').value = "";
      document.getElementById('edit-img-base64').value = "";
      document.getElementById('edit-img-preview').src = "";
      document.getElementById('edit-img-preview').classList.add('hidden');
      document.getElementById('btn-clear-img').classList.add('hidden');
    }

    function downloadUpdatedHTML() {
      const dataScript = document.getElementById('quiz-data');
      dataScript.textContent = "\n" + JSON.stringify(rawQuizData, null, 2) + "\n";
      
      let htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "2022_CBT_04회_최종.html"; 
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    prevBtn.addEventListener("click", () => { if (currentIdx > 0) loadQuestion(currentIdx - 1); });
    nextBtn.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    nextBtnTop.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    
    resetBtn.addEventListener("click", () => {
      if (confirm("풀이 기록을 모두 초기화하시겠습니까? 처음부터 다시 풉니다.")) {
        userAnswers = new Array(rawQuizData.length).fill(null);
        loadQuestion(0);
      }
    });

    document.addEventListener("keydown", (e) => {
      if(!editModal.classList.contains('hidden')) return;
      if (e.key === "ArrowLeft" && currentIdx > 0) loadQuestion(currentIdx - 1);
      else if (e.key === "ArrowRight" && currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1);
      else if (["1", "2", "3", "4"].includes(e.key) && userAnswers[currentIdx] === null) selectOption(parseInt(e.key) - 1);
    });

    // 초기 실행
    if (rawQuizData.length > 0) {
      initNavGrid();
      loadQuestion(0);
    }
  </script>

</body></html>
