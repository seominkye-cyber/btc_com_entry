<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텅...</title>
    <style>
        /* 외부 폰트를 빼고 컴퓨터 기본 폰트를 사용하여 로딩 오류 방지 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f8; /* 아주 연한 파스텔 회색 배경 */
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 오류를 일으킬 수 있는 투명도/블러 효과를 빼고 깔끔한 흰색 박스로 변경 */
        .container {
            text-align: center;
            background-color: #ffffff; /* 하얀색 배경 박스 */
            padding: 50px 70px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* 부드러운 그림자 */
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            color: #333333;
            margin: 0 0 10px 0;
        }

        p {
            font-size: 16px;
            color: #777777;
            margin: 0 0 30px 0;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ffb7b2;
            color: #ffffff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
        }

        .btn:hover {
            background-color: #ff9e99;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">👻</div>
        <h1>암것도 안나와용...</h1>
        <p>이곳은 아직 텅 비어있네요.<br>나중에 다시 와주실거죠?</p>
        <a href="index.html" class="btn">뒤로 가기</a>
    </div>
</body>
</html>
