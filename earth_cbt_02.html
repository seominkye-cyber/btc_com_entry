  { "id": 25, "c": "지질시대와 생물", "q": "시조새 화석이 진화론에서 갖는 중요한 의미는?", "img": "", "o": [ { "t": "① 포유류가 조류로 진화했음을 보여준다.", "a": 0, "r": "잘못된 진화 과정입니다." }, { "t": "② 양서류에서 파충류로의 진화를 보여준다.", "a": 0, "r": "시조새와 무관합니다." }, { "t": "③ 파충류와 조류의 특징을 모두 가져, 파충류에서 조류로의 진화 과정을 보여주는 중간 화석이다.", "a": 1, "r": "이빨과 긴 꼬리뼈(파충류 특징), 깃털과 날개(조류 특징)를 동시에 가지고 있습니다." }, { "t": "④ 조류가 파충류로 진화했음을 증명한다.", "a": 0, "r": "진화 방향이 반대입니다." } ] },
  { "id": 26, "c": "진화와 자연선택", "q": "다윈의 자연 선택설에서 생물이 진화하는 과정을 순서대로 바르게 나열한 것은?", "img": "", "o": [ { "t": "① 개체 변이 → 과잉 생산 → 자연 선택 → 생존 경쟁", "a": 0, "r": "과잉 생산이 먼저입니다." }, { "t": "② 과잉 생산 → 개체 변이 → 생존 경쟁 → 자연 선택(적자생존)", "a": 1, "r": "다윈의 진화론 기본 과정입니다: 과잉생산 및 변이 -> 생존경쟁 -> 자연선택(적자생존) -> 진화." }, { "t": "③ 생존 경쟁 → 과잉 생산 → 개체 변이 → 자연 선택", "a": 0, "r": "순서가 틀렸습니다." }, { "t": "④ 자연 선택 → 개체 변이 → 생존 경쟁 → 과잉 생산", "a": 0, "r": "역순에 가깝습니다." } ] },
  { "id": 27, "c": "진화와 자연선택", "q": "같은 종의 생물 개체들 사이에서 형태, 습성, 기능 등이 다양하게 나타나는 차이를 무엇이라 하는가?", "img": "", "o": [ { "t": "① 자연 선택", "a": 0, "r": "환경에 유리한 개체가 살아남는 현상입니다." }, { "t": "② 돌연변이", "a": 0, "r": "변이의 원인 중 하나입니다." }, { "t": "③ 변이", "a": 1, "r": "같은 종 내에서 나타나는 개체 간의 형질 차이를 '변이'라고 합니다." }, { "t": "④ 적자생존", "a": 0, "r": "경쟁에서 이겨 살아남는 것을 뜻합니다." } ] },
  { "id": 28, "c": "진화와 자연선택", "q": "다윈이 갈라파고스 군도에서 관찰한 핀치새의 부리 모양이 섬마다 서로 다른 이유를 자연선택설로 설명할 때 가장 적절한 것은?", "img": "", "o": [ { "t": "① 각 섬의 기후가 부리 모양을 직접 변형시켰다.", "a": 0, "r": "후천적 획득 형질은 유전되지 않습니다(용불용설 오류)." }, { "t": "② 새들이 먹이를 먹기 위해 스스로 부리를 갈고닦았다.", "a": 0, "r": "의지에 의한 진화가 아닙니다." }, { "t": "③ 각 섬의 먹이 환경에 유리한 부리를 가진 개체가 살아남아 자손을 남겼다.", "a": 1, "r": "선천적 변이 중 환경(먹이)에 유리한 형질이 자연 선택된 결과입니다." }, { "t": "④ 다른 새들과 교배하여 새로운 종을 만들었기 때문이다.", "a": 0, "r": "교잡에 의한 종 분화 설명이 아닙니다." } ] },
  { "id": 29, "c": "진화와 자연선택", "q": "기린의 목이 길어진 이유를 다윈의 자연 선택설로 설명한 것으로 옳은 것은?", "img": "", "o": [ { "t": "① 높은 곳의 잎을 먹으려고 노력하다 보니 목이 길어졌다.", "a": 0, "r": "라마르크의 용불용설에 해당합니다." }, { "t": "② 목이 짧은 기린과 긴 기린 중, 높은 곳의 먹이를 먹기 유리한 목이 긴 기린이 생존경쟁에서 살아남았다.", "a": 1, "r": "자연 선택설은 선천적인 변이 중 환경에 유리한 개체가 살아남아 유전된 결과로 설명합니다." }, { "t": "③ 목이 짧은 기린이 갑자기 돌연변이를 일으켜 목이 긴 기린으로 진화했다.", "a": 0, "r": "단발적인 돌연변이만으로 설명하지 않습니다." }, { "t": "④ 기린은 원래부터 목이 길게 창조되었다.", "a": 0, "r": "진화론적 설명이 아닙니다." } ] },
  { "id": 30, "c": "진화와 자연선택", "q": "산업 혁명 이후 영국에서 밝은색 나방보다 어두운색 나방의 비율이 증가한 현상(공업 암화)의 원인으로 가장 적절한 것은?", "img": "", "o": [ { "t": "① 매연으로 어두워진 나무줄기 환경에서 어두운색 나방이 포식자(새)의 눈에 띄지 않아 생존율이 높아졌기 때문이다.", "a": 1, "r": "환경 변화(매연)에 의해 생존에 유리해진 형질(어두운색)이 자연 선택된 대표적 사례입니다." }, { "t": "② 매연을 마신 나방의 색깔이 어둡게 변했기 때문이다.", "a": 0, "r": "매연이 직접 나방의 색을 바꾼 것이 아닙니다." }, { "t": "③ 밝은색 나방이 어두운색 나방으로 스스로 색을 바꾸었기 때문이다.", "a": 0, "r": "나방이 의도적으로 색을 바꿀 수 없습니다." }, { "t": "④ 포식자가 밝은색 나방을 싫어하게 되었기 때문이다.", "a": 0, "r": "포식자는 눈에 띄는 나방을 잡아먹습니다." } ] },
  { "id": 31, "c": "진화와 자연선택", "q": "항생제를 남용할 때 항생제 내성 세균의 비율이 증가하는 원리로 옳은 것은?", "img": "", "o": [ { "t": "① 항생제가 세균에게 내성을 기르도록 훈련시켰다.", "a": 0, "r": "세균이 훈련하는 것이 아닙니다." }, { "t": "② 항생제 환경에서 이미 존재하던 내성 세균이 살아남아 증식했기 때문이다.", "a": 1, "r": "항생제는 내성 세균을 '선택'하는 환경적 요인으로 작용하여 내성 세균의 비율을 높입니다." }, { "t": "③ 세균이 항생제를 먹고 유전자 돌연변이를 즉시 일으켰기 때문이다.", "a": 0, "r": "돌연변이는 무작위로 일어나며 항생제가 유도한 것이 아닙니다." }, { "t": "④ 세균의 수명이 길어져서 늙은 세균이 내성을 가지게 되었다.", "a": 0, "r": "세균의 수명과 무관합니다." } ] },
  { "id": 32, "c": "진화와 자연선택", "q": "다윈의 진화론이 사회와 과학에 미친 영향으로 적절하지 않은 것은?", "img": "", "o": [ { "t": "① 생명 과학이 체계적인 학문으로 발전하는 기반을 마련했다.", "a": 0, "r": "적절한 설명입니다." }, { "t": "② 인간이 다른 생물과 마찬가지로 진화의 산물이라는 인식을 심어주었다.", "a": 0, "r": "적절한 설명입니다." }, { "t": "③ 제국주의자들에 의해 자본주의적 경쟁과 식민지 지배를 정당화하는 사회 진화론으로 오용되기도 했다.", "a": 0, "r": "적절한 설명입니다." }, { "t": "④ 유전학의 발전을 완전히 저해하고 멘델의 유전 법칙을 부정했다.", "a": 1, "r": "다윈 당시에는 유전의 원리가 밝혀지지 않았을 뿐, 유전학 발전을 저해한 것은 아닙니다. 훗날 종합설로 융합되었습니다." } ] },
  { "id": 33, "c": "진화와 자연선택", "q": "변이가 발생하는 근본적인 원인을 설명하는 현대 진화론의 개념 2가지는?", "img": "", "o": [ { "t": "① 용불용설과 자연선택", "a": 0, "r": "용불용설은 폐기된 이론입니다." }, { "t": "② 돌연변이와 유성 생식(생식세포의 다양한 조합)", "a": 1, "r": "현대 유전학에서는 DNA의 무작위적인 돌연변이와 유성 생식 과정에서의 유전자 재조합을 변이의 원인으로 봅니다." }, { "t": "③ 격리와 적자생존", "a": 0, "r": "종 분화의 과정입니다." }, { "t": "④ 획득 형질의 유전과 무성 생식", "a": 0, "r": "획득 형질은 유전되지 않습니다." } ] },
  { "id": 34, "c": "진화와 자연선택", "q": "한 종의 생물이 지리적으로 격리되어 서로 다른 환경에 적응하다가 결국 서로 교배할 수 없는 새로운 종으로 나뉘는 현상을 무엇이라 하는가?", "img": "", "o": [ { "t": "① 멸종", "a": 0, "r": "종이 사라지는 현상입니다." }, { "t": "② 종 분화", "a": 1, "r": "격리와 자연선택이 누적되어 생식적으로 격리되면 새로운 종이 되는 '종 분화'가 일어납니다." }, { "t": "③ 단성 생식", "a": 0, "r": "수정 없이 번식하는 방법입니다." }, { "t": "④ 대적응", "a": 0, "r": "진화론의 전문 용어와 맞지 않습니다." } ] },
  { "id": 35, "c": "진화와 자연선택", "q": "아프리카 지역에서 낫 모양 적혈구 빈혈증 유전자를 가진 사람이 정상인보다 말라리아에 덜 걸려 생존율이 높은 현상은 진화론의 어떤 원리로 설명할 수 있는가?", "img": "", "o": [ { "t": "① 돌연변이가 언제나 생존에 불리함을 보여준다.", "a": 0, "r": "불리한 형질이라도 특정 환경에서는 유리할 수 있습니다." }, { "t": "② 특정 환경(말라리아 유행)에서 생존에 유리한 형질(돌연변이)이 자연 선택된 것이다.", "a": 1, "r": "일반적으로는 병이지만, 말라리아 유행 지역에서는 말라리아 저항성이라는 유리한 조건이 되어 자연 선택되었습니다." }, { "t": "③ 말라리아 원충이 사람의 적혈구를 변형시킨 것이다.", "a": 0, "r": "유전적 형질입니다." }, { "t": "④ 인간의 유전자는 환경에 영향을 받지 않음을 증명한다.", "a": 0, "r": "영향을 받음을 증명합니다." } ] },
  { "id": 36, "c": "진화와 자연선택", "q": "자연 선택에서 '환경'이 의미하는 것으로 가장 포괄적이고 적절한 것은?", "img": "", "o": [ { "t": "① 기온과 강수량 같은 무기 환경만", "a": 0, "r": "생물적 요인도 포함됩니다." }, { "t": "② 포식자와 먹이 같은 생물 환경만", "a": 0, "r": "무기적 요인도 포함됩니다." }, { "t": "③ 생물을 둘러싼 모든 생물적, 비생물적 요인", "a": 1, "r": "자연 선택을 일으키는 환경에는 기후, 지형, 포식자, 먹이, 경쟁자 등 모든 요인이 포함됩니다." }, { "t": "④ 인간이 인위적으로 조성한 환경", "a": 0, "r": "이는 인위 선택에 가깝습니다." } ] },
  { "id": 37, "c": "진화와 자연선택", "q": "라마르크의 용불용설이 현대 과학에서 인정받지 못하는 결정적인 이유는?", "img": "", "o": [ { "t": "① 생물은 환경에 적응하지 않기 때문에", "a": 0, "r": "생물은 적응합니다." }, { "t": "② 살아가면서 후천적으로 얻은 '획득 형질'은 유전자를 변화시키지 않아 자손에게 유전되지 않기 때문에", "a": 1, "r": "운동으로 기른 근육(획득 형질)이 자녀에게 유전되지 않는 것과 같은 이치입니다." }, { "t": "③ 화석 증거가 전혀 발견되지 않아서", "a": 0, "r": "화석 증거의 문제가 아닙니다." }, { "t": "④ 용불용설은 종 분화를 완벽히 설명했기 때문에", "a": 0, "r": "설명하지 못했습니다." } ] },
  { "id": 38, "c": "진화와 자연선택", "q": "농약을 살포한 밭에서 살아남은 농약 내성 해충들이 번식하여 결국 농약이 듣지 않는 해충 집단이 되는 현상을 설명할 때, '자연 선택'의 주체(선택압)가 되는 것은?", "img": "", "o": [ { "t": "① 농약", "a": 1, "r": "농약이라는 살충 환경이 내성이 없는 해충을 죽이고 내성이 있는 해충만을 '선택'하는 역할을 합니다." }, { "t": "② 해충의 강한 의지", "a": 0, "r": "의지로 내성이 생기지 않습니다." }, { "t": "③ 식물의 저항성", "a": 0, "r": "농약 살포 상황입니다." }, { "t": "④ 돌연변이의 감소", "a": 0, "r": "돌연변이가 원인이긴 하나 선택압 자체는 농약입니다." } ] },
  { "id": 39, "c": "진화와 자연선택", "q": "진화의 증거 중 형태학적(비교 해부학적) 증거로, 기본 구조와 기원은 같으나 환경에 따라 모양과 기능이 달라진 기관은?", "img": "", "o": [ { "t": "① 상사 기관", "a": 0, "r": "기원은 다르나 기능이 같은 기관입니다(예: 새의 날개와 곤충의 날개)." }, { "t": "② 흔적 기관", "a": 0, "r": "퇴화되어 흔적만 남은 기관입니다." }, { "t": "③ 상동 기관", "a": 1, "r": "사람의 팔, 박쥐의 날개, 고래의 가슴지느러미처럼 기원과 기본 구조는 같으나 기능이 변한 기관을 상동 기관이라 합니다." }, { "t": "④ 감각 기관", "a": 0, "r": "일반적인 기관 명칭입니다." } ] },
  { "id": 40, "c": "진화와 자연선택", "q": "새의 날개와 곤충의 날개는 기능은 같지만 발생 기원이 다르다. 이러한 진화적 관계를 보여주는 기관을 무엇이라 하는가?", "img": "", "o": [ { "t": "① 상동 기관", "a": 0, "r": "기원이 같은 기관입니다." }, { "t": "② 상사 기관", "a": 1, "r": "기원은 다르지만 같은 환경(공중)에 적응하다 보니 형태와 기능이 비슷해진 기관을 상사 기관이라고 합니다(수렴 진화)." }, { "t": "③ 흔적 기관", "a": 0, "r": "퇴화된 기관입니다." }, { "t": "④ 호흡 기관", "a": 0, "r": "기관의 기능 분류입니다." } ] },
  { "id": 41, "c": "진화와 자연선택", "q": "사람의 꼬리뼈나 동귀머리(귀를 움직이는 근육)처럼 과거에는 기능이 있었으나 퇴화하여 흔적만 남은 기관은?", "img": "", "o": [ { "t": "① 상동 기관", "a": 0, "r": "기능이 다르게 적응한 기관입니다." }, { "t": "② 상사 기관", "a": 0, "r": "기능만 같은 기관입니다." }, { "t": "③ 흔적 기관", "a": 1, "r": "생물이 진화하면서 사용하지 않는 기관이 퇴화하여 흔적만 남은 기관입니다." }, { "t": "④ 생식 기관", "a": 0, "r": "번식을 위한 기관입니다." } ] },
  { "id": 42, "c": "진화와 자연선택", "q": "배아의 발생 과정을 비교하여 공통 조상을 가졌음을 추론하는 진화의 증거는?", "img": "", "o": [ { "t": "① 발생학적 증거", "a": 1, "r": "척추동물의 초기 배아(아가미 틈, 꼬리 등)가 매우 비슷한 점을 통해 공통 조상에서 진화했음을 아는 발생학적 증거입니다." }, { "t": "② 화석상의 증거", "a": 0, "r": "과거 생물의 유해로 확인합니다." }, { "t": "③ 분자 생물학적 증거", "a": 0, "r": "DNA나 단백질 서열을 비교합니다." }, { "t": "④ 생물 지리학적 증거", "a": 0, "r": "생물 분포로 확인합니다." } ] },
  { "id": 43, "c": "진화와 자연선택", "q": "침팬지와 사람의 유전자(DNA) 염기 서열이 98% 이상 일치한다는 사실은 진화의 어떤 증거에 해당하는가?", "img": "", "o": [ { "t": "① 비교 해부학적 증거", "a": 0, "r": "기관의 구조를 비교합니다." }, { "t": "② 발생학적 증거", "a": 0, "r": "배아를 비교합니다." }, { "t": "③ 화석상의 증거", "a": 0, "r": "화석을 비교합니다." }, { "t": "④ 분자 생물학적 증거", "a": 1, "r": "DNA 염기 서열이나 단백질 아미노산 서열을 비교하여 유연관계를 밝히는 것은 분자 생물학적 증거입니다." } ] },
  { "id": 44, "c": "진화와 자연선택", "q": "호주 대륙에 다른 대륙에서는 멸종한 캥거루, 오리너구리 같은 유대류와 단공류가 번성하는 현상을 설명하는 진화의 증거는?", "img": "", "o": [ { "t": "① 분자 생물학적 증거", "a": 0, "r": "유전자 비교가 아닙니다." }, { "t": "② 생물 지리학적 증거", "a": 1, "r": "대륙이 일찍 분리되어 지리적으로 격리된 상태에서 각기 다른 환경에 맞게 진화한 생물 지리학적 증거입니다." }, { "t": "③ 비교 해부학적 증거", "a": 0, "r": "구조 비교가 아닙니다." }, { "t": "④ 발생학적 증거", "a": 0, "r": "배아 비교가 아닙니다." } ] },
  { "id": 45, "c": "진화와 자연선택", "q": "자연 선택설의 한계점(다윈 시대 당시)을 가장 잘 지적한 것은?", "img": "", "o": [ { "t": "① 화석 증거를 전혀 무시했다.", "a": 0, "r": "다윈은 화석 증거를 중시했습니다." }, { "t": "② 개체 간의 변이가 왜 발생하는지, 어떻게 유전되는지 명확히 설명하지 못했다.", "a": 1, "r": "다윈 당시에는 유전학(DNA, 돌연변이 등)이 확립되지 않아 변이의 원인과 유전 원리를 설명하지 못했습니다." }, { "t": "③ 자연 선택 과정을 수학적으로만 증명하려 했다.", "a": 0, "r": "관찰을 바탕으로 했습니다." }, { "t": "④ 진화가 단기간에 일어난다고 주장했다.", "a": 0, "r": "점진적이고 오랜 시간에 걸쳐 일어난다고 보았습니다." } ] },
  { "id": 46, "c": "진화와 자연선택", "q": "오랜 시간 동안 환경이 변하지 않고 일정하게 유지된다면 생물 집단은 어떻게 될 가능성이 높은가?", "img": "", "o": [ { "t": "① 급격한 진화가 일어나 완전히 새로운 종이 된다.", "a": 0, "r": "환경 변화가 없으면 선택압이 약합니다." }, { "t": "② 현재 환경에 가장 잘 적응한 형질을 가진 개체들의 비율이 계속 유지된다.", "a": 1, "r": "안정적인 환경에서는 현재 적응한 형태(안정화 선택)가 지속적으로 유지되어 진화 속도가 느려집니다." }, { "t": "③ 돌연변이가 전혀 일어나지 않게 된다.", "a": 0, "r": "돌연변이는 무작위로 계속 일어납니다." }, { "t": "④ 모든 생물이 멸종한다.", "a": 0, "r": "환경이 일정하면 멸종 위험은 낮습니다." } ] },
  { "id": 47, "c": "진화와 자연선택", "q": "박쥐의 날개와 고래의 가슴지느러미는 뼈의 기본 구조가 같다. 이로부터 알 수 있는 사실은?", "img": "", "o": [ { "t": "① 박쥐가 바다로 들어가 고래가 되었다.", "a": 0, "r": "박쥐와 고래는 별개의 종입니다." }, { "t": "② 두 생물은 공통 조상으로부터 진화하여 각기 다른 환경에 적응했다.", "a": 1, "r": "상동 기관은 공통 조상으로부터 진화(적응 방산)했음을 보여주는 증거입니다." }, { "t": "③ 뼈의 구조는 진화와 무관하다.", "a": 0, "r": "형태학적 증거입니다." }, { "t": "④ 고래의 지느러미는 새의 날개와 기원이 완벽히 같다.", "a": 0, "r": "새는 조류, 고래는 포유류로 상동기관이긴 하나, 곤충의 날개와는 상사기관입니다." } ] },
  { "id": 48, "c": "진화와 자연선택", "q": "항생제 내성 세균의 진화에서 환경의 변화(선택압) 역할을 하는 요인은?", "img": "", "o": [ { "t": "① 세균의 크기", "a": 0, "r": "요인이 아닙니다." }, { "t": "② 항생제의 지속적인 사용", "a": 1, "r": "항생제의 사용이라는 새로운 환경이 내성이 없는 세균을 도태시키고 내성 세균을 자연 선택합니다." }, { "t": "③ 세균의 분열 속도", "a": 0, "r": "요인이 아닙니다." }, { "t": "④ 인간의 체온", "a": 0, "r": "항생제 내성의 주 요인이 아닙니다." } ] },
  { "id": 49, "c": "진화와 자연선택", "q": "갈라파고스 핀치의 부리가 씨앗을 부수기 좋은 굵은 부리, 곤충을 잡기 좋은 뾰족한 부리 등으로 다양해진 과정을 일컫는 진화적 용어는?", "img": "", "o": [ { "t": "① 적응 방산", "a": 1, "r": "하나의 공통 조상에서 다양한 환경(먹이)에 적응하며 여러 종으로 분화하는 현상을 적응 방산이라고 합니다." }, { "t": "② 수렴 진화", "a": 0, "r": "다른 조상이 비슷한 환경에서 비슷해지는 현상입니다." }, { "t": "③ 퇴화", "a": 0, "r": "기능을 잃는 것입니다." }, { "t": "④ 용불용설", "a": 0, "r": "라마르크의 폐기된 학설입니다." } ] },
  { "id": 50, "c": "진화와 자연선택", "q": "사람과 고릴라의 시토크롬 C(호흡 효소) 아미노산 서열 차이는 1개인 반면, 사람과 효모는 40개가 넘게 차이가 난다. 이것이 시사하는 바는?", "img": "", "o": [ { "t": "① 사람은 효모에서 직접 진화했다.", "a": 0, "r": "차이가 큽니다." }, { "t": "② 서열 차이가 적을수록 유연관계가 멀다.", "a": 0, "r": "차이가 적을수록 가깝습니다." }, { "t": "③ 서열 차이가 적을수록 유연관계가 가깝다(최근에 공통 조상에서 갈라졌다).", "a": 1, "r": "분자 생물학적 증거로, DNA나 아미노산 서열이 비슷할수록 진화적으로 가까운 관계(유연관계가 깊음)입니다." }, { "t": "④ 아미노산 서열은 진화와 무관하다.", "a": 0, "r": "매우 밀접한 관련이 있습니다." } ] },
  { "id": 51, "c": "생물 다양성", "q": "생물 다양성을 구성하는 세 가지 의미(요소)에 해당하지 않는 것은?", "img": "", "o": [ { "t": "① 유전적 다양성", "a": 0, "r": "같은 종 내의 유전자 차이입니다." }, { "t": "② 종 다양성", "a": 0, "r": "일정 지역 내 생물 종의 다양한 정도입니다." }, { "t": "③ 생태계 다양성", "a": 0, "r": "환경과 서식지의 다양함입니다." }, { "t": "④ 형태적 다양성", "a": 1, "r": "형태적 다양성은 유전적/종 다양성의 결과일 뿐, 생물 다양성을 구분하는 3대 기본 축(유전, 종, 생태계)에는 포함되지 않습니다." } ] },
  { "id": 52, "c": "생물 다양성", "q": "같은 종의 달팽이라도 껍데기의 무늬와 색깔이 제각기 다른 현상과 가장 관련 깊은 생물 다양성은?", "img": "", "o": [ { "t": "① 유전적 다양성", "a": 1, "r": "동일한 종 내에서 나타나는 개체 간의 형질(변이) 차이는 유전자의 차이에서 비롯되므로 유전적 다양성입니다." }, { "t": "② 종 다양성", "a": 0, "r": "서로 다른 종들의 수와 비율을 의미합니다." }, { "t": "③ 생태계 다양성", "a": 0, "r": "서식지 종류의 다양성입니다." }, { "t": "④ 환경 다양성", "a": 0, "r": "생태계 다양성에 포함됩니다." } ] },
  { "id": 53, "c": "생물 다양성", "q": "유전적 다양성이 높을 때 나타나는 가장 큰 장점은?", "img": "", "o": [ { "t": "① 멸종될 확률이 급격히 높아진다.", "a": 0, "r": "멸종 확률이 낮아집니다." }, { "t": "② 환경이 급격히 변하거나 전염병이 돌았을 때 종 전체가 살아남을 확률이 높다.", "a": 1, "r": "다양한 유전자를 가진 개체들이 있으면 새로운 환경이나 질병에 저항성을 가진 개체가 존재할 확률이 높아 멸종을 피할 수 있습니다." }, { "t": "③ 새로운 종이 생성되는 것을 완벽히 막아준다.", "a": 0, "r": "오히려 진화와 종 분화의 원동력이 됩니다." }, { "t": "④ 모든 개체의 생김새가 완전히 똑같아져 관리가 편하다.", "a": 0, "r": "생김새가 다양해집니다." } ] },
  { "id": 54, "c": "생물 다양성", "q": "1840년대 아일랜드에서 단일 품종의 감자만 재배하다가 감자잎마름병이 돌아 감자 농사가 전멸하고 대기근이 발생한 사건은 무엇의 중요성을 보여주는가?", "img": "", "o": [ { "t": "① 종 다양성", "a": 0, "r": "같은 감자 내의 문제입니다." }, { "t": "② 생태계 다양성", "a": 0, "r": "환경의 문제가 아닙니다." }, { "t": "③ 유전적 다양성", "a": 1, "r": "단일 품종 재배로 유전적 다양성이 낮아져 질병에 한꺼번에 취약해졌음을 보여주는 대표적 사례입니다." }, { "t": "④ 먹이 사물의 복잡성", "a": 0, "r": "먹이 그물과 무관합니다." } ] },
  { "id": 55, "c": "생물 다양성", "q": "일정 지역 내에 얼마나 많은 종이 고르게 분포하는가를 나타내는 척도는?", "img": "", "o": [ { "t": "① 개체군 밀도", "a": 0, "r": "한 종의 빽빽한 정도입니다." }, { "t": "② 유전적 다양성", "a": 0, "r": "동일 종 내의 다양성입니다." }, { "t": "③ 생태계 다양성", "a": 0, "r": "환경의 다양성입니다." }, { "t": "④ 종 다양성", "a": 1, "r": "종의 수(풍부도)와 각 종의 개체 수 비율(균등도)을 합쳐 종 다양성이라고 합니다." } ] },
  { "id": 56, "c": "생물 다양성", "q": "두 지역 A와 B에 각각 4종의 나무가 총 100그루씩 있다. A지역은 한 종이 97그루, 나머지 3종이 각 1그루씩 있고, B지역은 4종이 각 25그루씩 있다. 종 다양성이 더 높은 지역과 그 이유는?", "img": "", "o": [ { "t": "① A지역, 특정 종이 우점하고 있기 때문", "a": 0, "r": "우점종이 너무 강하면 종 다양성은 낮게 평가됩니다." }, { "t": "② B지역, 종의 수가 A지역보다 더 많기 때문", "a": 0, "r": "종의 수는 4종으로 같습니다." }, { "t": "③ B지역, 각 종의 개체 수가 고르게 분포하기 때문", "a": 1, "r": "종의 수(풍부도)가 같을 때는 각 종의 비율이 고를수록(균등도) 종 다양성이 높습니다." }, { "t": "④ 두 지역의 종 다양성은 같다.", "a": 0, "r": "B가 더 높습니다." } ] },
  { "id": 57, "c": "생물 다양성", "q": "종 다양성이 높은 생태계의 특징으로 가장 알맞은 것은?", "img": "", "o": [ { "t": "① 먹이 그물이 단순하여 특정 생물 멸종 시 생태계 전체가 붕괴하기 쉽다.", "a": 0, "r": "먹이 그물이 복잡해집니다." }, { "t": "② 먹이 그물이 복잡하게 얽혀 있어 생태계 평형이 잘 유지된다.", "a": 1, "r": "종이 다양하면 대체 먹이가 많아져 먹이 그물이 복잡해지고, 환경 변화에도 생태계가 쉽게 무너지지 않습니다." }, { "t": "③ 특정 한 종이 생태계를 완전히 독점한다.", "a": 0, "r": "이는 종 다양성이 낮은 곳의 특징입니다." }, { "t": "④ 외부 환경 변화에 매우 취약하다.", "a": 0, "r": "저항성이 강합니다." } ] },
  { "id": 58, "c": "생물 다양성", "q": "산림, 초원, 사막, 갯벌, 호수 등 생물이 서식하는 환경의 다양한 정도를 뜻하는 용어는?", "img": "", "o": [ { "t": "① 유전적 다양성", "a": 0, "r": "유전자의 다양성입니다." }, { "t": "② 종 다양성", "a": 0, "r": "생물 종의 다양성입니다." }, { "t": "③ 생태계 다양성", "a": 1, "r": "생물이 살아가는 무기 환경과 서식지의 다양성을 생태계 다양성이라고 합니다." }, { "t": "④ 지형 다양성", "a": 0, "r": "지형학적 용어입니다." } ] },
  { "id": 59, "c": "생물 다양성", "q": "생태계 다양성이 높을 때 나타나는 결과로 가장 적절한 것은?", "img": "", "o": [ { "t": "① 생물 종 다양성도 함께 높아진다.", "a": 1, "r": "다양한 서식지(생태계)가 존재하면 그 환경에 적응한 다양한 종이 서식할 수 있어 종 다양성도 함께 높아집니다." }, { "t": "② 유전적 다양성이 감소한다.", "a": 0, "r": "유전적 다양성도 증가할 가능성이 큽니다." }, { "t": "③ 모든 생물 종이 한곳으로 모이게 된다.", "a": 0, "r": "서식지가 나뉘어 각자 적응합니다." }, { "t": "④ 생태계의 평형이 쉽게 깨진다.", "a": 0, "r": "안정적으로 유지됩니다." } ] },
  { "id": 60, "c": "생물 다양성", "q": "해수와 담수가 만나는 곳으로, 영양염류가 풍부하여 종 다양성이 매우 높은 생태계는?", "img": "", "o": [ { "t": "① 사막 생태계", "a": 0, "r": "물이 부족하여 종 다양성이 낮습니다." }, { "t": "② 열대 우림 생태계", "a": 0, "r": "가장 종 다양성이 높으나 해수/담수 교차점은 아닙니다." }, { "t": "③ 갯벌 생태계(하구 생태계)", "a": 1, "r": "강물과 바닷물이 섞이는 하구(갯벌)는 영양물질이 풍부하여 플랑크톤부터 새들까지 다양한 생물이 사는 종 다양성의 보고입니다." }, { "t": "④ 깊은 심해 생태계", "a": 0, "r": "극한 환경으로 다양성이 상대적으로 낮습니다." } ] },
  { "id": 61, "c": "생물 다양성", "q": "지구상에서 종 다양성이 가장 높은 생태계로 꼽히는 곳은?", "img": "", "o": [ { "t": "① 열대 우림", "a": 1, "r": "고온 다습한 기후로 식물이 울창하게 자라며, 이로 인해 서식지와 먹이가 풍부하여 육상 생태계 중 종 다양성이 가장 높습니다." }, { "t": "② 한대 타이가(침엽수림)", "a": 0, "r": "추워서 종 다양성이 낮습니다." }, { "t": "③ 사막", "a": 0, "r": "극한 환경입니다." }, { "t": "④ 툰드라", "a": 0, "r": "극지방 주변으로 종 다양성이 낮습니다." } ] },
  { "id": 62, "c": "생물 다양성", "q": "생물 다양성이 인간에게 주는 직접적 혜택(자원으로서의 가치)이 아닌 것은?", "img": "", "o": [ { "t": "① 식량 자원 제공 (벼, 밀, 옥수수 등)", "a": 0, "r": "직접적 가치입니다." }, { "t": "② 의약품 원료 제공 (주목나무의 항암제, 푸른곰팡이의 페니실린 등)", "a": 0, "r": "직접적 가치입니다." }, { "t": "③ 의복 및 주택의 재료 제공 (목화, 목재 등)", "a": 0, "r": "직접적 가치입니다." }, { "t": "④ 대기의 산소와 이산화탄소 농도 조절 유지", "a": 1, "r": "이는 생태계가 주는 '간접적/환경적 혜택(조절 서비스)'으로, 직접 소비하는 자원 가치와는 구분됩니다." } ] },
  { "id": 63, "c": "생물 다양성", "q": "버드나무 껍질에서 추출하여 해열 진통제(아스피린)의 원료로 사용된 물질은?", "img": "", "o": [ { "t": "① 페니실린", "a": 0, "r": "푸른곰팡이에서 추출한 항생제입니다." }, { "t": "② 택솔", "a": 0, "r": "주목나무에서 추출한 항암제입니다." }, { "t": "③ 살리실산", "a": 1, "r": "버드나무 껍질에서 추출한 살리실산은 아스피린의 주원료입니다. 생물 다양성의 의약품 가치 사례입니다." }, { "t": "④ 퀴닌", "a": 0, "r": "기나나무 껍질에서 추출한 말라리아 치료제입니다." } ] },
  { "id": 64, "c": "생물 다양성", "q": "푸른곰팡이에서 추출하여 인류 최초의 항생제로 쓰인 물질은?", "img": "", "o": [ { "t": "① 아스피린", "a": 0, "r": "버드나무 추출물 기반입니다." }, { "t": "② 페니실린", "a": 1, "r": "플레밍이 발견한 푸른곰팡이 유래 항생제입니다." }, { "t": "③ 팔각회향", "a": 0, "r": "타미플루 원료입니다." }, { "t": "④ 모르핀", "a": 0, "r": "양귀비 추출 진통제입니다." } ] },
  { "id": 65, "c": "생물 다양성", "q": "생물 다양성이 주는 간접적 가치(생태계 서비스)에 해당하는 것은?", "img": "", "o": [ { "t": "① 목재 생산", "a": 0, "r": "직접적 가치입니다." }, { "t": "② 유전자 조작 농산물(GMO) 개발을 위한 유전자원 제공", "a": 0, "r": "직접적/미래적 가치입니다." }, { "t": "③ 수질 정화, 토양 침식 방지, 기후 조절", "a": 1, "r": "자연 생태계 자체가 유지됨으로써 인간에게 베푸는 환경적, 간접적 서비스입니다." }, { "t": "④ 관광 수입 창출을 위해 동물을 포획하여 동물원에 전시", "a": 0, "r": "생태 관광 자체는 가치가 있으나 포획 전시는 간접 서비스가 아닙니다." } ] },
  { "id": 66, "c": "생물 다양성", "q": "야생콩이 재배콩보다 질병에 대한 저항성이 높은 경우가 많다. 야생종 보존이 중요한 이유를 생물 다양성의 관점에서 바르게 설명한 것은?", "img": "", "o": [ { "t": "① 야생종은 농약 없이도 크기가 무한히 커지기 때문", "a": 0, "r": "사실이 아닙니다." }, { "t": "② 재배종에 부족한 유전적 다양성을 야생종이 보완해 줄 유전자원(신품종 개발 등)이 되기 때문", "a": 1, "r": "야생종은 다양한 유전자를 보유하고 있어 훗날 질병 저항성 작물 등을 개발할 때 귀중한 유전자원이 됩니다." }, { "t": "③ 야생종이 재배종보다 항상 맛이 좋기 때문", "a": 0, "r": "맛을 위해 재배종을 개량했습니다." }, { "t": "④ 야생종은 광합성을 하지 않아 관리가 편하기 때문", "a": 0, "r": "식물은 광합성을 합니다." } ] },
  { "id": 67, "c": "생물 다양성", "q": "같은 종의 사람이라도 피부색, 머리카락 모양, 눈동자 색이 다른 것은 어떤 다양성 때문인가?", "img": "", "o": [ { "t": "① 생태계 다양성", "a": 0, "r": "서식지의 다양성입니다." }, { "t": "② 종 다양성", "a": 0, "r": "여러 종의 다양성입니다." }, { "t": "③ 유전적 다양성", "a": 1, "r": "동일한 사람(호모 사피엔스) 종 내에서 유전자의 차이로 나타나는 형질의 다양성입니다." }, { "t": "④ 진화 다양성", "a": 0, "r": "공식 용어가 아닙니다." } ] },
  { "id": 68, "c": "생물 다양성", "q": "무당벌레의 겉날개 무늬가 조금씩 다른 현상은?", "img": "", "o": [ { "t": "① 생태계 다양성", "a": 0, "r": "관련이 없습니다." }, { "t": "② 종 다양성", "a": 0, "r": "무당벌레라는 단일 종 내부의 문제입니다." }, { "t": "③ 유전적 다양성", "a": 1, "r": "같은 무당벌레 종 내에서 유전적 차이로 무늬 변이가 나타납니다." }, { "t": "④ 환경 다양성", "a": 0, "r": "관련 없습니다." } ] },
  { "id": 69, "c": "생물 다양성", "q": "다음 중 종 다양성을 측정하는 데 필요한 두 가지 요소는?", "img": "", "o": [ { "t": "① 종의 크기와 수명", "a": 0, "r": "틀린 설명입니다." }, { "t": "② 종의 수(풍부도)와 개체 수의 균일도(균등도)", "a": 1, "r": "몇 종이 사는지, 그리고 각 종이 얼마나 골고루 분포하는지가 종 다양성의 척도입니다." }, { "t": "③ 먹이 사슬의 길이와 포식자의 수", "a": 0, "r": "틀린 설명입니다." }, { "t": "④ 유전자의 개수와 돌연변이율", "a": 0, "r": "유전적 다양성 요소입니다." } ] },
  { "id": 70, "c": "생물 다양성", "q": "우리나라의 '시화호'는 인공 방조제로 막혀 담수호가 되었다가 수질오염이 심각해지자 바닷물을 다시 유통시켜 갯벌이 복원되고 생태계가 살아났다. 이는 어떤 다양성의 회복을 보여주는가?", "img": "", "o": [ { "t": "① 유전적 다양성", "a": 0, "r": "유전자 복원이 초점이 아닙니다." }, { "t": "② 종 다양성", "a": 0, "r": "결과적으로 종도 다양해졌으나 근본은 서식지 복원입니다." }, { "t": "③ 생태계 다양성", "a": 1, "r": "바닷물이 통하게 함으로써 갯벌(하구)이라는 특정한 '생태계 환경'을 복원한 사례입니다." }, { "t": "④ 분자 다양성", "a": 0, "r": "틀린 설명입니다." } ] },
  { "id": 71, "c": "생물 다양성", "q": "생물 다양성이 감소하면 인류에게 미치는 영향으로 가장 거리가 먼 것은?", "img": "", "o": [ { "t": "① 새로운 질병에 대한 치료제 원료 확보가 어려워진다.", "a": 0, "r": "맞는 설명입니다." }, { "t": "② 생태계 평형이 깨져 인간의 생존 환경도 위협받는다.", "a": 0, "r": "맞는 설명입니다." }, { "t": "③ 유전자원이 고갈되어 농작물 신품종 개발이 어려워진다.", "a": 0, "r": "맞는 설명입니다." }, { "t": "④ 단일 품종 재배가 더욱 안전하고 경제적으로 변한다.", "a": 1, "r": "다양성이 감소하면 단일 품종 재배 시 전염병에 의해 한 번에 전멸할 위험이 커지므로 전혀 안전하지 않습니다." } ] },
  { "id": 72, "c": "생물 다양성", "q": "다양한 서식지가 파괴되어 하나의 거대한 서식지로 통일될 때 발생하는 문제점은?", "img": "", "o": [ { "t": "① 생태계 다양성 감소로 인해 종 다양성도 함께 감소한다.", "a": 1, "r": "서식지가 단조로워지면 그곳에 살 수 있는 생물 종도 줄어듭니다." }, { "t": "② 생물들이 경쟁 없이 더 편안하게 번식한다.", "a": 0, "r": "경쟁이 치열해지고 적응하지 못한 종은 멸종합니다." }, { "t": "③ 유전적 다양성이 폭발적으로 증가한다.", "a": 0, "r": "다양성이 전반적으로 감소합니다." }, { "t": "④ 생태계 서비스 기능이 크게 강화된다.", "a": 0, "r": "서비스 기능이 약화됩니다." } ] },
  { "id": 73, "c": "생물 다양성", "q": "먹이 그물이 복잡한 생태계가 생태계 평형을 잘 유지하는 이유는?", "img": "", "o": [ { "t": "① 포식자가 먹이를 찾기 어려워 굶어 죽기 때문", "a": 0, "r": "오히려 대체 먹이가 많습니다." }, { "t": "② 한 종이 멸종하더라도 대체할 수 있는 다른 먹이 생물이 존재하기 때문", "a": 1, "r": "복잡한 먹이 그물에서는 대안 경로가 존재하여 시스템 전체가 쉽게 붕괴하지 않습니다." }, { "t": "③ 생산자의 광합성량이 감소하여 에너지가 절약되기 때문", "a": 0, "r": "틀린 설명입니다." }, { "t": "④ 질병이 전혀 발생하지 않기 때문", "a": 0, "r": "질병은 언제나 발생할 수 있습니다." } ] },
  { "id": 74, "c": "생물 다양성", "q": "유전적 다양성을 보존하기 위한 인간의 노력으로 가장 적절한 것은?", "img": "", "o": [ { "t": "① 가장 수확량이 많은 한 가지 품종만 집중적으로 재배한다.", "a": 0, "r": "유전적 다양성을 훼손하는 길입니다." }, { "t": "② 야생 작물과 다양한 토종 종자를 '종자은행(Seed Bank)'에 보존한다.", "a": 1, "r": "미래를 대비해 다양한 유전자를 확보하고 보존하는 방법입니다." }, { "t": "③ 병든 개체를 무조건 도태시키고 복제 생물만 양산한다.", "a": 0, "r": "복제는 유전적 동일성을 높여 위험합니다." }, { "t": "④ 외래종을 적극적으로 수입하여 자연에 푼다.", "a": 0, "r": "토종 생태계를 파괴합니다." } ] },
  { "id": 75, "c": "생물 다양성", "q": "생물 다양성에 대한 설명 중 옳지 않은 것은?", "img": "", "o": [ { "t": "① 유전적 다양성, 종 다양성, 생태계 다양성을 모두 포함하는 개념이다.", "a": 0, "r": "맞는 설명입니다." }, { "t": "② 생태계 다양성이 높을수록 종 다양성도 높아지는 경향이 있다.", "a": 0, "r": "맞는 설명입니다." }, { "t": "③ 농작물의 단일 재배는 유전적 다양성을 높이는 효과적인 방법이다.", "a": 1, "r": "단일 재배는 유전적 다양성을 크게 '낮추어' 질병에 취약하게 만듭니다." }, { "t": "④ 인간의 생존과 복지는 생물 다양성이 제공하는 생태계 서비스에 의존한다.", "a": 0, "r": "맞는 설명입니다." } ] },
  { "id": 76, "c": "다양성 보전", "q": "생물 다양성을 감소시키는 가장 큰 원인 1순위로 꼽히는 것은?", "img": "", "o": [ { "t": "① 외래 생물 도입", "a": 0, "r": "원인이지만 1순위는 아닙니다." }, { "t": "② 서식지 파괴 및 단편화", "a": 1, "r": "숲을 깎고 습지를 메우는 등 서식지를 직접 파괴하거나 분할하는 것이 멸종의 가장 큰 원인입니다." }, { "t": "③ 불법 포획 및 남획", "a": 0, "r": "원인이지만 서식지 파괴가 더 심각합니다." }, { "t": "④ 대기 오염", "a": 0, "r": "간접적 원인입니다." } ] },
  { "id": 77, "c": "다양성 보전", "q": "도로나 철도 건설 등으로 인해 하나의 큰 서식지가 여러 개의 작은 서식지로 나뉘는 현상을 무엇이라 하는가?", "img": "", "o": [ { "t": "① 서식지 복원", "a": 0, "r": "파괴의 반대입니다." }, { "t": "② 서식지 단편화", "a": 1, "r": "면적이 줄어들고 가장자리 비율이 늘어나 내부 서식 생물에게 큰 타격을 주는 '서식지 단편화(파편화)'입니다." }, { "t": "③ 생태 통로", "a": 0, "r": "단편화를 극복하기 위한 대책입니다." }, { "t": "④ 남획", "a": 0, "r": "과도하게 잡는 행위입니다." } ] },
  { "id": 78, "c": "다양성 보전", "q": "서식지 단편화가 일어났을 때 생태계에 미치는 영향으로 옳은 것은?", "img": "", "o": [ { "t": "① 서식지의 총 면적이 증가한다.", "a": 0, "r": "도로 등으로 인해 총 면적은 감소합니다." }, { "t": "② 서식지 내부 면적이 줄어들고, 가장자리 면적 비율이 늘어난다.", "a": 1, "r": "가장자리 환경이 증가하여 숲 깊은 곳에 사는 생물들이 살 곳을 잃게 됩니다." }, { "t": "③ 동물들의 이동이 원활해져 종 다양성이 증가한다.", "a": 0, "r": "도로에 의해 로드킬 등 이동이 단절됩니다." }, { "t": "④ 생물 개체군 간의 교류가 늘어나 유전적 다양성이 높아진다.", "a": 0, "r": "교류가 단절되어 고립됩니다." } ] },
  { "id": 79, "c": "다양성 보전", "q": "서식지 단편화로 고립된 생물 개체군을 연결하여 야생 동물이 안전하게 이동할 수 있도록 인공적으로 만든 구조물은?", "img": "", "o": [ { "t": "① 댐", "a": 0, "r": "물을 가두는 구조물로 수생태계를 단절시킵니다." }, { "t": "② 방음벽", "a": 0, "r": "소음을 막으나 이동을 차단합니다." }, { "t": "③ 생태 통로(Eco-corridor)", "a": 1, "r": "단절된 서식지를 이어주어 동물의 이동을 돕고 로드킬을 방지하는 다리나 터널입니다." }, { "t": "④ 국립공원", "a": 0, "r": "구조물이 아니라 보전 구역입니다." } ] },
  { "id": 80, "c": "다양성 보전", "q": "가시박, 황소개구리, 배스, 뉴트리아 등의 공통점과 이들이 생물 다양성에 미치는 영향은?", "img": "", "o": [ { "t": "① 멸종 위기종으로 보호가 시급하다.", "a": 0, "r": "이들은 외래종(생태계 교란종)입니다." }, { "t": "② 토종 생물과 먹이 및 서식지 경쟁을 하여 토종 생물을 위협하는 외래 생물이다.", "a": 1, "r": "천적이 없는 새로운 환경에 도입되어 무분별하게 번식하며 고유 생태계를 파괴하는 생태계 교란종입니다." }, { "t": "③ 유전적 다양성을 높여주어 유익한 종이다.", "a": 0, "r": "고유종을 멸종시켜 다양성을 떨어뜨립니다." }, { "t": "④ 환경 오염을 정화하는 지표 생물이다.", "a": 0, "r": "전혀 무관합니다." } ] },
  { "id": 81, "c": "다양성 보전", "q": "외래 생물(도입종)이 새로운 환경에서 급격히 번성하여 생태계 평형을 깨는 주된 이유로 가장 적절한 것은?", "img": "", "o": [ { "t": "① 수명이 비정상적으로 길기 때문이다.", "a": 0, "r": "수명 문제라기보다 천적 부재가 큽니다." }, { "t": "② 그들을 포식하거나 억제할 '천적'이 새로운 환경에 없기 때문이다.", "a": 1, "r": "새로운 서식지에는 자연적인 천적이 없어 기하급수적으로 번식하여 생태계 우위를 점하게 됩니다." }, { "t": "③ 번식 능력을 스스로 강화하는 돌연변이를 즉시 일으키기 때문이다.", "a": 0, "r": "돌연변이가 주원인은 아닙니다." }, { "t": "④ 토종 생물이 외래 생물에게 자발적으로 서식지를 양보하기 때문이다.", "a": 0, "r": "경쟁에서 밀리는 것입니다." } ] },
  { "id": 82, "c": "다양성 보전", "q": "야생 동식물을 허가 없이 마구 잡거나 캐는 행위를 뜻하며, 코뿔소(뿔)와 코끼리(상아) 멸종 위기의 주원인이 되는 것은?", "img": "", "o": [ { "t": "① 단편화", "a": 0, "r": "서식지를 쪼개는 것입니다." }, { "t": "② 남획", "a": 1, "r": "자정 능력(번식 속도)을 넘어설 정도로 생물을 과도하게 포획(남획)하면 종이 멸종 위기에 처합니다." }, { "t": "③ 부영양화", "a": 0, "r": "수질 오염 현상입니다." }, { "t": "④ 생물 농축", "a": 0, "r": "독성 물질이 체내에 쌓이는 현상입니다." } ] },
  { "id": 83, "c": "다양성 보전", "q": "이산화탄소 증가 등으로 인한 지구 온난화와 기상이변이 생물 다양성에 미치는 영향으로 가장 거리가 먼 것은?", "img": "", "o": [ { "t": "① 해수면 상승으로 얕은 바다나 갯벌 서식지가 파괴된다.", "a": 0, "r": "온난화의 영향이 맞습니다." }, { "t": "② 기후 변화 속도를 따라가지 못한 생물들이 멸종한다.", "a": 0, "r": "영향이 맞습니다." }, { "t": "③ 극지방 빙하 감소로 북극곰 등의 서식지가 사라진다.", "a": 0, "r": "영향이 맞습니다." }, { "t": "④ 기온이 상승하여 모든 생물의 수명이 2배 이상 연장된다.", "a": 1, "r": "기온 상승이 수명 연장을 보장하지 않으며, 오히려 생태계 교란으로 생존을 위협합니다." } ] },
  { "id": 84, "c": "다양성 보전", "q": "국제 사회가 멸종 위기에 처한 야생 동식물의 국제 거래를 엄격히 규제하기 위해 맺은 협약은?", "img": "", "o": [ { "t": "① 람사르 협약 (Ramsar Convention)", "a": 0, "r": "물새 서식지인 습지를 보호하는 협약입니다." }, { "t": "② 멸종위기 야생동식물 국제거래 협약 (CITES)", "a": 1, "r": "사이테스(CITES)는 불법 밀수 및 남획으로부터 멸종 위기종을 보호하기 위한 국제 무역 규제 협약입니다." }, { "t": "③ 교토 의정서 (Kyoto Protocol)", "a": 0, "r": "온실가스 감축 목표를 정한 협약입니다." }, { "t": "④ 몬트리올 의정서", "a": 0, "r": "오존층 파괴 물질을 규제합니다." } ] },
  { "id": 85, "c": "다양성 보전", "q": "물새 서식지로서 중요한 가치를 지니는 전 세계의 '습지'를 보호하기 위해 체결된 국제 협약은?", "img": "", "o": [ { "t": "① 파리 기후 협약", "a": 0, "r": "지구 온난화 방지 협약입니다." }, { "t": "② 생물 다양성 협약 (CBD)", "a": 0, "r": "전반적인 생물 다양성 보전과 지속가능한 이용을 위한 협약입니다." }, { "t": "③ 람사르 협약", "a": 1, "r": "늪, 갯벌 등 생태적 가치가 높은 습지를 보호하기 위한 협약(우리나라 우포늪 등 등록)입니다." }, { "t": "④ CITES", "a": 0, "r": "야생동식물 거래 규제입니다." } ] },
  { "id": 86, "c": "다양성 보전", "q": "국가 수준에서 생물 다양성을 보전하기 위한 노력에 해당하는 것은?", "img": "", "o": [ { "t": "① 국립 공원 및 생태계 보전 지역 지정", "a": 1, "r": "정부(국가) 차원에서 법으로 구역을 정해 개발을 제한하고 서식지를 보호하는 대표적인 방법입니다." }, { "t": "② 개인의 취미를 위한 무허가 수렵", "a": 0, "r": "파괴 행위입니다." }, { "t": "③ 외래 생물의 무분별한 수입 장려", "a": 0, "r": "파괴 행위입니다." }, { "t": "④ 국제 협약 체결 거부", "a": 0, "r": "보전을 저해합니다." } ] },
  { "id": 87, "c": "다양성 보전", "q": "개인 수준에서 생물 다양성을 보전하기 위한 실천 방안으로 가장 알맞은 것은?", "img": "", "o": [ { "t": "① 일회용품 사용을 생활화한다.", "a": 0, "r": "환경 오염을 가중시킵니다." }, { "t": "② 외국 여행에서 신기한 곤충을 몰래 가져와 키우다 놓아준다.", "a": 0, "r": "외래종 유입의 원인이 됩니다." }, { "t": "③ 쓰레기 분리배출, 친환경 제품 사용, 에너지 절약을 실천한다.", "a": 1, "r": "자원 절약과 환경 오염 방지는 기후 변화를 막고 서식지를 보호하는 훌륭한 개인적 실천입니다." }, { "t": "④ 보호구역에 몰래 들어가 희귀 식물을 캐와 집에서 기른다.", "a": 0, "r": "생태계를 파괴하는 불법 행위입니다." } ] },
  { "id": 88, "c": "다양성 보전", "q": "멸종 위기 식물의 종자를 영하 20도 이하의 특수 시설에 얼려 장기 보관함으로써 미래의 재난이나 멸종에 대비하는 시설은?", "img": "", "o": [ { "t": "① 생태 통로", "a": 0, "r": "동물 이동 통로입니다." }, { "t": "② 종자 은행 (Seed Vault / Seed Bank)", "a": 1, "r": "유전적 다양성 확보를 위해 다양한 식물의 씨앗(종자)을 안전하게 영구 보존하는 시설입니다 (예: 한국의 백두대간 글로벌 시드볼트)." }, { "t": "③ 식물원", "a": 0, "r": "전시 및 교육 목적이 더 큽니다." }, { "t": "④ 국립공원", "a": 0, "r": "자연 상태 보호 구역입니다." } ] },
  { "id": 89, "c": "다양성 보전", "q": "최근 꿀벌의 군집 붕괴 현상(CCD)으로 꿀벌 개체 수가 급감하고 있다. 이 현상이 인간에게 미칠 수 있는 가장 치명적인 영향은?", "img": "", "o": [ { "t": "① 꿀을 먹지 못해 인간의 당뇨병이 줄어든다.", "a": 0, "r": "주된 위협 요소가 아닙니다." }, { "t": "② 꿀벌이 쏘는 사고가 줄어 안전해진다.", "a": 0, "r": "긍정적인 면보다 부정적인 면이 압도적입니다." }, { "t": "③ 꽃가루받이(수분)를 매개하는 곤충이 사라져 농작물 생산량이 급감하고 식량 위기가 발생한다.", "a": 1, "r": "꿀벌은 생태계 서비스(화분 매개)의 핵심으로, 꿀벌 멸종은 인류의 농업과 식량 생산에 치명적 타격을 줍니다." }, { "t": "④ 양봉업자들의 수입만 감소할 뿐 일반인과는 무관하다.", "a": 0, "r": "인류 전체의 식량 안보 문제입니다." } ] },
  { "id": 90, "c": "다양성 보전", "q": "도시화로 인해 생물 서식지가 파괴될 때, 건물 옥상에 정원을 가꾸거나 벽면에 식물을 심는 등 도심 속 인공 서식지를 조성하는 가장 큰 목적은?", "img": "", "o": [ { "t": "① 건물의 붕괴를 촉진하기 위해", "a": 0, "r": "상식에 어긋납니다." }, { "t": "② 생물에게 작은 서식지와 징검다리 피난처(비오톱)를 제공하여 도심 생태계를 살리기 위해", "a": 1, "r": "도시의 열섬 현상을 완화하고 새나 곤충에게 서식지를 제공하여 생물 다양성을 일부나마 회복하려는 노력입니다." }, { "t": "③ 건물의 온도를 높여 난방비를 절약하기 위해", "a": 0, "r": "여름철 냉방비 절감(단열)에 유리합니다." }, { "t": "④ 외래종을 집중적으로 번식시키기 위해", "a": 0, "r": "토착 생태계 보전이 목적입니다." } ] },
  { "id": 91, "c": "종합문제", "q": "지질 시대의 환경과 생물 진화의 관계를 설명한 것으로 옳지 않은 것은?", "img": "", "o": [ { "t": "① 수륙 분포의 변화(판게아 형성 등)는 기후와 해류를 바꿔 생물의 대멸종을 유발하기도 했다.", "a": 0, "r": "페름기 멸종의 주요 원인 중 하나입니다." }, { "t": "② 대기 중 산소의 증가는 오존층을 형성하여 생물의 육상 진출을 이끌었다.", "a": 0, "r": "고생대 실루리아기의 중요한 사건입니다." }, { "t": "③ 빙하기와 간빙기의 교대는 생물의 서식지를 이동시키며 진화와 멸종에 영향을 주었다.", "a": 0, "r": "맞는 설명입니다." }, { "t": "④ 환경 변화는 항상 생물을 멸종시켰으며, 진화를 촉진한 적은 한 번도 없다.", "a": 1, "r": "환경 변화는 많은 종을 멸종시키기도 하지만, 살아남은 종들에게는 새로운 환경에 적응 방산하는 폭발적 진화의 원동력이 되었습니다." } ] },
  { "id": 92, "c": "종합문제", "q": "다윈의 진화론이 현대 과학(종합설)으로 발전하면서 추가된 핵심 내용은?", "img": "", "o": [ { "t": "① 생물은 신이 현재의 모습 그대로 창조했다.", "a": 0, "r": "창조론입니다." }, { "t": "② 개체 간의 '변이'가 발생하는 원인이 DNA의 돌연변이와 생식세포 재조합임이 밝혀졌다.", "a": 1, "r": "현대 유전학이 융합되면서 다윈이 설명하지 못했던 변이의 유전적 원리가 완벽히 보완되었습니다." }, { "t": "③ 자연 선택은 실제로 일어나지 않는다.", "a": 0, "r": "자연 선택은 여전히 진화의 핵심 메커니즘입니다." }, { "t": "④ 획득 형질이 유전된다는 라마르크의 주장이 증명되었다.", "a": 0, "r": "획득 형질은 유전되지 않음이 멘델 유전학 등으로 증명되었습니다." } ] },
  { "id": 93, "c": "종합문제", "q": "항생제를 사용하다가 중단하면 증세가 재발하고 내성균이 득세하는 과정을 막기 위한 올바른 대처법은?", "img": "", "o": [ { "t": "① 증상이 조금이라도 나아지면 즉시 항생제 복용을 멈춘다.", "a": 0, "r": "남아있던 내성균이 다시 번식합니다." }, { "t": "② 의사의 처방 기간을 끝까지 지켜 세균을 완전히 사멸시킨다.", "a": 1, "r": "도중에 끊으면 덜 죽은 내성균이 다시 증식하여 진화하므로, 처방된 기간을 준수하여 완전히 제거해야 합니다." }, { "t": "③ 감기(바이러스)에 걸릴 때마다 항생제를 스스로 찾아 먹는다.", "a": 0, "r": "항생제는 세균에만 들고 바이러스에는 소용없으며 남용만 유발합니다." }, { "t": "④ 기존 항생제 양을 10배로 늘려 한 번에 먹는다.", "a": 0, "r": "부작용이 생깁니다." } ] },
  { "id": 94, "c": "종합문제", "q": "동일한 위도 상에 있는 아프리카 초원과 남미 초원에서 서식하는 생물 종이 크게 다른 이유는?", "img": "", "o": [ { "t": "① 기후가 완전히 반대이기 때문", "a": 0, "r": "위도가 같으면 기후는 비슷합니다." }, { "t": "② 오래전 대륙이 분리되어 지리적으로 격리된 상태에서 각기 독자적으로 진화(자연선택)했기 때문", "a": 1, "r": "대륙 이동에 따른 지리적 격리와 오랜 시간 누적된 자연 선택의 차이가 종 분화를 이끌어낸 생물 지리학적 증거입니다." }, { "t": "③ 인간이 인위적으로 종을 옮겨 심었기 때문", "a": 0, "r": "인위적 결과가 아닙니다." }, { "t": "④ 남미 초원에는 화석이 발견되지 않기 때문", "a": 0, "r": "사실이 아닙니다." } ] },
  { "id": 95, "c": "종합문제", "q": "다음 중 종 다양성을 높이는 생태적 요소가 아닌 것은?", "img": "", "o": [ { "t": "① 서식지의 다양성(생태계 다양성)이 높을 때", "a": 0, "r": "종 다양성을 높입니다." }, { "t": "② 기후가 연중 따뜻하고 강수량이 풍부할 때", "a": 0, "r": "열대우림처럼 종 다양성이 높습니다." }, { "t": "③ 환경 변화가 적당히 일어나 생태적 틈새가 다양할 때", "a": 0, "r": "종 다양성을 높입니다." }, { "t": "④ 특정 외래종이 천적 없이 폭발적으로 번식할 때", "a": 1, "r": "외래종의 독점은 토착종의 멸종을 초래하여 종 다양성을 급격히 떨어뜨립니다." } ] },
  { "id": 96, "c": "종합문제", "q": "갯벌(하구) 생태계가 간척 사업으로 메워져 육지나 담수호가 되었을 때 나타나는 현상으로 적절한 것은?", "img": "", "o": [ { "t": "① 철새들의 먹이가 풍부해져 개체 수가 급증한다.", "a": 0, "r": "갯벌이 사라져 먹이가 없어집니다." }, { "t": "② 갯벌에 서식하던 해양 저서 생물 및 조류의 멸종 위기로 종 다양성이 크게 감소한다.", "a": 1, "r": "독특한 서식지(생태계) 파괴는 해당 생태계에 의존하던 수많은 종의 소멸을 가져옵니다." }, { "t": "③ 수질 정화 능력이 수백 배 향상된다.", "a": 0, "r": "갯벌의 자연 정화 능력을 상실하여 수질이 악화됩니다(예: 시화호 초기)." }, { "t": "④ 어업 수확량이 폭발적으로 늘어난다.", "a": 0, "r": "산란장이 사라져 어획량이 급감합니다." } ] },
  { "id": 97, "c": "종합문제", "q": "자연 선택설을 바탕으로 볼 때, 무분별한 살충제 남용이 가져올 미래로 가장 타당한 것은?", "img": "", "o": [ { "t": "① 살충제에 완벽히 적응한 곤충은 익충으로 변한다.", "a": 0, "r": "해충의 특성이 익충으로 바뀌는 것은 아닙니다." }, { "t": "② 모든 해충이 지구상에서 완전히 사라진다.", "a": 0, "r": "소수의 내성 개체가 반드시 살아남습니다." }, { "t": "③ 돌연변이가 멈추어 생태계가 고정된다.", "a": 0, "r": "돌연변이는 멈추지 않습니다." }, { "t": "④ 기존 살충제가 듣지 않는 내성 해충 집단(슈퍼 해충)이 번성하여 통제가 어려워진다.", "a": 1, "r": "살충제가 강력한 선택압으로 작용해 내성 유전자를 가진 개체만 살아남아 번식하는 진화가 일어납니다." } ] },
  { "id": 98, "c": "종합문제", "q": "생물 다양성을 보전해야 하는 근본적이고 철학적인 이유로 볼 수 있는 것은?", "img": "", "o": [ { "t": "① 인간이 지구상의 모든 생물을 지배하기 위해", "a": 0, "r": "지배가 목적이 아닙니다." }, { "t": "② 돈을 벌 수 있는 자원만 골라서 키우기 위해", "a": 0, "r": "경제성만 따지면 멸종을 가속합니다." }, { "t": "③ 인간도 생태계 먹이 그물의 일원이며, 모든 생명은 그 자체로 존재 가치를 지니기 때문", "a": 1, "r": "생태 중심주의 관점에서, 생태계 그물망이 무너지면 결국 인간도 생존할 수 없으며 야생 생물 자체의 생존 권리도 중요합니다." }, { "t": "④ 과학 실험용 동물을 무한히 공급받기 위해", "a": 0, "r": "실험용이 궁극적 보전 이유는 아닙니다." } ] },
  { "id": 99, "c": "종합문제", "q": "어느 섬에 털이 얇은 토끼와 두꺼운 토끼가 섞여 살았다. 빙하기가 도래하여 기온이 급격히 떨어지자 털이 두꺼운 토끼들만 살아남았다. 이 현상을 설명하는 진화론의 원리는?", "img": "", "o": [ { "t": "① 용불용설", "a": 0, "r": "노력해서 털이 두꺼워진 것이 아닙니다." }, { "t": "② 자연 선택", "a": 1, "r": "기존에 존재하던 '변이(털 두께)' 중에서 변화된 '환경(빙하기)'에 유리한 개체가 '자연 선택'되어 살아남은 것입니다." }, { "t": "③ 인위 선택", "a": 0, "r": "사람이 품종 개량을 한 것이 아닙니다." }, { "t": "④ 교잡", "a": 0, "r": "종간 교배 문제가 아닙니다." } ] },
  { "id": 100, "c": "종합문제", "q": "고등학교 1학년 과정에서 배운 '생물의 진화와 다양성' 단원의 핵심 교훈을 한 줄로 요약할 때 가장 알맞은 것은?", "img": "", "o": [ { "t": "① 생물은 불변하며, 환경 파괴는 경제 발전을 위해 필수적이다.", "a": 0, "r": "정반대의 교훈입니다." }, { "t": "② 강한 자만이 살아남으므로 약한 종은 보호할 가치가 없다.", "a": 0, "r": "잘못된 사회진화론적 발상입니다." }, { "t": "③ 우수한 단일 유전자만을 복제하여 생태계를 통일해야 한다.", "a": 0, "r": "단일화는 생물 멸종의 지름길입니다." }, { "t": "④ 오랜 시간 변이와 자연 선택의 산물인 생물 다양성은 생태계와 인류 생존의 필수 조건이므로 반드시 보전해야 한다.", "a": 1, "r": "진화의 결과로 형성된 유전/종/생태계 다양성의 중요성과 이를 보호해야 한다는 당위성을 완벽히 요약한 문장입니다." } ] }
]
  </script>

  <script>
    let rawQuizData = [];
    try {
      const jsonText = document.getElementById("quiz-data").textContent;
      rawQuizData = JSON.parse(jsonText);
    } catch (e) {
      alert("문제 데이터를 불러오는 중 오류가 발생했습니다. JSON 형식을 확인해주세요.");
      console.error("JSON Parsing Error:", e);
    }

    let currentIdx = 0;
    let userAnswers = new Array(rawQuizData.length).fill(null);

    const questionBadge = document.getElementById("question-badge");
    const categoryBadge = document.getElementById("category-badge");
    const questionCounter = document.getElementById("question-counter");
    const questionText = document.getElementById("question-text");
    const questionImage = document.getElementById("question-image");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const resultAlert = document.getElementById("result-alert");
    const rationalesList = document.getElementById("rationales-list");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const navGrid = document.getElementById("nav-grid");
    const scoreDisplay = document.getElementById("score-display");
    const progressBar = document.getElementById("progress-bar");
    const resetBtn = document.getElementById("reset-btn");
    const editModal = document.getElementById("edit-modal");
    const nextBtnTop = document.getElementById("next-btn-top");

    function initNavGrid() {
      navGrid.innerHTML = "";
      rawQuizData.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.innerText = idx + 1;
        btn.id = `nav-btn-${idx}`;
        // 반응형 및 100문제 표시를 위해 버튼 크기를 약간 조정
        btn.className = "w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs border border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200 transition shadow-sm";
        btn.onclick = () => loadQuestion(idx);
        navGrid.appendChild(btn);
      });
      updateScoreAndProgress();
    }

    function updateScoreAndProgress() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null && rawQuizData[idx].o[ans].a === 1) correctCount++;
      });
      scoreDisplay.innerText = `${correctCount} / ${answeredCount} (총 ${rawQuizData.length}문항)`;
      progressBar.style.width = `${(answeredCount / rawQuizData.length) * 100}%`;

      rawQuizData.forEach((_, idx) => {
        const navBtn = document.getElementById(`nav-btn-${idx}`);
        if(!navBtn) return;
        if (userAnswers[idx] === null) {
          navBtn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs border shadow-sm ${idx === currentIdx ? 'border-indigo-600 ring-2 ring-indigo-400 bg-white text-indigo-700 scale-110' : 'border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200'}`;
        } else {
          const isUserCorrect = rawQuizData[idx].o[userAnswers[idx]].a === 1;
          navBtn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs shadow-sm bg-${isUserCorrect ? 'emerald' : 'rose'}-500 text-white ${idx === currentIdx ? `ring-2 ring-${isUserCorrect ? 'emerald' : 'rose'}-300 scale-110` : ''}`;
        }
      });
    }

    function loadQuestion(idx) {
      if (idx < 0 || idx >= rawQuizData.length) return;
      currentIdx = idx;
      const q = rawQuizData[idx];

      window.scrollTo(0, 0);

      questionBadge.innerText = `문항 ${q.id || (idx+1)}`;
      categoryBadge.innerText = q.c;
      questionCounter.innerText = `${idx + 1} / ${rawQuizData.length}`;
      questionText.innerText = q.q;
      
      if(q.img && q.img.trim() !== "") {
          questionImage.src = q.img;
          questionImage.classList.remove('hidden');
      } else {
          questionImage.src = "";
          questionImage.classList.add('hidden');
      }

      optionsContainer.innerHTML = "";
      const selected = userAnswers[idx];

      q.o.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3 text-sm md:text-base font-medium shadow-sm ";
        
        if (selected === null) {
          btn.className += "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 text-slate-800";
          btn.onclick = () => selectOption(optIdx);
        } else {
          if (opt.a === 1) btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold z-10 scale-[1.01]";
          else if (selected === optIdx) btn.className += "border-rose-500 bg-rose-50 text-rose-900";
          else btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
          btn.disabled = true;
        }

        const iconSpan = document.createElement("span");
        iconSpan.className = "pt-0.5 shrink-0"; 
        if (selected !== null) {
          if (opt.a === 1) iconSpan.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-xl drop-shadow-md"></i>';
          else if (selected === optIdx) iconSpan.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-xl"></i>';
          else iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-300 text-xl"></i>';
        } else {
          iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-400 text-xl group-hover:text-indigo-600"></i>';
        }

        const textSpan = document.createElement("span");
        textSpan.className = "flex-1 leading-relaxed";
        textSpan.innerText = opt.t;
        
        btn.appendChild(iconSpan);
        btn.appendChild(textSpan);
        optionsContainer.appendChild(btn);
      });

      if (selected !== null) {
        renderExplanation(selected);
        explanationBox.classList.remove("hidden");
      } else {
        explanationBox.classList.add("hidden");
      }

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === rawQuizData.length - 1;
      nextBtnTop.disabled = idx === rawQuizData.length - 1;
      updateScoreAndProgress();
    }

    function selectOption(optIdx) {
      userAnswers[currentIdx] = optIdx;
      loadQuestion(currentIdx);
    }

    function renderExplanation(selectedIdx) {
      const q = rawQuizData[currentIdx];
      const isCorrect = q.o[selectedIdx].a === 1;

      if (isCorrect) {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-emerald-900 bg-emerald-100 border border-emerald-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-2xl drop-shadow"></i> <div>정답입니다! 완벽하게 이해하셨습니다.</div>';
      } else {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-rose-900 bg-rose-100 border border-rose-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 text-2xl drop-shadow"></i> <div>오답입니다. 아래 보기별 해설을 반드시 확인하세요.</div>';
      }

      rationalesList.innerHTML = "";
      q.o.forEach((opt) => {
        const item = document.createElement("div");
        item.className = `p-3 rounded-lg border shadow-sm ${opt.a === 1 ? 'bg-emerald-50/80 border-emerald-200' : 'bg-white border-slate-200'}`;
        
        const header = document.createElement("div");
        header.className = "font-bold mb-1.5 flex items-start gap-2";
        if (opt.a === 1) header.innerHTML = `<span class="bg-emerald-600 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5 shadow-sm">정답 보기</span> <span class="text-emerald-900">${opt.t}</span>`;
        else header.innerHTML = `<span class="bg-slate-400 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5">오답 보기</span> <span class="text-slate-800">${opt.t}</span>`;
        
        const body = document.createElement("div");
        body.className = "text-xs md:text-sm text-slate-600 pl-1 leading-relaxed";
        body.innerText = opt.r;

        item.appendChild(header);
        item.appendChild(body);
        rationalesList.appendChild(item);
      });
    }

    function openEditModal() {
      const q = rawQuizData[currentIdx];
      document.getElementById('edit-cat').value = q.c;
      document.getElementById('edit-q').value = q.q;
      
      if(q.img && q.img.trim() !== "") {
          document.getElementById('edit-img-base64').value = q.img;
          document.getElementById('edit-img-preview').src = q.img;
          document.getElementById('edit-img-preview').classList.remove('hidden');
          document.getElementById('btn-clear-img').classList.remove('hidden');
      } else {
          clearImage(); 
      }

      for(let i=0; i<4; i++) {
        document.getElementById(`edit-opt-${i}`).value = q.o[i].t;
        document.getElementById(`edit-rat-${i}`).value = q.o[i].r;
        if(q.o[i].a === 1) {
          document.querySelector(`input[name="edit-ans"][value="${i}"]`).checked = true;
        }
      }
      
      document.body.classList.add('modal-open');
      editModal.classList.remove('hidden');
    }

    function closeEditModal() {
      document.body.classList.remove('modal-open');
      editModal.classList.add('hidden');
    }

    function saveEditedQuestion() {
      const q = rawQuizData[currentIdx];
      q.c = document.getElementById('edit-cat').value;
      q.q = document.getElementById('edit-q').value;
      q.img = document.getElementById('edit-img-base64').value;
      
      const correctVal = document.querySelector('input[name="edit-ans"]:checked').value;
      
      for(let i=0; i<4; i++) {
        q.o[i].t = document.getElementById(`edit-opt-${i}`).value;
        q.o[i].r = document.getElementById(`edit-rat-${i}`).value;
        q.o[i].a = (i.toString() === correctVal) ? 1 : 0;
      }
      
      closeEditModal();
      loadQuestion(currentIdx);
      alert("문제가 성공적으로 수정되었습니다.\n\n※ 영구 저장을 원하시면 상단의 [수정본 다운로드] 버튼을 클릭하세요!");
    }

    function addNewQuestion() {
      const newQ = {
        id: rawQuizData.length + 1,
        c: "새 카테고리",
        q: "여기에 새로운 문제를 입력하세요.",
        img: "",
        o: [
          { t: "① 보기 1", a: 1, r: "해설 1" },
          { t: "② 보기 2", a: 0, r: "해설 2" },
          { t: "③ 보기 3", a: 0, r: "해설 3" },
          { t: "④ 보기 4", a: 0, r: "해설 4" }
        ]
      };
      rawQuizData.push(newQ);
      userAnswers.push(null);
      initNavGrid();
      loadQuestion(rawQuizData.length - 1);
      openEditModal(); 
    }

    function deleteCurrentQuestion() {
      if(rawQuizData.length <= 1) {
          alert("최소 1개의 문제는 남아있어야 합니다.");
          return;
      }
      if(confirm("정말로 이 문제를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.")) {
          rawQuizData.splice(currentIdx, 1);
          userAnswers.splice(currentIdx, 1);
          
          rawQuizData.forEach((q, i) => q.id = i + 1);
          
          initNavGrid();
          closeEditModal();
          
          let nextIdx = currentIdx >= rawQuizData.length ? rawQuizData.length - 1 : currentIdx;
          loadQuestion(nextIdx);
      }
    }

    function encodeImageFileAsURL(element) {
      const file = element.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        document.getElementById('edit-img-base64').value = reader.result;
        document.getElementById('edit-img-preview').src = reader.result;
        document.getElementById('edit-img-preview').classList.remove('hidden');
        document.getElementById('btn-clear-img').classList.remove('hidden');
      }
      reader.readAsDataURL(file);
    }

    function clearImage() {
      document.getElementById('edit-img-upload').value = "";
      document.getElementById('edit-img-base64').value = "";
      document.getElementById('edit-img-preview').src = "";
      document.getElementById('edit-img-preview').classList.add('hidden');
      document.getElementById('btn-clear-img').classList.add('hidden');
    }

    function downloadUpdatedHTML() {
      const dataScript = document.getElementById('quiz-data');
      dataScript.textContent = "\n" + JSON.stringify(rawQuizData, null, 2) + "\n";
      
      let htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "고1_통합과학2_진화와다양성_100제.html"; 
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    prevBtn.addEventListener("click", () => { if (currentIdx > 0) loadQuestion(currentIdx - 1); });
    nextBtn.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    nextBtnTop.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    
    resetBtn.addEventListener("click", () => {
      if (confirm("풀이 기록을 모두 초기화하시겠습니까? 처음부터 다시 풉니다.")) {
        userAnswers = new Array(rawQuizData.length).fill(null);
        loadQuestion(0);
      }
    });

    document.addEventListener("keydown", (e) => {
      if(!editModal.classList.contains('hidden')) return;
      if (e.key === "ArrowLeft" && currentIdx > 0) loadQuestion(currentIdx - 1);
      else if (e.key === "ArrowRight" && currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1);
      else if (["1", "2", "3", "4"].includes(e.key) && userAnswers[currentIdx] === null) selectOption(parseInt(e.key) - 1);
    });

    // 초기 실행
    if (rawQuizData.length > 0) {
      initNavGrid();
      loadQuestion(0);
    }
  </script>
</body></html>
