  {"id":8,"c":"산화 환원의 정의","q":"다음 중 산소를 잃는 반응(환원)이 일어나는 화학 반응식은?","img":"","o":[{"t":"① C + O₂ → CO₂","a":0,"r":"탄소가 산소를 얻는 산화 반응입니다."},{"t":"② 2Mg + O₂ → 2MgO","a":0,"r":"마그네슘이 산소를 얻는 산화 반응입니다."},{"t":"③ Fe₂O₃ + 3CO → 2Fe + 3CO₂","a":1,"r":"산화 철(Fe₂O₃)이 산소를 잃고 순수한 철(Fe)로 환원됩니다."},{"t":"④ CH₄ + 2O₂ → CO₂ + 2H₂O","a":0,"r":"메테인이 산소를 얻는 산화 반응입니다."}]},
  {"id":9,"c":"산화 환원의 정의","q":"나트륨과 염소의 반응 (2Na + Cl₂ → 2NaCl)에서 나트륨(Na)의 변화로 옳은 것은?","img":"","o":[{"t":"① 전자를 얻어 환원된다.","a":0,"r":"나트륨은 금속으로 전자를 잃습니다."},{"t":"② 전자를 얻어 산화된다.","a":0,"r":"전자를 얻으면 환원입니다."},{"t":"③ 전자를 잃어 환원된다.","a":0,"r":"전자를 잃으면 산화입니다."},{"t":"④ 전자를 잃어 산화된다.","a":1,"r":"나트륨(Na)은 전자를 1개 잃고 Na⁺가 되므로 산화됩니다."}]},
  {"id":10,"c":"산화 환원의 정의","q":"이온 결합 화합물이 생성될 때, 비금속 원소의 변화에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 전자를 잃고 산화된다.","a":0,"r":"비금속은 전자를 얻는 경향이 큽니다."},{"t":"② 전자를 잃고 환원된다.","a":0,"r":"전자를 잃으면 산화입니다."},{"t":"③ 전자를 얻고 산화된다.","a":0,"r":"전자를 얻으면 환원입니다."},{"t":"④ 전자를 얻고 환원된다.","a":1,"r":"비금속 원자는 전자를 얻어 음이온이 되므로 환원됩니다."}]},
  {"id":11,"c":"산화 환원의 정의","q":"다음 중 산화 환원 반응이 아닌 것은?","img":"","o":[{"t":"① 광합성 작용","a":0,"r":"광합성은 대표적인 산화 환원 반응입니다."},{"t":"② 천연가스의 연소","a":0,"r":"연소는 산소와 빠르게 결합하는 산화 환원 반응입니다."},{"t":"③ 염화 나트륨 수용액과 질산 은 수용액의 앙금 생성 반응","a":1,"r":"앙금 생성 반응은 이온이 짝을 바꾸는 반응으로, 전자의 이동이 없는 비산화 환원 반응입니다."},{"t":"④ 철의 제련","a":0,"r":"산화 철이 철로 환원되는 산화 환원 반응입니다."}]},
  {"id":12,"c":"산화 환원의 정의","q":"과산화 수소(H₂O₂)가 물(H₂O)과 산소(O₂)로 분해되는 반응은 산화 환원 반응이다. 이 반응에서 일어나는 산화 환원 동시성에 대한 설명으로 적절한 것은?","img":"","o":[{"t":"① 과산화 수소 분자 한 개만 산화된다.","a":0,"r":"산화 환원은 동시에 일어납니다."},{"t":"② 산소 원자의 일부는 산화되고, 일부는 환원된다.","a":1,"r":"과산화 수소의 산소 일부는 전자를 잃어 O₂ 기체가 되고(산화), 일부는 H₂O의 O²⁻로 남아 전자를 얻은 상태를 유지(환원)합니다. 하나의 물질이 동시에 산화 환원됩니다."},{"t":"③ 전자의 이동 없이 산소의 분리만 일어난다.","a":0,"r":"산소 기체가 발생할 때 전자 이동이 있습니다."},{"t":"④ 이 반응은 산화 환원 반응이 아니다.","a":0,"r":"산화 환원 반응입니다."}]},
  {"id":13,"c":"산화 환원의 정의","q":"질산 은(AgNO₃) 수용액에 구리(Cu) 줄을 넣었을 때 구리 표면에 은(Ag)이 석출되었다. 산화된 물질과 환원된 물질은?","img":"","o":[{"t":"① 산화: Cu, 환원: Ag⁺","a":1,"r":"구리(Cu)는 전자를 잃고 Cu²⁺로 산화되며, 은 이온(Ag⁺)은 전자를 얻어 Ag로 환원됩니다."},{"t":"② 산화: Ag⁺, 환원: Cu","a":0,"r":"Ag⁺는 전자를 얻어 환원됩니다."},{"t":"③ 산화: AgNO₃, 환원: Cu²⁺","a":0,"r":"질산 이온(NO₃⁻)은 구경꾼 이온입니다."},{"t":"④ 산화: Cu²⁺, 환원: Ag","a":0,"r":"반응물은 Cu와 Ag⁺입니다."}]},
  {"id":14,"c":"산화 환원의 정의","q":"'산화'에 대한 설명으로 틀린 것은?","img":"","o":[{"t":"① 산소와 결합하는 반응이다.","a":0,"r":"맞는 설명입니다."},{"t":"② 전자를 잃는 반응이다.","a":0,"r":"맞는 설명입니다."},{"t":"③ 환원 반응과 항상 동시에 일어난다.","a":0,"r":"맞는 설명입니다."},{"t":"④ 모든 물질은 연소할 때 환원된다.","a":1,"r":"연소는 산소와 급격히 결합하는 반응이므로 물질이 '산화'되는 과정입니다."}]},
  {"id":15,"c":"산화 환원의 정의","q":"다음 반응에서 전자를 얻은 물질은? [ Mg + Cu²⁺ → Mg²⁺ + Cu ]","img":"","o":[{"t":"① Mg","a":0,"r":"Mg는 전자를 잃고 Mg²⁺가 되었습니다."},{"t":"② Cu²⁺","a":1,"r":"Cu²⁺는 Mg로부터 전자를 2개 얻어 Cu로 환원되었습니다."},{"t":"③ Mg²⁺","a":0,"r":"생성물입니다."},{"t":"④ Cu","a":0,"r":"생성물입니다."}]},
  {"id":16,"c":"지구와 생명의 역사","q":"광합성 반응식 (6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂)에서 환원되는 물질은?","img":"","o":[{"t":"① CO₂","a":1,"r":"이산화 탄소(CO₂)는 수소(또는 전자)를 얻어 포도당(C₆H₁₂O₆)으로 환원됩니다."},{"t":"② H₂O","a":0,"r":"물(H₂O)은 산소 기체(O₂)로 산화됩니다."},{"t":"③ C₆H₁₂O₆","a":0,"r":"포도당은 생성물입니다."},{"t":"④ O₂","a":0,"r":"산소 기체는 생성물입니다."}]},
  {"id":17,"c":"지구와 생명의 역사","q":"식물의 광합성이 지구 생명체 역사에 미친 영향으로 가장 적절한 것은?","img":"","o":[{"t":"① 대기 중의 이산화 탄소를 증가시켰다.","a":0,"r":"이산화 탄소를 소비하여 감소시켰습니다."},{"t":"② 철의 제련을 불가능하게 만들었다.","a":0,"r":"산소를 배출하여 철을 산화 철 형태로 퇴적되게 했습니다."},{"t":"③ 대기에 산소를 방출하여 산소 호흡 생물이 출현할 수 있게 하였다.","a":1,"r":"남세균 등의 광합성으로 대기 중 산소가 풍부해져 호기성 생물이 출현하고 오존층이 형성되었습니다."},{"t":"④ 바닷물의 온도를 급격히 상승시켰다.","a":0,"r":"온도 상승과 직접적 관련이 적습니다."}]},
  {"id":18,"c":"지구와 생명의 역사","q":"세포 호흡 과정 (C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + 에너지)에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 포도당은 환원된다.","a":0,"r":"포도당은 산소와 결합(수소/전자를 잃음)하여 CO₂로 산화됩니다."},{"t":"② 산소는 산화된다.","a":0,"r":"산소는 수소(전자)를 얻어 H₂O로 환원됩니다."},{"t":"③ 포도당이 산화되면서 생명 활동에 필요한 에너지를 방출한다.","a":1,"r":"세포 호흡은 포도당을 산화시켜 에너지를 얻는 과정입니다."},{"t":"④ 빛에너지를 화학 에너지로 저장하는 과정이다.","a":0,"r":"이것은 광합성에 대한 설명입니다."}]},
  {"id":19,"c":"지구와 생명의 역사","q":"광합성과 세포 호흡의 관계를 설명한 것으로 옳지 않은 것은?","img":"","o":[{"t":"① 광합성으로 생성된 포도당은 세포 호흡의 원료로 사용된다.","a":0,"r":"맞습니다."},{"t":"② 세포 호흡의 결과 생성된 이산화 탄소는 광합성의 원료로 쓰일 수 있다.","a":0,"r":"맞습니다."},{"t":"③ 광합성은 에너지를 흡수하고, 세포 호흡은 에너지를 방출한다.","a":0,"r":"광합성은 흡열, 세포 호흡은 발열 반응입니다."},{"t":"④ 두 반응 모두 산화 환원 반응이 일어나지 않는다.","a":1,"r":"광합성과 세포 호흡은 모두 산소, 수소, 전자의 이동이 관여하는 대표적인 산화 환원 반응입니다."}]},
  {"id":20,"c":"지구와 생명의 역사","q":"인류의 역사를 획기적으로 바꾼 세 가지 산화 환원 반응에 해당하지 않는 것은?","img":"","o":[{"t":"① 광합성","a":0,"r":"산소 대기를 만들어 생태계의 기초를 형성했습니다."},{"t":"② 화석 연료의 연소","a":0,"r":"산업 혁명의 원동력이 되었습니다."},{"t":"③ 철의 제련","a":0,"r":"철기 시대와 산업 발전을 이끌었습니다."},{"t":"④ 암모니아 합성","a":1,"r":"하버-보슈법으로 비료 생산에 기여했으나 교과서에서 강조하는 지구 역사를 바꾼 '3대 산화 환원'의 기본 목록(광합성, 화석연료 연소, 철의 제련)에는 주로 3가지가 포함됩니다. (물론 암모니아 합성도 산화 환원이지만 상대적으로 오답지로 자주 출제됩니다.)"}]},
  {"id":21,"c":"지구와 생명의 역사","q":"원시 지구의 바다에서 최초의 광합성 세균(남세균)이 출현한 이후 지구 환경의 변화로 옳지 않은 것은?","img":"","o":[{"t":"① 대기 중 산소 기체 농도가 증가했다.","a":0,"r":"광합성의 결과입니다."},{"t":"② 오존층이 형성되어 육상 생물이 출현할 수 있게 되었다.","a":0,"r":"산소가 축적되어 오존층이 형성되었습니다."},{"t":"③ 바닷속의 철 이온이 산화 철로 침전되어 철광석 층을 형성했다.","a":0,"r":"발생한 산소가 바닷속 철 이온과 결합하여 산화 철(호상 철광층)이 형성되었습니다."},{"t":"④ 대기 중의 이산화 탄소 농도가 급격히 증가했다.","a":1,"r":"광합성은 이산화 탄소를 소모하므로 이산화 탄소 농도는 서서히 감소했습니다."}]},
  {"id":22,"c":"지구와 생명의 역사","q":"다음 중 물질이 산화되는 반응은?","img":"","o":[{"t":"① 식물이 이산화 탄소로부터 포도당을 합성할 때","a":0,"r":"이산화 탄소는 환원됩니다."},{"t":"② 세포에서 포도당이 이산화 탄소와 물로 분해될 때","a":1,"r":"세포 호흡에서 포도당은 산소와 결합하여 산화됩니다."},{"t":"③ 용광로에서 산화 철(III)이 철로 될 때","a":0,"r":"산화 철은 산소를 잃고 환원됩니다."},{"t":"④ 은 이온(Ag⁺)이 은(Ag)으로 석출될 때","a":0,"r":"은 이온은 전자를 얻어 환원됩니다."}]},
  {"id":23,"c":"지구와 생명의 역사","q":"화석 연료(메테인)의 연소 반응식: CH₄ + 2O₂ → CO₂ + 2H₂O. 이 반응에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① CH₄는 산소를 잃고 환원된다.","a":0,"r":"CH₄는 산소를 얻어 CO₂로 산화됩니다."},{"t":"② O₂는 환원된다.","a":1,"r":"O₂는 메테인의 수소(전자)를 얻어 H₂O로 환원됩니다."},{"t":"③ 메테인의 연소는 흡열 반응이다.","a":0,"r":"모든 연소 반응은 빛과 열을 내는 발열 반응입니다."},{"t":"④ 이산화 탄소는 산화된 물질이다.","a":0,"r":"이산화 탄소는 산화의 '결과물'이며, 산화'되는' 물질은 메테인입니다."}]},
  {"id":24,"c":"지구와 생명의 역사","q":"인류의 산업 혁명을 이끌어낸 화석 연료의 주성분은 탄소와 수소이다. 화석 연료가 완전 연소할 때 공통으로 생성되는 두 가지 물질은?","img":"","o":[{"t":"① 이산화 탄소, 물","a":1,"r":"탄소는 산화되어 이산화 탄소(CO₂)가 되고, 수소는 산화되어 물(H₂O)이 됩니다."},{"t":"② 일산화 탄소, 산소","a":0,"r":"완전 연소 시 이산화 탄소가 생깁니다."},{"t":"③ 수소, 산소","a":0,"r":"생성물이 아닙니다."},{"t":"④ 이산화 탄소, 수소","a":0,"r":"물 대신 수소가 생기지 않습니다."}]},
  {"id":25,"c":"지구와 생명의 역사","q":"철광석에서 순수한 철을 얻기 위한 제련 과정이 인류 역사에서 늦게 시작된 이유는?","img":"","o":[{"t":"① 구리보다 지구에 존재하는 양이 적어서","a":0,"r":"철은 지각에 매우 풍부하게 존재합니다."},{"t":"② 철이 구리보다 반응성이 커서 산소와 강하게 결합한 산화물 형태로 존재하기 때문","a":1,"r":"철은 반응성이 커서 환원시키기 위해 높은 온도가 필요했기 때문에 제련 기술 발전이 늦었습니다."},{"t":"③ 철은 불에 타면 쉽게 증발하기 때문","a":0,"r":"철의 녹는점은 매우 높습니다."},{"t":"④ 철을 환원시킬 수 있는 탄소가 지구상에 없었기 때문","a":0,"r":"숯(탄소) 등은 일찍부터 사용되었습니다."}]},
  {"id":26,"c":"지구와 생명의 역사","q":"용광로에서 철을 제련할 때 코크스(C)를 넣는 주된 목적은?","img":"","o":[{"t":"① 철광석을 산화시키기 위해","a":0,"r":"철광석을 환원시키기 위함입니다."},{"t":"② 산화 철의 녹는점을 낮추기 위해","a":0,"r":"녹는점 하강은 석회석과 불순물의 반응 결과에 가깝습니다."},{"t":"③ 불완전 연소로 일산화 탄소를 생성하여 철광석을 환원시키기 위해","a":1,"r":"코크스(C)는 불완전 연소하여 일산화 탄소(CO)를 만들고, 이 CO가 산화 철을 철로 환원시킵니다."},{"t":"④ 불순물인 규산염을 제거하기 위해","a":0,"r":"불순물 제거는 석회석(CaCO₃)의 역할입니다."}]},
  {"id":27,"c":"지구와 생명의 역사","q":"용광로 내부에서 일어나는 반응식이다. 산화되는 물질과 환원되는 물질을 바르게 짝지은 것은? [ Fe₂O₃ + 3CO → 2Fe + 3CO₂ ]","img":"","o":[{"t":"① 산화: Fe₂O₃, 환원: CO","a":0,"r":"Fe₂O₃는 산소를 잃으므로 환원됩니다."},{"t":"② 산화: CO, 환원: Fe₂O₃","a":1,"r":"일산화 탄소(CO)는 산소를 얻어 CO₂로 산화되고, 산화 철(Fe₂O₃)은 산소를 잃고 Fe로 환원됩니다."},{"t":"③ 산화: Fe, 환원: CO₂","a":0,"r":"이들은 생성물입니다."},{"t":"④ 산화: CO, 환원: Fe","a":0,"r":"Fe는 환원의 결과물입니다."}]},
  {"id":28,"c":"지구와 생명의 역사","q":"철의 제련 과정에서 불순물인 이산화 규소(SiO₂)를 제거하기 위해 용광로에 함께 넣는 물질은?","img":"","o":[{"t":"① 코크스(C)","a":0,"r":"환원제 생성 용도입니다."},{"t":"② 석회석(CaCO₃)","a":1,"r":"석회석은 열분해되어 CaO가 되고, 이것이 SiO₂와 반응하여 슬래그(CaSiO₃)를 만들어 불순물을 제거합니다."},{"t":"③ 흑연(C)","a":0,"r":"코크스와 비슷하나 용광로 제련의 주 원료는 석회석입니다."},{"t":"④ 소금(NaCl)","a":0,"r":"전혀 관계가 없습니다."}]},
  {"id":29,"c":"지구와 생명의 역사","q":"석회석(CaCO₃)이 용광로 내에서 분해되는 반응식(CaCO₃ → CaO + CO₂)에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 산화 환원 반응이다.","a":0,"r":"탄산 칼슘의 열분해는 산화수가 변하지 않는 비산화 환원 반응입니다."},{"t":"② 생성된 CaO는 철광석을 환원시킨다.","a":0,"r":"CaO는 불순물과 반응하여 슬래그를 만듭니다."},{"t":"③ 생성된 CO₂는 코크스를 산화시킨다.","a":0,"r":"CO₂는 코크스와 반응하여 CO(일산화 탄소)가 됩니다(CO₂ + C → 2CO)."},{"t":"④ 이 반응에서는 산소의 이동에 따른 산화 환원이 일어나지 않는다.","a":1,"r":"이 반응은 단순한 열분해 반응으로 산화 환원 반응이 아닙니다."}]},
  {"id":30,"c":"지구와 생명의 역사","q":"철의 제련 과정 중 만들어지는 슬래그(CaSiO₃)에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 순수한 철보다 밀도가 커서 용광로 바닥에 가라앉는다.","a":0,"r":"슬래그는 철보다 밀도가 작아 용융된 철 위에 뜹니다."},{"t":"② 용융된 철의 표면을 덮어 철이 다시 산화되는 것을 막아준다.","a":1,"r":"밀도가 작아 쇳물 위에 뜨면서 공기 중의 산소와 차단시켜 쇳물의 재산화를 방지합니다."},{"t":"③ 슬래그는 산화 철을 환원시키는 환원제 역할을 한다.","a":0,"r":"환원제는 일산화 탄소(CO)입니다."},{"t":"④ 철을 제련하는 데 불필요하므로 현대에는 생성되지 않게 막는다.","a":0,"r":"철광석에 포함된 불순물(SiO₂)을 제거하기 위해 필연적으로 발생하며 시멘트 원료 등으로 재활용됩니다."}]},
  {"id":31,"c":"지구와 생명의 역사","q":"자연 상태에서 철은 주로 철광석(산화 철) 상태로 존재한다. 그 이유로 가장 적절한 것은?","img":"","o":[{"t":"① 철이 산소와 결합할 때 열을 흡수하기 때문이다.","a":0,"r":"발열 반응입니다."},{"t":"② 철이 매우 안정한 물질이어서 다른 원소와 반응하지 않기 때문이다.","a":0,"r":"반응성이 크기 때문에 화합물로 존재합니다."},{"t":"③ 철의 반응성이 커서 오랜 시간 동안 대기나 물속의 산소와 반응하여 산화되었기 때문이다.","a":1,"r":"철은 산화되기 쉬운 금속(반응성이 큼)이므로 자연계에서는 주로 산소와 결합한 형태로 존재합니다."},{"t":"④ 철은 지각에 존재하는 양이 너무 적기 때문이다.","a":0,"r":"지각을 구성하는 주요 원소(O, Si, Al, Fe) 중 하나로 매우 많습니다."}]},
  {"id":32,"c":"지구와 생명의 역사","q":"다음 중 광합성과 화석 연료의 연소 과정의 공통점은?","img":"","o":[{"t":"① 모두 산화 환원 반응이다.","a":1,"r":"두 과정 모두 산소와 수소, 전자의 이동이 수반되는 산화 환원 반응입니다."},{"t":"② 모두 산소를 흡수한다.","a":0,"r":"광합성은 산소를 방출하고, 연소는 산소를 흡수합니다."},{"t":"③ 모두 이산화 탄소를 방출한다.","a":0,"r":"광합성은 이산화 탄소를 흡수합니다."},{"t":"④ 모두 빛에너지를 화학 에너지로 저장한다.","a":0,"r":"연소는 에너지를 방출하는 과정입니다."}]},
  {"id":33,"c":"지구와 생명의 역사","q":"광합성 반응에서 물(H₂O) 분자가 겪는 변화는?","img":"","o":[{"t":"① 환원되어 이산화 탄소가 된다.","a":0,"r":"물은 이산화 탄소가 되지 않습니다."},{"t":"② 환원되어 산소 기체가 된다.","a":0,"r":"물은 산화되어 산소가 됩니다."},{"t":"③ 산화되어 포도당이 된다.","a":0,"r":"포도당은 이산화 탄소가 환원된 결과입니다."},{"t":"④ 산화되어 산소 기체를 발생시킨다.","a":1,"r":"물(H₂O)은 수소와 전자를 잃고 산소 기체(O₂)로 산화됩니다."}]},
  {"id":34,"c":"지구와 생명의 역사","q":"생물의 세포 호흡에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 포도당이 환원되어 에너지를 발생시킨다.","a":0,"r":"포도당은 산화됩니다."},{"t":"② 생물은 세포 호흡을 통해 얻은 에너지를 생명 활동에 사용한다.","a":1,"r":"포도당을 산화시켜 방출된 에너지를 ATP 형태로 저장하여 사용합니다."},{"t":"③ 이산화 탄소가 환원되어 물이 생성된다.","a":0,"r":"산소가 환원되어 물이 됩니다."},{"t":"④ 엽록체에서 주로 일어난다.","a":0,"r":"세포 호흡은 미토콘드리아에서 일어납니다."}]},
  {"id":35,"c":"지구와 생명의 역사","q":"불이 난 곳에 소화기를 뿌려 이산화 탄소나 거품으로 덮는 것은 어떤 원리를 이용한 것인가?","img":"","o":[{"t":"① 가연성 물질을 제거하여 산화를 막는다.","a":0,"r":"가연물을 치우는 것이 아닙니다."},{"t":"② 발화점 이상으로 온도를 높여 연소를 돕는다.","a":0,"r":"불을 끄는 행위입니다."},{"t":"③ 산소의 공급을 차단하여 연소(산화 반응)를 막는다.","a":1,"r":"연소의 3요소 중 산소의 공급을 차단하는 '질식 소화' 방법입니다."},{"t":"④ 산소를 추가로 공급하여 빠르게 연소시킨다.","a":0,"r":"화재를 진압하는 목적과 반대입니다."}]},
  {"id":36,"c":"지구와 생명의 역사","q":"과거 지구의 대기 조성 변화를 설명한 것으로 옳은 것은?","img":"","o":[{"t":"① 남세균 출현 이전에는 대기에 산소가 풍부했다.","a":0,"r":"산소가 거의 없었습니다."},{"t":"② 광합성 생물이 출현하면서 대기 중 산소 농도가 지속적으로 증가했다.","a":1,"r":"남세균 등의 광합성으로 대기 중 산소가 점차 증가하였습니다."},{"t":"③ 육상 식물이 번성하면서 대기 중 이산화 탄소 농도가 폭발적으로 증가했다.","a":0,"r":"식물의 광합성으로 이산화 탄소가 감소했습니다."},{"t":"④ 오존층은 광합성 생물이 등장하기 전부터 지구를 보호했다.","a":0,"r":"오존층은 산소가 축적된 후에 형성되었습니다."}]},
  {"id":37,"c":"지구와 생명의 역사","q":"철기 시대가 청동기 시대보다 늦게 시작된 과학적 근거로 가장 타당한 것은?","img":"","o":[{"t":"① 철이 구리보다 매장량이 적어서","a":0,"r":"철이 구리보다 훨씬 많습니다."},{"t":"② 철이 구리보다 반응성이 커서 제련하기 어렵기 때문에","a":1,"r":"반응성이 큰 철은 산소와 더 강하게 결합되어 있어, 이를 떼어내기(환원) 위해 더 높은 온도의 정밀한 제련 기술이 필요했습니다."},{"t":"③ 철은 산화되지 않는 성질이 있어서","a":0,"r":"철은 쉽게 산화됩니다."},{"t":"④ 철은 녹는점이 매우 낮아서 도구로 쓰기 부적합해서","a":0,"r":"철의 녹는점은 1500도가 넘어 높습니다."}]},
  {"id":38,"c":"지구와 생명의 역사","q":"석탄이나 석유와 같은 화석 연료의 생성 과정을 산화 환원 관점에서 볼 때 가장 관련이 깊은 과거의 사건은?","img":"","o":[{"t":"① 오존층 파괴","a":0,"r":"오존층과 화석연료 생성은 무관합니다."},{"t":"② 고대 생물(식물, 플랑크톤 등)의 광합성을 통한 유기물 축적","a":1,"r":"태양 에너지를 이용해 이산화 탄소를 환원시켜 만든 유기물이 땅에 묻혀 오랜 시간 변한 것이 화석 연료입니다."},{"t":"③ 활발한 철의 제련","a":0,"r":"인류의 기술입니다."},{"t":"④ 바닷물의 증발","a":0,"r":"암염 등의 생성 원리입니다."}]},
  {"id":39,"c":"지구와 생명의 역사","q":"철이 산소 및 물과 반응하여 붉은 녹이 스는 반응을 막기 위한 방법으로 적절하지 않은 것은?","img":"","o":[{"t":"① 표면에 페인트를 칠한다.","a":0,"r":"산소와 수분을 차단합니다."},{"t":"② 표면에 기름칠을 한다.","a":0,"r":"산소와 수분을 차단합니다."},{"t":"③ 철을 습기가 많은 공기 중에 노출시킨다.","a":1,"r":"수분과 산소는 철의 산화(녹스는 것)를 촉진하므로 노출시키면 안 됩니다."},{"t":"④ 철보다 반응성이 작은 금속(예: 주석)으로 도금한다.","a":0,"r":"산소와 수분을 차단하는 통조림(주석 도금)의 원리입니다."}]},
  {"id":40,"c":"지구와 생명의 역사","q":"세포 호흡에서 에너지가 방출되는 이유는?","img":"","o":[{"t":"① 포도당이 환원되면서 에너지를 흡수하기 때문이다.","a":0,"r":"포도당은 산화되며 에너지를 방출합니다."},{"t":"② 포도당과 같이 에너지가 많은 물질이 산화되어 에너지가 적은 이산화 탄소와 물로 분해되기 때문이다.","a":1,"r":"고에너지 물질인 유기물이 저에너지 물질인 무기물로 산화, 분해되면서 에너지 차이만큼 방출됩니다."},{"t":"③ 산소가 산화되면서 에너지를 방출하기 때문이다.","a":0,"r":"산소는 환원됩니다."},{"t":"④ 물이 포도당으로 합성되면서 에너지를 내보내기 때문이다.","a":0,"r":"물에서 포도당이 되는 것은 광합성이며 에너지를 흡수합니다."}]},
  {"id":41,"c":"구리판 가열 실험","q":"붉은색 구리판을 알코올 램프의 겉불꽃에 넣고 가열했을 때 나타나는 변화는?","img":"","o":[{"t":"① 은백색으로 변한다.","a":0,"r":"마그네슘 등의 연소 빛깔과 혼동입니다."},{"t":"② 검은색으로 변한다.","a":1,"r":"구리(Cu)가 겉불꽃의 산소와 반응하여 검은색의 산화 구리(II)(CuO)로 산화됩니다."},{"t":"③ 푸른색으로 변한다.","a":0,"r":"구리 이온(Cu²⁺) 수용액이 푸른색입니다."},{"t":"④ 붉은색을 그대로 유지한다.","a":0,"r":"가열하면 색이 변합니다."}]},
  {"id":42,"c":"구리판 가열 실험","q":"붉은색 구리판을 겉불꽃에 넣고 가열할 때 일어나는 화학 반응식은?","img":"","o":[{"t":"① 2Cu + O₂ → 2CuO","a":1,"r":"구리가 산소와 반응하여 산화 구리(II)가 되는 반응입니다."},{"t":"② CuO + C → Cu + CO","a":0,"r":"이것은 산화 구리가 환원되는 반응입니다."},{"t":"③ Cu + H₂O → CuO + H₂","a":0,"r":"구리는 물과 반응하지 않습니다."},{"t":"④ CuO + H₂ → Cu + H₂O","a":0,"r":"수소에 의한 환원 반응입니다."}]},
  {"id":43,"c":"구리판 가열 실험","q":"알코올 램프의 겉불꽃에서 구리가 산화되는 이유로 가장 적절한 것은?","img":"","o":[{"t":"① 겉불꽃의 온도가 가장 낮기 때문이다.","a":0,"r":"겉불꽃은 온도가 가장 높습니다."},{"t":"② 겉불꽃에는 산소가 충분히 공급되기 때문이다.","a":1,"r":"겉불꽃은 공기와 직접 접촉하여 산소가 풍부하므로 산화 반응이 잘 일어납니다."},{"t":"③ 겉불꽃에는 일산화 탄소가 풍부하기 때문이다.","a":0,"r":"일산화 탄소는 불완전 연소하는 속불꽃에 많습니다."},{"t":"④ 겉불꽃에서는 알코올이 기화만 하기 때문이다.","a":0,"r":"완전 연소가 일어나는 곳입니다."}]},
  {"id":44,"c":"구리판 가열 실험","q":"검게 변한 구리판을 알코올 램프의 속불꽃에 넣었을 때 구리판의 색깔 변화는?","img":"","o":[{"t":"① 검은색이 그대로 유지된다.","a":0,"r":"환원되어 색이 변합니다."},{"t":"② 다시 붉은색으로 변한다.","a":1,"r":"속불꽃의 일산화 탄소 등에 의해 산화 구리(II)가 다시 구리(Cu)로 환원되어 본래의 붉은색을 띱니다."},{"t":"③ 푸른색으로 변한다.","a":0,"r":"색 변화가 틀렸습니다."},{"t":"④ 흰색 재로 변한다.","a":0,"r":"구리는 흰색 재가 되지 않습니다."}]},
  {"id":45,"c":"구리판 가열 실험","q":"검은색 산화 구리(II)가 묻은 구리판을 속불꽃에 넣었을 때 산화 구리(II)를 구리로 환원시키는 주된 물질은?","img":"","o":[{"t":"① 산소 (O₂)","a":0,"r":"산소는 산화시킵니다."},{"t":"② 이산화 탄소 (CO₂)","a":0,"r":"이산화 탄소는 이미 완전 연소된 형태입니다."},{"t":"③ 일산화 탄소 (CO) 또는 탄소 (C)","a":1,"r":"속불꽃은 산소가 부족해 불완전 연소가 일어나므로 탄소 알갱이나 일산화 탄소가 생성되어 환원제 역할을 합니다."},{"t":"④ 질소 (N₂)","a":0,"r":"질소는 불활성에 가깝습니다."}]},
  {"id":46,"c":"구리판 가열 실험","q":"검게 변한 구리판을 속불꽃에 넣었을 때 일어나는 반응을 나타낸 화학 반응식으로 옳은 것은? (일산화 탄소가 환원제로 작용할 경우)","img":"","o":[{"t":"① CuO + CO → Cu + CO₂","a":1,"r":"검은색 CuO가 CO에게 산소를 빼앗기고 붉은색 Cu로 환원되며, CO는 CO₂로 산화됩니다."},{"t":"② 2Cu + O₂ → 2CuO","a":0,"r":"겉불꽃에서의 산화 반응입니다."},{"t":"③ CuO + O₂ → CuO₃","a":0,"r":"존재하지 않는 반응입니다."},{"t":"④ Cu + CO₂ → CuO + CO","a":0,"r":"반응이 역방향입니다."}]},
  {"id":47,"c":"구리판 가열 실험","q":"산화 구리(II) 가루와 탄소 가루를 섞어 시험관에 넣고 가열하는 실험에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 산화 구리(II)는 산화되어 붉은색으로 변한다.","a":0,"r":"산화 구리는 환원되어 붉은색(Cu)이 됩니다."},{"t":"② 탄소는 산소를 얻어 이산화 탄소로 산화된다.","a":1,"r":"탄소 가루는 환원제로 작용하여 산소를 얻고 CO₂ 기체로 산화됩니다."},{"t":"③ 시험관의 질량은 가열 전후로 변하지 않는다.","a":0,"r":"이산화 탄소 기체가 날아가므로 질량이 감소합니다."},{"t":"④ 발생하는 기체를 석회수에 통과시키면 아무런 변화가 없다.","a":0,"r":"이산화 탄소가 발생하여 석회수를 뿌옇게 흐리게 합니다."}]},
  {"id":48,"c":"구리판 가열 실험","q":"산화 구리(II)와 탄소 가루의 반응(2CuO + C → 2Cu + CO₂)에서 환원제는 무엇인가?","img":"","o":[{"t":"① CuO","a":0,"r":"CuO는 자신은 환원되면서 다른 물질을 산화시키는 산화제입니다."},{"t":"② C","a":1,"r":"탄소(C)는 산소를 빼앗아 자신은 산화되고 다른 물질을 환원시키는 환원제입니다."},{"t":"③ Cu","a":0,"r":"생성물입니다."},{"t":"④ CO₂","a":0,"r":"생성물입니다."}]},
  {"id":49,"c":"구리판 가열 실험","q":"구리판을 겉불꽃과 속불꽃에 번갈아 넣는 실험을 통해 알 수 있는 사실은?","img":"","o":[{"t":"① 구리는 산소와 반응하지 않는 귀금속이다.","a":0,"r":"구리는 산화됩니다."},{"t":"② 산화 환원 반응은 항상 한쪽 방향으로만 일어난다.","a":0,"r":"가역적인 성격을 보여주어 다시 환원됨을 알 수 있습니다."},{"t":"③ 불꽃의 위치에 따라 산소의 공급량이 달라 산화와 환원을 교대로 관찰할 수 있다.","a":1,"r":"겉불꽃(산소 충분, 산화)과 속불꽃(산소 부족, 불완전 연소물에 의한 환원)의 차이를 잘 보여줍니다."},{"t":"④ 구리는 속불꽃에서 더 잘 산화된다.","a":0,"r":"속불꽃에서는 환원됩니다."}]},
  {"id":50,"c":"구리판 가열 실험","q":"알코올 램프의 겉불꽃과 속불꽃에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 겉불꽃은 온도가 낮고 불완전 연소가 일어난다.","a":0,"r":"겉불꽃은 온도가 가장 높고 완전 연소가 일어납니다."},{"t":"② 속불꽃은 산소 공급이 충분하여 완전 연소가 일어난다.","a":0,"r":"산소 공급이 부족하여 불완전 연소가 일어납니다."},{"t":"③ 겉불꽃에서는 물질이 환원되기 쉽다.","a":0,"r":"겉불꽃에서는 산화되기 쉽습니다."},{"t":"④ 속불꽃에는 불완전 연소로 생성된 일산화 탄소나 탄소 알갱이가 존재한다.","a":1,"r":"산소가 부족해 생성된 이 물질들이 환원제 역할을 합니다."}]},
  {"id":51,"c":"금속과 산의 반응","q":"마그네슘 리본을 묽은 염산에 넣었을 때 일어나는 현상으로 옳은 것은?","img":"","o":[{"t":"① 붉은색 기체가 발생한다.","a":0,"r":"수소 기체는 무색 무취입니다."},{"t":"② 마그네슘이 전자를 얻어 산화된다.","a":0,"r":"마그네슘은 전자를 잃고 산화됩니다."},{"t":"③ 수소 기체(H₂)가 발생한다.","a":1,"r":"금속이 산과 반응하면 금속은 산화되어 녹고, 수소 이온이 환원되어 수소 기체가 발생합니다."},{"t":"④ 용액의 질량이 점차 감소한다.","a":0,"r":"금속이 녹아 들어가고 가벼운 수소가 빠져나가 전체 용액의 질량은 증가합니다 (기체 발생으로 닫힌 용기가 아니면 총 질량은 감소할 수 있으나, 용액 자체의 질량은 무거운 이온이 들어와 증가함)."}]},
  {"id":52,"c":"금속과 산의 반응","q":"마그네슘(Mg)과 묽은 염산(HCl)의 반응에서 산화되는 물질과 환원되는 물질을 바르게 짝지은 것은?","img":"","o":[{"t":"① 산화: Mg, 환원: H⁺","a":1,"r":"Mg는 전자를 잃고 Mg²⁺로 산화되며, H⁺는 전자를 얻어 H₂로 환원됩니다."},{"t":"② 산화: H⁺, 환원: Mg","a":0,"r":"H⁺는 전자를 얻습니다."},{"t":"③ 산화: Cl⁻, 환원: Mg","a":0,"r":"염화 이온은 반응에 참여하지 않는 구경꾼 이온입니다."},{"t":"④ 산화: Mg, 환원: Cl⁻","a":0,"r":"Cl⁻는 변화가 없습니다."}]},
  {"id":53,"c":"금속과 산의 반응","q":"아연(Zn) 판을 묽은 황산(H₂SO₄)에 넣었을 때의 알짜 이온 반응식으로 옳은 것은?","img":"","o":[{"t":"① Zn + 2H⁺ → Zn²⁺ + H₂","a":1,"r":"아연이 수소 이온에게 전자를 내어주고 수소 기체가 발생하는 반응의 알짜 이온 반응식입니다."},{"t":"② Zn + SO₄²⁻ → ZnSO₄","a":0,"r":"앙금 생성 반응이 아닙니다."},{"t":"③ Zn²⁺ + H₂ → Zn + 2H⁺","a":0,"r":"아연의 반응성이 수소보다 커서 역반응은 일어나지 않습니다."},{"t":"④ Zn + 2HCl → ZnCl₂ + H₂","a":0,"r":"이것은 염산과의 전체 반응식이며 알짜 이온 반응식이 아닙니다."}]},
  {"id":54,"c":"금속과 산의 반응","q":"마그네슘과 묽은 염산의 반응이 진행될 때 수용액 속 이온 수의 변화로 옳은 것은?","img":"","o":[{"t":"① 전체 양이온 수는 증가한다.","a":0,"r":"수소 이온 2개가 사라질 때 마그네슘 이온 1개가 생기므로 양이온 수는 감소합니다."},{"t":"② 전체 양이온 수는 감소한다.","a":1,"r":"2H⁺가 환원되어 기체로 날아가고 1개의 Mg²⁺가 생성되므로 수용액 속 전체 양이온 수는 감소합니다."},{"t":"③ 수소 이온의 수는 일정하게 유지된다.","a":0,"r":"수소 기체로 환원되므로 감소합니다."},{"t":"④ 염화 이온(Cl⁻)의 수는 감소한다.","a":0,"r":"구경꾼 이온이므로 일정합니다."}]},
  {"id":55,"c":"금속과 산의 반응","q":"금속이 산과 반응할 때 발생하는 기체를 확인하는 가장 적절한 방법은?","img":"","o":[{"t":"① 석회수에 통과시킨다.","a":0,"r":"이산화 탄소를 확인하는 방법입니다."},{"t":"② 냄새를 맡아본다.","a":0,"r":"수소 기체는 냄새가 없습니다."},{"t":"③ 불꽃을 가까이 가져가 '퍽' 소리가 나며 타는지 확인한다.","a":1,"r":"가연성 기체인 수소를 확인하는 대표적인 방법입니다."},{"t":"④ 푸른색 리트머스 종이를 대어 붉게 변하는지 확인한다.","a":0,"r":"산성 기체를 확인하는 방법입니다."}]},
  {"id":56,"c":"금속과 산의 반응","q":"금속 조각을 묽은 염산에 넣었을 때 기체가 발생하지 않는 금속은? (단, 반응성은 칼칼나마알아철니주납(H)구수은백금)","img":"","o":[{"t":"① 마그네슘 (Mg)","a":0,"r":"수소보다 반응성이 커서 수소 기체를 발생시킵니다."},{"t":"② 아연 (Zn)","a":0,"r":"수소보다 반응성이 큽니다."},{"t":"③ 철 (Fe)","a":0,"r":"수소보다 반응성이 큽니다."},{"t":"④ 구리 (Cu)","a":1,"r":"구리는 수소보다 반응성이 작아 일반적인 묽은 산과 반응하여 수소 기체를 발생시키지 않습니다."}]},
  {"id":57,"c":"금속과 산의 반응","q":"철판에 묽은 염산을 떨어뜨렸을 때 일어나는 반응에 대한 설명으로 틀린 것은?","img":"","o":[{"t":"① 철은 전자를 잃고 산화된다.","a":0,"r":"맞는 설명입니다."},{"t":"② 수소 기체가 발생한다.","a":0,"r":"철은 수소보다 반응성이 커서 반응이 일어납니다."},{"t":"③ 수소 이온은 환원제 역할을 한다.","a":1,"r":"수소 이온은 전자를 '얻어' 환원되므로 자신은 환원되고 철을 산화시키는 '산화제' 역할을 합니다."},{"t":"④ 염화 이온의 개수는 반응 전후에 변함이 없다.","a":0,"r":"구경꾼 이온이므로 변함이 없습니다."}]},
  {"id":58,"c":"금속과 산의 반응","q":"다음 금속 중 묽은 산과 반응하여 가장 격렬하게 수소 기체를 발생시키는 것은?","img":"","o":[{"t":"① 철(Fe)","a":0,"r":"반응성이 상대적으로 작습니다."},{"t":"② 아연(Zn)","a":0,"r":"마그네슘보다 반응성이 작습니다."},{"t":"③ 마그네슘(Mg)","a":1,"r":"제시된 금속 중 마그네슘이 반응성이 가장 커서 가장 격렬하게 반응합니다."},{"t":"④ 은(Ag)","a":0,"r":"수소보다 반응성이 작아 반응하지 않습니다."}]},
  {"id":59,"c":"금속과 산의 반응","q":"마그네슘과 묽은 황산이 반응할 때 전자의 이동 방향으로 옳은 것은?","img":"","o":[{"t":"① H⁺ 에서 Mg로 이동한다.","a":0,"r":"Mg가 전자를 잃습니다."},{"t":"② Mg에서 H⁺로 이동한다.","a":1,"r":"금속인 마그네슘이 전자를 내어주고, 수소 이온이 그 전자를 받아 수소 기체가 됩니다."},{"t":"③ Mg에서 SO₄²⁻로 이동한다.","a":0,"r":"황산 이온은 반응하지 않습니다."},{"t":"④ SO₄²⁻에서 H⁺로 이동한다.","a":0,"r":"이동하지 않습니다."}]},
  {"id":60,"c":"금속과 산의 반응","q":"산화 환원 반응에서 '산화제'에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 자신은 산화되면서 다른 물질을 환원시킨다.","a":0,"r":"이것은 환원제에 대한 설명입니다."},{"t":"② 자신은 환원되면서 다른 물질을 산화시킨다.","a":1,"r":"산화제는 남을 산화시키기 위해 남의 전자를 빼앗아 오므로 자신은 전자를 얻어 환원됩니다."},{"t":"③ 산화 환원 반응에서 전자를 잃는 물질이다.","a":0,"r":"산화제는 전자를 얻습니다."},{"t":"④ 금속과 산의 반응에서 금속은 항상 산화제로 작용한다.","a":0,"r":"금속은 전자를 잃고 산화되므로 '환원제'로 작용합니다."}]},
  {"id":61,"c":"금속과 산의 반응","q":"충분한 양의 묽은 염산이 들어 있는 비이커에 아연 1g을 넣었을 때와 2g을 넣었을 때, 완전히 반응한 후 발생하는 수소 기체의 총 부피 비는?","img":"","o":[{"t":"① 1 : 1","a":0,"r":"아연의 양이 다르면 발생하는 기체 양도 다릅니다."},{"t":"② 1 : 2","a":1,"r":"발생하는 수소 기체의 양은 한계 반응물인 아연의 질량에 비례하므로 1:2가 됩니다."},{"t":"③ 2 : 1","a":0,"r":"비율이 반대입니다."},{"t":"④ 1 : 4","a":0,"r":"비례 관계가 아닙니다."}]},
  {"id":62,"c":"금속과 산의 반응","q":"마그네슘을 묽은 염산에 넣고 반응시킬 때, 시간이 지남에 따라 증가하는 값을 모두 고른다면? (가: 수소 기체의 부피, 나: 용액 속 Mg²⁺ 수, 다: 용액 속 H⁺ 수)","img":"","o":[{"t":"① 가","a":0,"r":"나도 증가합니다."},{"t":"② 다","a":0,"r":"H⁺는 감소합니다."},{"t":"③ 가, 나","a":1,"r":"수소 기체가 발생하여 부피가 증가하고, 마그네슘이 녹아 들어가 Mg²⁺ 수도 증가합니다."},{"t":"④ 가, 다","a":0,"r":"다(H⁺)는 감소합니다."}]},
  {"id":63,"c":"금속과 산의 반응","q":"수소보다 반응성이 작은 금속으로 묽은 산에 넣어도 수소 기체가 발생하지 않는 금속끼리 묶인 것은?","img":"","o":[{"t":"① 철, 납","a":0,"r":"둘 다 수소보다 반응성이 큽니다."},{"t":"② 마그네슘, 알루미늄","a":0,"r":"둘 다 격렬히 반응합니다."},{"t":"③ 구리, 은","a":1,"r":"구리(Cu), 은(Ag), 금(Au) 등은 수소보다 전자를 잃으려는 성질이 작아 산과 반응하여 H₂를 내지 못합니다."},{"t":"④ 아연, 구리","a":0,"r":"아연은 반응합니다."}]},
  {"id":64,"c":"금속과 산의 반응","q":"어떤 금속 M을 묽은 염산에 넣었더니 M + 2H⁺ → M²⁺ + H₂ 의 반응이 일어났다. 이 반응에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 금속 M은 H보다 반응성이 작다.","a":0,"r":"수소 기체를 발생시켰으므로 M이 수소보다 반응성이 큽니다."},{"t":"② 금속 M은 환원제로 작용했다.","a":1,"r":"M은 전자를 잃고 산화되었으므로 환원제입니다."},{"t":"③ H⁺는 전자를 잃고 산화되었다.","a":0,"r":"H⁺는 전자를 얻어 환원되었습니다."},{"t":"④ 용액의 전체 이온 수는 반응이 진행됨에 따라 증가한다.","a":0,"r":"2개의 H⁺가 사라지고 1개의 M²⁺가 생기므로 전체 이온 수는 감소합니다."}]},
  {"id":65,"c":"금속과 산의 반응","q":"산과 금속의 반응을 일상생활에 적용할 때, 산성 식품(식초, 토마토 등)을 보관하기에 가장 부적절한 용기는?","img":"","o":[{"t":"① 유리그릇","a":0,"r":"유리는 산과 반응하지 않습니다."},{"t":"② 도자기","a":0,"r":"도자기는 산에 안전합니다."},{"t":"③ 플라스틱 용기","a":0,"r":"플라스틱은 산과 반응하지 않습니다."},{"t":"④ 알루미늄 냄비","a":1,"r":"알루미늄은 반응성이 큰 금속으로 산성 식품과 반응하여 금속이 녹아나올 수 있습니다."}]},
  {"id":66,"c":"금속과 금속 이온의 반응","q":"푸른색의 황산 구리(II) 수용액에 아연판을 넣었을 때 나타나는 변화로 옳은 것은?","img":"","o":[{"t":"① 수용액의 푸른색이 점점 짙어진다.","a":0,"r":"구리 이온(Cu²⁺)이 구리로 석출되어 사라지므로 푸른색은 점점 옅어집니다."},{"t":"② 아연판 표면에 붉은색 물질이 달라붙는다.","a":1,"r":"환원된 구리(Cu)가 붉은색으로 아연판 표면에 석출됩니다."},{"t":"③ 아연은 전자를 얻어 환원된다.","a":0,"r":"아연은 반응성이 더 커서 전자를 잃고 산화됩니다."},{"t":"④ 기포가 격렬하게 발생한다.","a":0,"r":"기체가 발생하는 반응이 아닙니다."}]},
  {"id":67,"c":"금속과 금속 이온의 반응","q":"아연과 황산 구리(II) 수용액의 반응(Zn + Cu²⁺ → Zn²⁺ + Cu)에서 아연 판의 질량과 수용액의 밀도 변화는? (단, 원자량은 Zn > Cu 이다.)","img":"","o":[{"t":"① 아연 판 질량 증가, 수용액 밀도 증가","a":0,"r":"반대입니다."},{"t":"② 아연 판 질량 증가, 수용액 밀도 감소","a":0,"r":"Zn이 녹아 나오고 가벼운 Cu가 달라붙으므로 아연 판 전체 질량은 감소합니다."},{"t":"③ 아연 판 질량 감소, 수용액 밀도 증가","a":1,"r":"무거운 아연 이온이 용액 속으로 녹아 들어가고 가벼운 구리가 석출되므로, 아연 판의 질량은 감소하고 수용액은 무거워져 밀도가 증가합니다."},{"t":"④ 아연 판 질량 감소, 수용액 밀도 감소","a":0,"r":"밀도는 증가합니다."}]},
  {"id":68,"c":"금속과 금속 이온의 반응","q":"무색의 질산 은(AgNO₃) 수용액에 붉은색 구리(Cu) 줄을 넣었을 때 일어나는 반응으로 옳지 않은 것은?","img":"","o":[{"t":"① 구리 줄 표면에 은백색의 은(Ag)이 석출된다.","a":0,"r":"은 이온이 환원되어 은이 석출됩니다."},{"t":"② 수용액이 점차 푸른색으로 변한다.","a":0,"r":"구리가 산화되어 Cu²⁺가 용액에 녹아들어가 푸른색을 띱니다."},{"t":"③ 이 반응에서 구리는 환원제로 작용한다.","a":0,"r":"구리는 자신은 산화되면서 은 이온을 환원시키는 환원제입니다."},{"t":"④ 수용액의 전체 양이온 수는 반응이 진행될수록 증가한다.","a":1,"r":"구리 이온(Cu²⁺) 1개가 생길 때 은 이온(Ag⁺) 2개가 사라져야 전하량이 맞으므로 전체 양이온 수는 '감소'합니다."}]},
  {"id":69,"c":"금속과 금속 이온의 반응","q":"질산 은(AgNO₃) 수용액과 구리(Cu)의 반응식: Cu + 2Ag⁺ → Cu²⁺ + 2Ag. 반응이 진행되는 동안 수용액 속 전체 이온 수의 변화는?","img":"","o":[{"t":"① 증가한다.","a":0,"r":"2개의 Ag⁺가 1개의 Cu²⁺로 대체됩니다."},{"t":"② 감소한다.","a":1,"r":"반응 전 2개의 은 이온이 사라지고 1개의 구리 이온이 생성되므로 전체 양이온 수는 감소합니다."},{"t":"③ 일정하다.","a":0,"r":"전하량은 보존되지만 입자 수는 다릅니다."},{"t":"④ 증가하다가 일정해진다.","a":0,"r":"계속 감소하다가 반응이 끝나면 일정해집니다."}]},
  {"id":70,"c":"금속과 금속 이온의 반응","q":"어떤 금속 A를 금속 B 이온(B²⁺)이 들어 있는 수용액에 넣었더니, A판 표면에 B가 석출되었다. 이에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 금속의 반응성은 B가 A보다 크다.","a":0,"r":"A가 녹고 B가 석출되었으므로 반응성(산화되려는 경향)은 A가 더 큽니다."},{"t":"② A는 전자를 얻어 산화된다.","a":0,"r":"A는 전자를 잃고 산화됩니다."},{"t":"③ B²⁺는 환원제로 작용한다.","a":0,"r":"B²⁺는 전자를 얻어 환원되므로 산화제입니다."},{"t":"④ A는 산화되고, B²⁺는 환원된다.","a":1,"r":"반응성이 큰 A는 전자를 잃고 산화되며, B²⁺는 그 전자를 받아 환원됩니다."}]},
  {"id":71,"c":"금속과 금속 이온의 반응","q":"철(Fe) 못을 황산 구리(II) 수용액에 넣었을 때 일어나는 현상으로 가장 거리가 먼 것은?","img":"","o":[{"t":"① 철 못 표면에 붉은색 구리가 석출된다.","a":0,"r":"반응성이 철 > 구리 이므로 구리가 환원되어 석출됩니다."},{"t":"② 수용액의 푸른색이 점차 옅어진다.","a":0,"r":"푸른색을 띠는 Cu²⁺ 이온이 사라지기 때문입니다."},{"t":"③ 수용액 속 전체 이온 수는 점차 증가한다.","a":1,"r":"철 이온은 Fe²⁺, 구리 이온도 Cu²⁺로 전하량이 같아 1:1로 교환되므로 전체 이온 수는 '일정'합니다."},{"t":"④ 철은 전자를 잃고 산화된다.","a":0,"r":"철은 Fe²⁺로 산화됩니다."}]},
  {"id":72,"c":"금속과 금속 이온의 반응","q":"질산 은 수용액이 들어 있는 비커에 납(Pb) 조각을 넣었을 때, 나뭇가지 모양으로 은이 석출되는 현상을 무엇이라고 부르는가?","img":"","o":[{"t":"① 도금 현상","a":0,"r":"전기를 이용해 금속을 입히는 것입니다."},{"t":"② 은 나무(Silver tree) 현상","a":1,"r":"수지상으로 은이 길게 뻗어나가며 석출되는 모습이 나무 같다고 하여 은 나무라고 합니다."},{"t":"③ 녹내장 현상","a":0,"r":"의학 용어입니다."},{"t":"④ 틴들 현상","a":0,"r":"빛의 산란 현상입니다."}]},
  {"id":73,"c":"금속과 금속 이온의 반응","q":"질산 구리(II)(Cu(NO₃)₂) 수용액에 은(Ag) 동전을 넣었다. 일어나는 변화로 옳은 것은?","img":"","o":[{"t":"① 동전 표면에 구리가 석출된다.","a":0,"r":"은은 구리보다 반응성이 작아 반응이 일어나지 않습니다."},{"t":"② 은 동전이 녹아 용액이 뿌옇게 변한다.","a":0,"r":"아무 반응도 일어나지 않습니다."},{"t":"③ 수용액의 푸른색이 짙어진다.","a":0,"r":"반응이 없습니다."},{"t":"④ 아무런 반응도 일어나지 않는다.","a":1,"r":"반응성 순서가 Cu > Ag 이므로, 이온 상태인 Cu²⁺와 금속인 Ag 사이에는 산화 환원 반응이 일어나지 않습니다."}]},
  {"id":74,"c":"금속과 금속 이온의 반응","q":"다음 금속들을 반응성이 큰(산화되기 쉬운) 순서대로 바르게 나열한 것은?","img":"","o":[{"t":"① 마그네슘 > 아연 > 구리 > 은","a":1,"r":"Mg > Zn > Cu > Ag 순으로 반응성(전자를 잃으려는 성질)이 큽니다."},{"t":"② 구리 > 은 > 아연 > 마그네슘","a":0,"r":"거꾸로 된 순서입니다."},{"t":"③ 아연 > 마그네슘 > 은 > 구리","a":0,"r":"틀린 순서입니다."},{"t":"④ 은 > 구리 > 마그네슘 > 아연","a":0,"r":"틀린 순서입니다."}]},
  {"id":75,"c":"금속과 금속 이온의 반응","q":"반응성이 큰 금속의 일반적인 성질로 옳은 것은?","img":"","o":[{"t":"① 전자를 얻기 쉽다.","a":0,"r":"전자를 잃기 쉽습니다."},{"t":"② 양이온이 되기 쉽다.","a":1,"r":"반응성이 큰 금속은 전자를 잃고 양이온으로 산화되려는 경향이 큽니다."},{"t":"③ 쉽게 환원된다.","a":0,"r":"쉽게 산화됩니다."},{"t":"④ 녹이 잘 슬지 않는다.","a":0,"r":"산화가 잘 되므로 녹이 잘 습니다."}]},
  {"id":76,"c":"금속과 금속 이온의 반응","q":"금속 A 이온(A³⁺) 수용액에 금속 B를 넣었더니 B가 녹으면서 수용액의 전체 양이온 수가 증가하였다. 이 반응에서 산화된 금속 B 이온의 전하량으로 가능한 것은?","img":"","o":[{"t":"① +4","a":0,"r":"B가 +4가 되면 4개의 A³⁺가 3개의 B⁴⁺로 바뀌어 이온 수가 감소합니다."},{"t":"② +3","a":0,"r":"이온 수가 일정하게 유지됩니다."},{"t":"③ +2","a":1,"r":"B가 B²⁺가 되면, 전자 6개가 이동할 때 2개의 A³⁺가 사라지고 3개의 B²⁺가 생성되므로 양이온 수가 증가합니다."},{"t":"④ 0","a":0,"r":"양이온이 아닙니다."}]},
  {"id":77,"c":"금속과 금속 이온의 반응","q":"금속 이온 M²⁺가 들어 있는 수용액에 금속 N을 넣었을 때 N은 산화되고 M은 환원되었다. 이때 수용액 속 전체 양이온 수가 감소하였다면, N이온의 전하량은 얼마인가?","img":"","o":[{"t":"① +1","a":0,"r":"+1이면 양이온 수가 증가합니다 (M²⁺ 1개 소모당 N⁺ 2개 생성)."},{"t":"② +2","a":0,"r":"+2이면 양이온 수는 일정합니다."},{"t":"③ +3","a":1,"r":"N이 N³⁺로 산화되면 전자 6개 이동 시 3개의 M²⁺가 환원되고 2개의 N³⁺가 생성되므로 (3 -> 2) 이온 수가 감소합니다."},{"t":"④ 알 수 없다.","a":0,"r":"계산이 가능합니다."}]},
  {"id":78,"c":"금속과 금속 이온의 반응","q":"자유 여신상은 원래 구리빛이었으나 현재는 청록색을 띠고 있다. 그 이유는 무엇인가?","img":"","o":[{"t":"① 구리가 공기 중의 산소, 수분, 이산화 탄소 등과 반응하여 산화되어 녹청을 형성했기 때문이다.","a":1,"r":"구리가 산화 환원 반응을 거쳐 염기성 탄산 구리(녹청)를 형성했기 때문입니다."},{"t":"② 바닷바람에 의해 구리가 은으로 치환되었기 때문이다.","a":0,"r":"은으로 치환되지 않습니다."},{"t":"③ 사람들이 페인트를 칠했기 때문이다.","a":0,"r":"페인트가 아니라 자연적인 산화(녹) 현상입니다."},{"t":"④ 구리가 자외선을 받아 환원되었기 때문이다.","a":0,"r":"산화된 결과입니다."}]},
  {"id":79,"c":"금속과 금속 이온의 반응","q":"알루미늄은 철보다 반응성이 크지만, 창틀 등에 쓰일 때 철보다 덜 녹스는 것처럼 보인다. 그 이유는 무엇인가?","img":"","o":[{"t":"① 알루미늄은 산소와 아예 반응하지 않기 때문이다.","a":0,"r":"알루미늄은 반응성이 매우 큽니다."},{"t":"② 알루미늄이 산화되어 생성된 치밀한 산화 피막이 내부가 계속 산화되는 것을 막아주기 때문이다.","a":1,"r":"표면에 형성된 산화 알루미늄(Al₂O₃) 층이 보호막 역할을 하여 내부 부식을 막아줍니다."},{"t":"③ 알루미늄이 스스로 환원하려는 성질이 강하기 때문이다.","a":0,"r":"금속은 환원되지 않습니다."},{"t":"④ 알루미늄이 철보다 무겁기 때문이다.","a":0,"r":"알루미늄은 철보다 가볍습니다."}]},
  {"id":80,"c":"금속과 금속 이온의 반응","q":"도금(Plating)의 원리에 대한 설명으로 가장 적절한 것은?","img":"","o":[{"t":"① 금속 표면에 반응성이 더 큰 금속을 씌워 환원 반응을 촉진하는 것이다.","a":0,"r":"일반적으로 부식을 막거나 장식을 위해 반응성이 작은 금속으로 덮습니다 (물론 희생 양극법은 다름)."},{"t":"② 산화 환원 반응을 이용하여 어떤 금속의 표면에 다른 금속을 얇게 입히는 기술이다.","a":1,"r":"전해 도금 등은 전자의 이동(산화 환원)을 이용하여 얇은 금속 막을 씌우는 기술입니다."},{"t":"③ 열을 가해 두 금속을 하나로 녹여 합금을 만드는 것이다.","a":0,"r":"이것은 합금입니다."},{"t":"④ 산성 용액에 금속을 녹여 투명하게 만드는 기술이다.","a":0,"r":"도금이 아닙니다."}]},
  {"id":81,"c":"금속과 금속 이온의 반응","q":"배의 선체(철)가 부식되는 것을 막기 위해 철보다 반응성이 큰 아연이나 마그네슘 블록을 선체 밑바닥에 부착하는 부식 방지법을 무엇이라고 하는가?","img":"","o":[{"t":"① 음극화 보호 (희생 양극법)","a":1,"r":"철보다 반응성이 큰 금속이 대신 산화(희생)하면서 철에 전자를 공급해 철의 부식을 막는 방법입니다."},{"t":"② 도장법","a":0,"r":"페인트칠을 하는 것입니다."},{"t":"③ 합금법","a":0,"r":"스테인리스 스틸처럼 아예 금속을 섞는 것입니다."},{"t":"④ 양극 산화법","a":0,"r":"알루미늄 표면을 두껍게 산화시키는 방법입니다."}]},
  {"id":82,"c":"금속과 금속 이온의 반응","q":"음극화 보호(희생 양극법)에서 선체(철)를 보호하기 위해 부착한 아연 블록에서 일어나는 반응은?","img":"","o":[{"t":"① 아연이 전자를 얻어 환원된다.","a":0,"r":"아연은 전자를 잃습니다."},{"t":"② 아연이 전자를 잃고 산화된다.","a":1,"r":"아연이 철 대신 전자를 잃고 산화되면서 철의 부식을 막아줍니다."},{"t":"③ 아연이 철 이온을 환원시킨다.","a":0,"r":"철이 산화되지 않도록 막아줄 뿐, 철 이온을 환원시키는 상황이 아닙니다."},{"t":"④ 아연은 아무런 반응을 하지 않는다.","a":0,"r":"계속 산화되어 닳아 없어지므로 주기적으로 교체해야 합니다."}]},
  {"id":83,"c":"금속과 금속 이온의 반응","q":"금속 나트륨(Na)은 반응성이 매우 커서 공기 중의 산소나 수분과 닿으면 폭발적으로 산화한다. 나트륨의 올바른 보관 방법은?","img":"","o":[{"t":"① 물속에 보관한다.","a":0,"r":"물과 반응하여 수소 기체를 내며 폭발합니다."},{"t":"② 공기 중에 그대로 둔다.","a":0,"r":"산소, 수분과 반응합니다."},{"t":"③ 석유나 벤젠 등 물기나 산소가 없는 유기 용매 속에 보관한다.","a":1,"r":"석유류 액체 속에 넣어 공기 및 수분과의 접촉을 차단해야 합니다."},{"t":"④ 묽은 산 용액 속에 보관한다.","a":0,"r":"더 격렬하게 폭발합니다."}]},
  {"id":84,"c":"금속과 금속 이온의 반응","q":"구리 선을 묽은 질산 은 용액에 넣었을 때 구리 선의 색은 어떻게 변하는가?","img":"","o":[{"t":"① 붉은색에서 검은색으로 변한다.","a":0,"r":"가열할 때 일어나는 변화입니다."},{"t":"② 붉은색 구리 표면에 은백색 앙금(은)이 달라붙는다.","a":1,"r":"환원된 은(Ag)이 구리 선 표면에 석출됩니다."},{"t":"③ 은백색에서 붉은색으로 변한다.","a":0,"r":"구리는 원래 붉은색입니다."},{"t":"④ 색깔 변화 없이 완전히 녹아 없어진다.","a":0,"r":"은이 석출되는 형태를 보입니다."}]},
  {"id":85,"c":"금속과 금속 이온의 반응","q":"다음 중 전자를 잃기 가장 쉬운 금속은?","img":"","o":[{"t":"① 금 (Au)","a":0,"r":"반응성이 가장 작습니다."},{"t":"② 구리 (Cu)","a":0,"r":"반응성이 작습니다."},{"t":"③ 나트륨 (Na)","a":1,"r":"알칼리 금속인 나트륨은 전자를 잃고 산화되려는 성질이 매우 큽니다."},{"t":"④ 철 (Fe)","a":0,"r":"나트륨보다 반응성이 작습니다."}]},
  {"id":86,"c":"생활 속 산화 환원","q":"깎아놓은 사과를 공기 중에 오래 두면 표면이 갈색으로 변하는 현상(갈변 현상)은 무엇 때문인가?","img":"","o":[{"t":"① 사과 속의 효소가 공기 중의 산소와 반응하여 산화되기 때문","a":1,"r":"사과의 폴리페놀 산화 효소가 산소와 반응하여 갈색 물질을 만드는 산화 반응입니다."},{"t":"② 사과가 수분을 잃고 환원되기 때문","a":0,"r":"수분 증발과 환원은 무관합니다."},{"t":"③ 공기 중의 질소가 사과를 썩게 만들기 때문","a":0,"r":"산소와 반응합니다."},{"t":"④ 빛을 받아 사과가 광합성을 다시 시작하기 때문","a":0,"r":"잘려진 사과는 광합성을 하지 못합니다."}]},
  {"id":87,"c":"생활 속 산화 환원","q":"사과의 갈변 현상을 막기 위한 방법으로 적절하지 않은 것은?","img":"","o":[{"t":"① 소금물이나 설탕물에 담근다.","a":0,"r":"산소와의 접촉을 막아 갈변을 지연시킵니다."},{"t":"② 랩으로 밀착시켜 포장한다.","a":0,"r":"산소를 차단하는 좋은 방법입니다."},{"t":"③ 비타민 C (레몬즙)를 뿌린다.","a":0,"r":"비타민 C가 사과 대신 먼저 산화되어 갈변을 막는 항산화제 역할을 합니다."},{"t":"④ 따뜻하고 산소가 풍부한 곳에 보관한다.","a":1,"r":"산소가 많고 온도가 높으면 효소 작용(산화)이 활발해져 갈변이 더 빨리 일어납니다."}]},
  {"id":88,"c":"생활 속 산화 환원","q":"겨울철에 흔히 사용하는 흔드는 핫팩(손난로)의 발열 원리는 무엇인가?","img":"","o":[{"t":"① 철 가루가 공기 중의 산소와 반응하여 빠르게 산화될 때 방출되는 열을 이용한다.","a":1,"r":"손난로 안의 철 가루가 산화 철로 변하는 발열 산화 반응을 이용한 것입니다."},{"t":"② 철 가루가 환원될 때 열을 흡수하는 성질을 이용한다.","a":0,"r":"산화 반응이며, 열을 방출합니다."},{"t":"③ 핫팩 내부의 물이 얼면서 내는 응고열을 이용한다.","a":0,"r":"이것은 똑딱이 손난로(아세트산 나트륨 과냉각)의 원리와 혼동된 것입니다."},{"t":"④ 탄소 가루가 연소하여 불이 붙는 원리이다.","a":0,"r":"불꽃이 이는 연소가 아니라 느린 산화입니다."}]},

  <script>
    let rawQuizData = [];
    try {
      const jsonText = document.getElementById("quiz-data").textContent;
      rawQuizData = JSON.parse(jsonText);
    } catch (e) {
      showCustomAlert("문제 데이터를 불러오는 중 오류가 발생했습니다. JSON 형식을 확인해주세요.");
      console.error("JSON Parsing Error:", e);
    }

    let currentIdx = 0;
    let userAnswers = new Array(rawQuizData.length).fill(null);

    const questionBadge = document.getElementById("question-badge");
    const categoryBadge = document.getElementById("category-badge");
    const questionCounter = document.getElementById("question-counter");
    const questionText = document.getElementById("question-text");
    const questionImage = document.getElementById("question-image");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const resultAlert = document.getElementById("result-alert");
    const rationalesList = document.getElementById("rationales-list");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const navGrid = document.getElementById("nav-grid");
    const scoreDisplay = document.getElementById("score-display");
    const progressBar = document.getElementById("progress-bar");
    const resetBtn = document.getElementById("reset-btn");
    const editModal = document.getElementById("edit-modal");
    const nextBtnTop = document.getElementById("next-btn-top");

    // 커스텀 모달 함수
    function showCustomAlert(msg) {
      document.getElementById('custom-alert-msg').innerText = msg;
      document.getElementById('custom-alert').classList.remove('hidden');
    }

    function showCustomConfirm(msg, onConfirm) {
      document.getElementById('custom-confirm-msg').innerText = msg;
      const confirmModal = document.getElementById('custom-confirm');
      confirmModal.classList.remove('hidden');
      
      document.getElementById('custom-confirm-ok').onclick = function() {
        confirmModal.classList.add('hidden');
        if(onConfirm) onConfirm();
      };
      
      document.getElementById('custom-confirm-cancel').onclick = function() {
        confirmModal.classList.add('hidden');
      };
    }

    function initNavGrid() {
      navGrid.innerHTML = "";
      rawQuizData.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.innerText = idx + 1;
        btn.id = `nav-btn-${idx}`;
        // 100문항을 고려하여 버튼 크기(모바일 패딩 등) 최적화
        btn.className = "w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs border border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200 transition shadow-sm";
        btn.onclick = () => loadQuestion(idx);
        navGrid.appendChild(btn);
      });
      updateScoreAndProgress();
    }

    function updateScoreAndProgress() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null && rawQuizData[idx].o[ans].a === 1) correctCount++;
      });
      scoreDisplay.innerText = `${correctCount} / ${answeredCount} (총 ${rawQuizData.length}문항)`;
      progressBar.style.width = `${(answeredCount / rawQuizData.length) * 100}%`;

      rawQuizData.forEach((_, idx) => {
        const navBtn = document.getElementById(`nav-btn-${idx}`);
        if(!navBtn) return;
        if (userAnswers[idx] === null) {
          navBtn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs border shadow-sm ${idx === currentIdx ? 'border-indigo-600 ring-2 ring-indigo-400 bg-white text-indigo-700 scale-110' : 'border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200'}`;
        } else {
          const isUserCorrect = rawQuizData[idx].o[userAnswers[idx]].a === 1;
          navBtn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs shadow-sm bg-${isUserCorrect ? 'emerald' : 'rose'}-500 text-white ${idx === currentIdx ? `ring-2 ring-${isUserCorrect ? 'emerald' : 'rose'}-300 scale-110` : ''}`;
        }
      });
    }

    function loadQuestion(idx) {
      if (idx < 0 || idx >= rawQuizData.length) return;
      currentIdx = idx;
      const q = rawQuizData[idx];

      window.scrollTo(0, 0);

      questionBadge.innerText = `문항 ${q.id || (idx+1)}`;
      categoryBadge.innerText = q.c;
      questionCounter.innerText = `${idx + 1} / ${rawQuizData.length}`;
      questionText.innerText = q.q;
      
      if(q.img && q.img.trim() !== "") {
          questionImage.src = q.img;
          questionImage.classList.remove('hidden');
      } else {
          questionImage.src = "";
          questionImage.classList.add('hidden');
      }

      optionsContainer.innerHTML = "";
      const selected = userAnswers[idx];

      q.o.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3 text-sm md:text-base font-medium shadow-sm ";
        
        if (selected === null) {
          btn.className += "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 text-slate-800";
          btn.onclick = () => selectOption(optIdx);
        } else {
          if (opt.a === 1) btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold z-10 scale-[1.01]";
          else if (selected === optIdx) btn.className += "border-rose-500 bg-rose-50 text-rose-900";
          else btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
          btn.disabled = true;
        }

        const iconSpan = document.createElement("span");
        iconSpan.className = "pt-0.5 shrink-0"; 
        if (selected !== null) {
          if (opt.a === 1) iconSpan.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-xl drop-shadow-md"></i>';
          else if (selected === optIdx) iconSpan.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-xl"></i>';
          else iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-300 text-xl"></i>';
        } else {
          iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-400 text-xl group-hover:text-indigo-600"></i>';
        }

        const textSpan = document.createElement("span");
        textSpan.className = "flex-1 leading-relaxed";
        textSpan.innerText = opt.t;
        
        btn.appendChild(iconSpan);
        btn.appendChild(textSpan);
        optionsContainer.appendChild(btn);
      });

      if (selected !== null) {
        renderExplanation(selected);
        explanationBox.classList.remove("hidden");
      } else {
        explanationBox.classList.add("hidden");
      }

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === rawQuizData.length - 1;
      nextBtnTop.disabled = idx === rawQuizData.length - 1;
      updateScoreAndProgress();
    }

    function selectOption(optIdx) {
      userAnswers[currentIdx] = optIdx;
      loadQuestion(currentIdx);
    }

    function renderExplanation(selectedIdx) {
      const q = rawQuizData[currentIdx];
      const isCorrect = q.o[selectedIdx].a === 1;

      if (isCorrect) {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-emerald-900 bg-emerald-100 border border-emerald-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-2xl drop-shadow"></i> <div>정답입니다! 훌륭합니다.</div>';
      } else {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-rose-900 bg-rose-100 border border-rose-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 text-2xl drop-shadow"></i> <div>오답입니다. 아래의 해설을 꼼꼼히 확인하세요.</div>';
      }

      rationalesList.innerHTML = "";
      q.o.forEach((opt) => {
        const item = document.createElement("div");
        item.className = `p-3 rounded-lg border shadow-sm ${opt.a === 1 ? 'bg-emerald-50/80 border-emerald-200' : 'bg-white border-slate-200'}`;
        
        const header = document.createElement("div");
        header.className = "font-bold mb-1.5 flex items-start gap-2";
        if (opt.a === 1) header.innerHTML = `<span class="bg-emerald-600 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5 shadow-sm">정답 보기</span> <span class="text-emerald-900">${opt.t}</span>`;
        else header.innerHTML = `<span class="bg-slate-400 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5">오답 보기</span> <span class="text-slate-800">${opt.t}</span>`;
        
        const body = document.createElement("div");
        body.className = "text-xs md:text-sm text-slate-600 pl-1 leading-relaxed";
        body.innerText = opt.r;

        item.appendChild(header);
        item.appendChild(body);
        rationalesList.appendChild(item);
      });
    }

    function openEditModal() {
      const q = rawQuizData[currentIdx];
      document.getElementById('edit-cat').value = q.c;
      document.getElementById('edit-q').value = q.q;
      
      if(q.img && q.img.trim() !== "") {
          document.getElementById('edit-img-base64').value = q.img;
          document.getElementById('edit-img-preview').src = q.img;
          document.getElementById('edit-img-preview').classList.remove('hidden');
          document.getElementById('btn-clear-img').classList.remove('hidden');
      } else {
          clearImage(); 
      }

      for(let i=0; i<4; i++) {
        document.getElementById(`edit-opt-${i}`).value = q.o[i].t;
        document.getElementById(`edit-rat-${i}`).value = q.o[i].r;
        if(q.o[i].a === 1) {
          document.querySelector(`input[name="edit-ans"][value="${i}"]`).checked = true;
        }
      }
      
      document.body.classList.add('modal-open');
      editModal.classList.remove('hidden');
    }

    function closeEditModal() {
      document.body.classList.remove('modal-open');
      editModal.classList.add('hidden');
    }

    function saveEditedQuestion() {
      const q = rawQuizData[currentIdx];
      q.c = document.getElementById('edit-cat').value;
      q.q = document.getElementById('edit-q').value;
      q.img = document.getElementById('edit-img-base64').value;
      
      const checkedOpt = document.querySelector('input[name="edit-ans"]:checked');
      if(!checkedOpt) {
          showCustomAlert("정답 라디오 버튼을 선택해주세요.");
          return;
      }
      const correctVal = checkedOpt.value;
      
      for(let i=0; i<4; i++) {
        q.o[i].t = document.getElementById(`edit-opt-${i}`).value;
        q.o[i].r = document.getElementById(`edit-rat-${i}`).value;
        q.o[i].a = (i.toString() === correctVal) ? 1 : 0;
      }
      
      closeEditModal();
      loadQuestion(currentIdx);
      showCustomAlert("문제가 성공적으로 수정되었습니다.\n\n※ 영구 저장을 원하시면 우측 상단의 [수정본 다운로드]를 클릭하세요.");
    }

    function addNewQuestion() {
      const newQ = {
        id: rawQuizData.length + 1,
        c: "새 카테고리",
        q: "새로운 문제를 입력하세요.",
        img: "",
        o: [
          { t: "① 보기 1", a: 1, r: "해설 1" },
          { t: "② 보기 2", a: 0, r: "해설 2" },
          { t: "③ 보기 3", a: 0, r: "해설 3" },
          { t: "④ 보기 4", a: 0, r: "해설 4" }
        ]
      };
      rawQuizData.push(newQ);
      userAnswers.push(null);
      initNavGrid();
      loadQuestion(rawQuizData.length - 1);
      openEditModal(); 
    }

    function deleteCurrentQuestion() {
      if(rawQuizData.length <= 1) {
          showCustomAlert("최소 1개의 문제는 남아있어야 합니다.");
          return;
      }
      showCustomConfirm("정말로 이 문제를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.", () => {
          rawQuizData.splice(currentIdx, 1);
          userAnswers.splice(currentIdx, 1);
          
          rawQuizData.forEach((q, i) => q.id = i + 1);
          
          initNavGrid();
          closeEditModal();
          
          let nextIdx = currentIdx >= rawQuizData.length ? rawQuizData.length - 1 : currentIdx;
          loadQuestion(nextIdx);
      });
    }

    function encodeImageFileAsURL(element) {
      const file = element.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        document.getElementById('edit-img-base64').value = reader.result;
        document.getElementById('edit-img-preview').src = reader.result;
        document.getElementById('edit-img-preview').classList.remove('hidden');
        document.getElementById('btn-clear-img').classList.remove('hidden');
      }
      reader.readAsDataURL(file);
    }

    function clearImage() {
      document.getElementById('edit-img-upload').value = "";
      document.getElementById('edit-img-base64').value = "";
      document.getElementById('edit-img-preview').src = "";
      document.getElementById('edit-img-preview').classList.add('hidden');
      document.getElementById('btn-clear-img').classList.add('hidden');
    }

    function downloadUpdatedHTML() {
      const dataScript = document.getElementById('quiz-data');
      dataScript.textContent = "\n" + JSON.stringify(rawQuizData, null, 2) + "\n";
      
      let htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "고1_통합과학2_산화환원반응_100제.html"; 
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    prevBtn.addEventListener("click", () => { if (currentIdx > 0) loadQuestion(currentIdx - 1); });
    nextBtn.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    nextBtnTop.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    
    resetBtn.addEventListener("click", () => {
      showCustomConfirm("풀이 기록을 모두 초기화하시겠습니까? 처음부터 다시 풉니다.", () => {
        userAnswers = new Array(rawQuizData.length).fill(null);
        loadQuestion(0);
      });
    });

    document.addEventListener("keydown", (e) => {
      if(!editModal.classList.contains('hidden') || !document.getElementById('custom-alert').classList.contains('hidden') || !document.getElementById('custom-confirm').classList.contains('hidden')) return;
      if (e.key === "ArrowLeft" && currentIdx > 0) loadQuestion(currentIdx - 1);
      else if (e.key === "ArrowRight" && currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1);
      else if (["1", "2", "3", "4"].includes(e.key) && userAnswers[currentIdx] === null) selectOption(parseInt(e.key) - 1);
    });

    // 초기 실행
    if (rawQuizData.length > 0) {
      initNavGrid();
      loadQuestion(0);
    }
  </script>
</body></html>
