<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col relative">

      <div class="flex items-center space-x-3 w-full md:w-auto">
        <a href="#" class="bg-indigo-800 hover:bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 border border-indigo-500 shadow-sm shrink-0">
          <i class="fa-solid fa-arrow-left"></i> 메인으로
        </a>
        <i class="fa-solid fa-bolt text-2xl text-amber-300 hidden sm:block"></i>
        <div>
          <h1 class="text-xl font-bold tracking-tight truncate">통합과학2 에너지 전환과 활용 100제</h1>
          <p class="text-xs text-indigo-200 truncate">고1 중간고사 완벽 대비 CBT 시스템</p>
        </div>
      </div>
      <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-end">
        <div class="text-right mr-2">

          <span id="score-display" class="font-extrabold text-lg text-amber-300">0 / 0 (총 100문항)</span>
        </div>
        <button onclick="downloadUpdatedHTML()" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-2 rounded-lg font-bold transition flex items-center gap-1 border border-emerald-500 shadow-sm">
          <i class="fa-solid fa-download"></i> 파일 다운로드
        </button>
        <button id="reset-btn" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center gap-1 border border-indigo-500">

    </div>

  <div class="w-full bg-indigo-200 h-2">
    <div id="progress-bar" class="bg-amber-400 h-2 transition-all duration-300" style="width: 0%;"></div>
  </div>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden relative">
      <div class="bg-slate-50 border-b border-slate-200 px-4 py-3 sm:px-6 sm:py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <span id="question-badge" class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-full shrink-0">문항 1</span>
          <span id="category-badge" class="bg-slate-200 text-slate-700 text-[11px] sm:text-xs font-semibold px-2 py-0.5 rounded hidden sm:inline-block">통합과학2</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="question-counter" class="text-xs text-slate-500 font-medium mr-1 hidden sm:block">1 / 100</span>
          <button onclick="openEditModal()" class="text-xs text-indigo-600 font-bold hover:text-indigo-800 bg-indigo-50 px-2.5 py-1.5 rounded border border-indigo-200 transition shadow-sm" title="문제 수정">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button id="next-btn-top" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition shadow disabled:opacity-40 disabled:cursor-not-allowed">
            다음 <i class="fa-solid fa-arrow-right ml-0.5"></i>
          </button>
        </div>
      </div>

      <div class="p-6 md:p-8">
        <h2 id="question-text" class="text-lg md:text-xl font-bold text-slate-900 leading-relaxed mb-4">로딩 중...</h2>
        <img id="question-image" src="" alt="첨부 이미지" class="mb-6 max-h-60 rounded-lg border border-slate-200 shadow-sm hidden">
        <div id="options-container" class="space-y-3"></div>

        <div id="explanation-box" class="mt-8 hidden border-t border-slate-200 pt-6 animate-fade-in-up">
          <div id="result-alert" class="p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-sm md:text-base"></div>
          
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
            <h3 class="text-sm font-bold text-indigo-900 flex items-center gap-2">
              <i class="fa-solid fa-book-open-reader text-indigo-600"></i> 해설 상세 보기
            </h3>
            <div id="rationales-list" class="space-y-2 text-sm text-slate-700"></div>
          </div>
        </div>
      </div>

      <div class="bg-slate-50 border-t border-slate-200 px-6 py-4 flex justify-between items-center">
        <button id="prev-btn" class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed">
          <i class="fa-solid fa-arrow-left mr-1"></i> 이전
        </button>
        <button id="next-btn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition shadow disabled:opacity-40 disabled:cursor-not-allowed">
          다음 <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>
    </div>

    <div class="mt-8 bg-white rounded-xl p-5 shadow border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">문항 내비게이션 (100제)</h4>
        <button onclick="addNewQuestion()" class="text-xs bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1 border border-indigo-200 shadow-sm">
          <i class="fa-solid fa-plus"></i> 새 문제 추가
        </button>
      </div>
      <div id="nav-grid" class="flex flex-wrap gap-1 md:gap-1.5 justify-start"></div>
    </div>
  </main>

  <footer class="bg-slate-200 border-t border-slate-300 py-4 text-center text-xs text-slate-500 mt-auto">
    고1 통합과학2 에너지 전환과 활용 CBT 학습 시스템 © 2026
  </footer>

  <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
        <h3 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i>문제 편집</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-rose-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="p-6 overflow-y-auto flex-1 space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">카테고리</label>
          <input type="text" id="edit-cat" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">문제</label>
          <textarea id="edit-q" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
        </div>
        
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
          <label class="block text-xs font-bold text-slate-500 mb-2">이미지 첨부 (선택)</label>
          <div class="flex items-center gap-2 mb-2">
            <input type="file" id="edit-img-upload" accept="image/*" class="text-xs file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" onchange="encodeImageFileAsURL(this)">
            <button type="button" onclick="clearImage()" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-600 px-3 py-1.5 rounded-full font-bold transition hidden" id="btn-clear-img">지우기</button>
          </div>
          <input type="hidden" id="edit-img-base64" value="">
          <img id="edit-img-preview" class="max-h-32 rounded border border-slate-300 shadow-sm hidden" src="">
        </div>

        <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 space-y-4">
          <label class="block text-xs font-bold text-indigo-800 mb-2">보기 및 해설 설정 (정답 선택)</label>
          <div class="flex gap-3 items-start">
            <input type="radio" name="edit-ans" value="0" class="mt-2 w-4 h-4 text-indigo-600">
            <div class="flex-1 space-y-1">
              <input type="text" id="edit-opt-0" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
              <textarea id="edit-rat-0" rows="1" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-600 outline-none resize-none"></textarea>
            </div>
          </div>
          <div class="flex gap-3 items-start">
            <input type="radio" name="edit-ans" value="1" class="mt-2 w-4 h-4 text-indigo-600">
            <div class="flex-1 space-y-1">
              <input type="text" id="edit-opt-1" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
              <textarea id="edit-rat-1" rows="1" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-600 outline-none resize-none"></textarea>
            </div>
          </div>
          <div class="flex gap-3 items-start">
            <input type="radio" name="edit-ans" value="2" class="mt-2 w-4 h-4 text-indigo-600">
            <div class="flex-1 space-y-1">
              <input type="text" id="edit-opt-2" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
              <textarea id="edit-rat-2" rows="1" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-600 outline-none resize-none"></textarea>
            </div>
          </div>
          <div class="flex gap-3 items-start">
            <input type="radio" name="edit-ans" value="3" class="mt-2 w-4 h-4 text-indigo-600">
            <div class="flex-1 space-y-1">
              <input type="text" id="edit-opt-3" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
              <textarea id="edit-rat-3" rows="1" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-600 outline-none resize-none"></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl flex justify-between items-center">
        <button onclick="deleteCurrentQuestion()" class="px-4 py-2 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-sm font-bold hover:bg-rose-100 transition"><i class="fa-solid fa-trash"></i> 삭제</button>
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100 transition">취소</button>
          <button onclick="saveEditedQuestion()" class="px-5 py-2 bg-indigo-600 rounded-lg text-sm font-bold text-white hover:bg-indigo-700 transition shadow">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div id="custom-alert" class="hidden fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
      <p id="custom-alert-msg" class="text-slate-800 font-bold mb-6 whitespace-pre-wrap"></p>
      <button onclick="document.getElementById('custom-alert').classList.add('hidden')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold w-full transition">확인</button>
    </div>
  </div>

  <div id="custom-confirm" class="hidden fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
      <p id="custom-confirm-msg" class="text-slate-800 font-bold mb-6 whitespace-pre-wrap"></p>
      <div class="flex justify-center gap-3">

        <button id="custom-confirm-ok" class="bg-rose-600 hover:bg-rose-700 text-white px-6 py-2 rounded-lg font-bold flex-1 transition">확인</button>
      </div>
    </div>
  </div>

  {"id":26,"c":"전자기 유도와 발전기","q":"유도 기전력(전압)의 크기가 자기 선속의 시간당 변화율과 코일의 감은 수에 비례한다는 법칙은?","img":"","o":[{"t":"① 뉴턴의 법칙","a":0,"r":"역학 법칙입니다."},{"t":"② 패러데이 법칙","a":1,"r":"V = -N (ΔΦ/Δt) 로 표현되는 패러데이의 전자기 유도 법칙입니다."},{"t":"③ 렌츠의 법칙","a":0,"r":"유도 전류의 방향을 결정합니다 (- 부호의 의미)."},{"t":"④ 플레밍의 왼손 법칙","a":0,"r":"자기장 속 전류가 받는 힘의 방향입니다."}]},

  {"id":28,"c":"전자기 유도와 발전기","q":"다음 중 전자기 유도 현상을 이용한 기기가 아닌 것은?","img":"","o":[{"t":"① 발전기","a":0,"r":"전자기 유도의 대표적인 예입니다."},{"t":"② 전기 자전거의 마찰 발전기","a":0,"r":"바퀴가 돌 때 자석을 돌려 전기를 만듭니다."},{"t":"③ 다리미","a":1,"r":"다리미는 전류의 열작용(저항에 의한 발열)을 이용한 기기입니다."},{"t":"④ 도난 방지 게이트","a":0,"r":"태그가 게이트를 지날 때 자기장 변화로 유도 전류를 감지합니다."}]},
  {"id":29,"c":"전자기 유도와 발전기","q":"교통카드 단말기 원리에 대한 설명으로 가장 적절한 것은?","img":"","o":[{"t":"① 단말기가 빛을 쏘면 카드의 태양 전지가 전기를 만든다.","a":0,"r":"태양 전지와 무관합니다."},{"t":"② 단말기의 교류 자기장이 카드 속 코일에 유도 전류를 발생시켜 칩을 작동시킨다.","a":1,"r":"단말기에서 발생하는 자기장이 카드의 코일에 전자기 유도를 일으켜 전원을 공급하고 정보를 통신합니다."},{"t":"③ 카드 내부의 리튬 배터리가 단말기와 통신한다.","a":0,"r":"일반 교통카드는 내장 배터리가 없는 수동형 RFID입니다."},{"t":"④ 정전기 유도로 카드의 전자 회로가 작동한다.","a":0,"r":"정전기가 아닌 전자기 유도입니다."}]},
  {"id":30,"c":"전자기 유도와 발전기","q":"발전기의 원리와 구조에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 코일과 자석이 있으며, 전기를 넣어주면 회전한다.","a":0,"r":"이것은 전동기(모터)의 설명입니다."},{"t":"② 터빈이 회전하여 자석이나 코일이 돌아가면 전자기 유도로 전기 에너지가 생성된다.","a":1,"r":"발전기는 역학적 에너지(터빈 회전)를 전기 에너지로 변환하는 장치로 전자기 유도 원리를 이용합니다."},{"t":"③ 화학 에너지를 직접 전기 에너지로 바꾼다.","a":0,"r":"이것은 화학 전지입니다."},{"t":"④ 전류의 자기 작용을 주로 이용한다.","a":0,"r":"전류가 자기장을 만드는 것이 아니라, 자기장의 변화가 전류를 만듭니다(전자기 유도)."}]},
  {"id":31,"c":"전자기 유도와 발전기","q":"발전기(Generator)와 전동기(Motor)의 관계를 가장 잘 설명한 것은?","img":"","o":[{"t":"① 둘 다 전기 에너지를 역학적 에너지로 바꾼다.","a":0,"r":"발전기는 반대입니다."},{"t":"② 전동기는 역학적 에너지를 전기로, 발전기는 전기를 역학적 에너지로 바꾼다.","a":0,"r":"역순으로 설명되었습니다."},{"t":"③ 발전기는 전자기 유도를, 전동기는 자기장 속 전류가 받는 힘을 이용하며 에너지 전환 방향이 서로 반대이다.","a":1,"r":"발전기(역학→전기), 전동기(전기→역학) 구조는 유사하나 에너지 전환 방향이 다릅니다."},{"t":"④ 발전기는 직류만, 전동기는 교류만 사용한다.","a":0,"r":"둘 다 교류/직류용이 따로 존재합니다."}]},
  {"id":32,"c":"전자기 유도와 발전기","q":"수력, 화력, 원자력 발전소의 공통점은 무엇인가?","img":"","o":[{"t":"① 모두 연료를 연소시켜 열을 얻는다.","a":0,"r":"수력 발전은 물의 퍼텐셜 에너지를 이용합니다."},{"t":"② 모두 전자기 유도 현상을 이용한 발전기를 사용하여 전기를 생산한다.","a":1,"r":"에너지원은 다르지만 터빈을 돌려 발전기(자석과 코일)를 회전시켜 전기를 얻는 원리는 동일합니다."},{"t":"③ 모두 터빈을 사용하지 않는다.","a":0,"r":"모두 터빈을 사용합니다 (태양광 발전 제외)."},{"t":"④ 모두 재생 가능한 에너지를 사용한다.","a":0,"r":"화력과 원자력은 고갈성 자원입니다."}]},
  {"id":33,"c":"전자기 유도와 발전기","q":"자석의 S극이 코일에서 '멀어질' 때 코일의 윗부분(자석 쪽)에 유도되는 극은?","img":"","o":[{"t":"① N극","a":1,"r":"S극이 멀어지는 것을 방해(인력)하기 위해 코일 윗부분에 반대 극인 N극이 유도됩니다."},{"t":"② S극","a":0,"r":"멀어질 때 S극이 생기면 척력이 발생하여 방해하지 못합니다."},{"t":"③ 극이 생기지 않는다.","a":0,"r":"자기장이 변하므로 극이 생깁니다."},{"t":"④ 번갈아 바뀐다.","a":0,"r":"멀어지는 동안에는 일정합니다."}]},
  {"id":34,"c":"전자기 유도와 발전기","q":"마이크(Dynamic Microphone)가 소리를 전기 신호로 바꾸는 원리는?","img":"","o":[{"t":"① 압전 효과","a":0,"r":"압전 마이크도 있으나 다이나믹 마이크는 다릅니다."},{"t":"② 전류의 열작용","a":0,"r":"열과 무관합니다."},{"t":"③ 전자기 유도","a":1,"r":"소리(진동)가 진동판을 흔들면 진동판에 붙은 코일이 자석 주변을 움직이며 전자기 유도로 전기 신호(유도 전류)를 만듭니다."},{"t":"④ 광전 효과","a":0,"r":"빛과 무관합니다."}]},
  {"id":35,"c":"전자기 유도와 발전기","q":"금속 탐지기가 금속을 탐지할 때 이용되는 주된 원리는?","img":"","o":[{"t":"① 금속의 열팽창","a":0,"r":"열과 무관합니다."},{"t":"② 금속 내의 정전기 유도","a":0,"r":"정전기가 아닙니다."},{"t":"③ 전자기 유도에 의한 맴돌이 전류","a":1,"r":"탐지기의 교류 자기장이 금속에 닿으면 금속 내부에 유도 전류(맴돌이 전류)가 생기고, 이 전류가 다시 자기장을 만들어 탐지기가 감지합니다."},{"t":"④ 금속의 방사선 붕괴","a":0,"r":"방사선과 무관합니다."}]},
  {"id":36,"c":"전자기 유도와 발전기","q":"발전소에서 생산된 전력은 대부분 교류(AC)이다. 교류 발전기의 특징으로 옳은 것은?","img":"","o":[{"t":"① 생성되는 전류의 방향이 시간에 따라 주기적으로 바뀐다.","a":1,"r":"발전기의 코일이 회전하면서 자기장 속을 지나는 방향이 계속 바뀌므로 전류의 방향과 세기가 주기적으로 변하는 교류가 발생합니다."},{"t":"② 전류의 방향이 항상 한쪽으로 일정하다.","a":0,"r":"이것은 직류(DC)의 특징입니다."},{"t":"③ 건전지가 만들어내는 전류와 같은 종류이다.","a":0,"r":"건전지는 직류입니다."},{"t":"④ 변압기를 이용해 전압을 바꿀 수 없다.","a":0,"r":"교류는 자기장이 계속 변하므로 변압기를 통해 전압을 쉽게 바꿀 수 있습니다."}]},
  {"id":37,"c":"전자기 유도와 발전기","q":"스피드 건(과속 단속 카메라)의 일부 원리는 자동차에 쏘아 보낸 마이크로파의 주파수 변화를 이용하지만, 자전거의 속도계 중 바퀴에 자석을 달아 속도를 재는 센서의 원리는?","img":"","o":[{"t":"① 광전 효과","a":0,"r":"빛이 아닙니다."},{"t":"② 전자기 유도","a":1,"r":"바퀴에 달린 자석이 포크에 달린 코일 센서를 지날 때마다 전자기 유도에 의해 펄스 전류가 발생하여 바퀴의 회전수를 셉니다."},{"t":"③ 열전 효과","a":0,"r":"열과 무관합니다."},{"t":"④ 옴의 법칙","a":0,"r":"저항과 무관합니다."}]},
  {"id":38,"c":"전자기 유도와 발전기","q":"인덕션 레인지가 냄비를 데우는 원리에 대한 설명으로 옳지 않은 것은?","img":"","o":[{"t":"① 상판 내부 코일에 교류 전류를 흘려 교류 자기장을 만든다.","a":0,"r":"맞는 설명입니다."},{"t":"② 냄비 바닥에 전자기 유도 현상으로 맴돌이 전류가 발생한다.","a":0,"r":"맞는 설명입니다."},{"t":"③ 냄비 바닥의 전기 저항 때문에 맴돌이 전류가 흐를 때 열이 발생한다.","a":0,"r":"맞는 설명입니다."},{"t":"④ 유리 냄비나 뚝배기를 올려놓아도 매우 뜨겁게 가열할 수 있다.","a":1,"r":"인덕션은 맴돌이 전류가 잘 생기는 철, 스테인리스 등의 자성체 금속 용기만 가열할 수 있으며, 유리나 도자기는 가열되지 않습니다."}]},
  {"id":39,"c":"전자기 유도와 발전기","q":"솔레노이드(긴 코일) 내부에 자석을 떨어뜨릴 때 자석의 낙하 속도가 자유 낙하할 때보다 느린 이유는?","img":"","o":[{"t":"① 코일 내부의 공기 저항이 급격히 커지기 때문","a":0,"r":"공기 저항의 차이는 미미합니다."},{"t":"② 자석의 무게가 감소하기 때문","a":0,"r":"무게는 일정합니다."},{"t":"③ 코일에 유도된 전류가 자석의 운동을 방해하는 방향으로 자기장을 만들기 때문","a":1,"r":"렌츠의 법칙에 의해 자석의 낙하(자기장의 변화)를 방해하는 방향으로 코일에 자기장이 형성되어 자기력이 중력의 반대 방향으로 작용합니다."},{"t":"④ 코일의 전기 저항이 자석을 멈추게 하기 때문","a":0,"r":"전기 저항이 아니라 자기력 때문입니다."}]},
  {"id":40,"c":"전자기 유도와 발전기","q":"자석을 코일에 넣었다 뺐다 하는 속도를 2배로 늘리고, 코일의 감은 수를 2배로 늘렸을 때, 유도 기전력(전압)의 크기는 처음의 몇 배가 되는가?","img":"","o":[{"t":"① 변화 없다 (1배)","a":0,"r":"둘 다 기전력을 증가시키는 요인입니다."},{"t":"② 2배","a":0,"r":"하나만 2배일 때입니다."},{"t":"③ 4배","a":1,"r":"유도 기전력 ∝ (감은 수) × (자석의 상대 속도). 둘 다 2배가 되었으므로 2 × 2 = 4배가 됩니다."},{"t":"④ 8배","a":0,"r":"자기력은 그대로이므로 8배가 아닙니다."}]},
  {"id":41,"c":"전력 수송과 변압기","q":"전력(Power, P)을 구하는 공식으로 옳은 것은? (단, V: 전압, I: 전류, R: 저항)","img":"","o":[{"t":"① P = V / I","a":0,"r":"V / I 는 저항(R)입니다."},{"t":"② P = I² × V","a":0,"r":"틀린 공식입니다."},{"t":"③ P = V × I","a":1,"r":"전력(P)은 전압(V)과 전류(I)의 곱입니다."},{"t":"④ P = V² × I","a":0,"r":"틀린 공식입니다."}]},
  {"id":42,"c":"전력 수송과 변압기","q":"발전소에서 10,000W의 전력을 송전선으로 보낼 때, 송전 전압이 100V라면 송전선에 흐르는 송전 전류는 얼마인가?","img":"","o":[{"t":"① 1 A","a":0,"r":"계산이 틀렸습니다."},{"t":"② 10 A","a":0,"r":"계산이 틀렸습니다."},{"t":"③ 100 A","a":1,"r":"P = V × I 이므로 10,000 = 100 × I. 따라서 I = 100A 입니다."},{"t":"④ 1000 A","a":0,"r":"계산이 틀렸습니다."}]},
  {"id":43,"c":"전력 수송과 변압기","q":"송전선에서 열로 손실되는 전력(손실 전력, Ploss)을 나타내는 공식은?","img":"","o":[{"t":"① V × I","a":0,"r":"송전 전력을 의미합니다."},{"t":"② I² × R","a":1,"r":"송전선 자체의 저항(R)과 흐르는 전류(I)의 제곱에 비례하여 열이 발생합니다 (Ploss = I²R)."},{"t":"③ V² / R","a":0,"r":"전압 강하를 알 때 쓰지만 송전에서는 전압 강하를 구하기 어려워 I²R을 씁니다."},{"t":"④ I × R","a":0,"r":"전압(강하)을 의미합니다."}]},
  {"id":44,"c":"전력 수송과 변압기","q":"발전소에서 전력을 보낼 때, 송전 전압을 10배로 높여서 송전하면 송전선에 흐르는 전류와 손실 전력은 어떻게 변하는가? (단, 송전 전력과 송전선 저항은 일정)","img":"","o":[{"t":"① 전류는 10배가 되고, 손실 전력은 100배가 된다.","a":0,"r":"전압을 높이면 전류는 작아집니다."},{"t":"② 전류는 1/10이 되고, 손실 전력은 1/10이 된다.","a":0,"r":"손실 전력은 전류의 제곱에 비례합니다."},{"t":"③ 전류는 1/10이 되고, 손실 전력은 1/100이 된다.","a":1,"r":"P=VI에서 V가 10배가 되면 I는 1/10이 됩니다. 손실 전력(I²R)은 전류의 제곱에 비례하므로 (1/10)² = 1/100 로 대폭 감소합니다."},{"t":"④ 전류는 1/100이 되고, 손실 전력은 1/10이 된다.","a":0,"r":"비율이 틀렸습니다."}]},
  {"id":45,"c":"전력 수송과 변압기","q":"우리나라와 같이 현대의 전력 수송 시스템에서 주로 '초고압 송전'을 하는 가장 큰 이유는?","img":"","o":[{"t":"① 전선에 흐르는 전류를 증가시켜 전기가 빨리 도달하게 하기 위해","a":0,"r":"전기 속도와는 무관합니다."},{"t":"② 발전기의 회전 속도를 높이기 위해","a":0,"r":"송전 전압과 터빈 속도는 직접적인 연관이 없습니다."},{"t":"③ 송전 과정에서 전선에서 발생하는 열손실(손실 전력)을 줄이기 위해","a":1,"r":"송전 전압을 높여 송전 전류를 줄임으로써 전력 손실(I²R)을 최소화하기 위함입니다."},{"t":"④ 가정에서 고전압을 그대로 사용하기 편리하기 때문에","a":0,"r":"가정에서는 위험하므로 220V로 낮추어 사용합니다."}]},
  {"id":46,"c":"전력 수송과 변압기","q":"전력 손실을 줄이는 방법으로 현실에서 가장 효율적이고 널리 사용되는 방법은?","img":"","o":[{"t":"① 송전선의 굵기를 매우 얇게 만든다.","a":0,"r":"얇아지면 저항이 커져 손실이 증가합니다."},{"t":"② 송전선의 재질을 저항이 큰 금속으로 바꾼다.","a":0,"r":"저항이 크면 손실이 증가합니다."},{"t":"③ 송전 전압을 높여 송전한다.","a":1,"r":"가장 확실하고 경제적으로 전력 손실을 줄이는 방법입니다."},{"t":"④ 초전도 케이블을 현재의 모든 송전선에 대체 설치한다.","a":0,"r":"초전도 케이블은 저항이 0이지만, 극저온 유지가 어려워 현재 전면 상용화되어 있지 않습니다."}]},
  {"id":47,"c":"전력 수송과 변압기","q":"변압기의 원리로 옳은 것은?","img":"","o":[{"t":"① 화학 전지의 원리","a":0,"r":"전압 변화와 무관합니다."},{"t":"② 정전기 유도","a":0,"r":"정전기가 아닙니다."},{"t":"③ 전자기 유도","a":1,"r":"1차 코일에 흐르는 교류 전류가 수시로 변하는 자기장을 만들면, 이 자기장이 2차 코일을 통과하며 전자기 유도 현상을 일으켜 전압을 바꿉니다."},{"t":"④ 열전 효과","a":0,"r":"열과 전기의 변환입니다."}]},
  {"id":48,"c":"전력 수송과 변압기","q":"변압기에서 1차 코일의 감은 수가 100회, 2차 코일의 감은 수가 500회이다. 1차 코일에 200V의 교류 전압을 걸어주면 2차 코일에 유도되는 전압은 얼마인가?","img":"","o":[{"t":"① 40 V","a":0,"r":"감은 수가 많아지면 전압도 올라갑니다."},{"t":"② 200 V","a":0,"r":"전압이 변합니다."},{"t":"③ 500 V","a":0,"r":"비율이 1:5 입니다."},{"t":"④ 1000 V","a":1,"r":"전압은 코일의 감은 수에 비례합니다. (V₂ / V₁) = (N₂ / N₁). 따라서 200V × (500/100) = 1000V 입니다."}]},
  {"id":49,"c":"전력 수송과 변압기","q":"위의 문제(48번)에서 변압기 내에서의 전력 손실을 무시할 때, 1차 코일의 전류(I₁)와 2차 코일의 전류(I₂)의 비(I₁ : I₂)는?","img":"","o":[{"t":"① 1 : 5","a":0,"r":"전압과 전류는 반비례합니다."},{"t":"② 5 : 1","a":1,"r":"전력(P=VI)이 일정하게 유지되므로 전압이 5배가 되면 전류는 1/5이 됩니다. 즉 I₁ : I₂ = 5 : 1 입니다."},{"t":"③ 1 : 1","a":0,"r":"전류가 변합니다."},{"t":"④ 25 : 1","a":0,"r":"제곱비가 아닙니다."}]},
  {"id":50,"c":"전력 수송과 변압기","q":"다음 중 교류(AC) 송전이 직류(DC) 송전에 비해 유리한 점은?","img":"","o":[{"t":"① 전자기파가 전혀 발생하지 않는다.","a":0,"r":"교류는 자기장 변화로 전자기파가 발생할 수 있습니다."},{"t":"② 전압을 높이거나 낮추기 쉽다.","a":1,"r":"교류는 전류의 방향과 세기가 계속 변하여 변압기(전자기 유도 원리)를 통해 전압을 쉽게 조절할 수 있습니다."},{"t":"③ 배터리에 그대로 저장하기 쉽다.","a":0,"r":"배터리 저장은 직류(DC)만 가능합니다."},{"t":"④ 절연 저항에 의한 손실이 전혀 없다.","a":0,"r":"교류도 손실이 존재합니다."}]},
  {"id":51,"c":"전력 수송과 변압기","q":"발전소에서 소비지까지 전기가 전달되는 경로로 알맞은 것은?","img":"","o":[{"t":"① 발전소 → 변전소(전압 높임) → 송전선 → 변전소(전압 낮춤) → 주상변압기 → 가정","a":1,"r":"발전 직후 손실을 줄이기 위해 초고압 변전소에서 전압을 높이고, 소비지에 가까워질수록 단계적으로 변전소와 주상 변압기를 통해 안전한 전압으로 낮춥니다."},{"t":"② 발전소 → 주상변압기 → 송전선 → 초고압변전소 → 가정","a":0,"r":"순서가 틀렸습니다."},{"t":"③ 발전소 → 송전선 → 변전소(전압 높임) → 주상변압기 → 가정","a":0,"r":"전압을 나중에 높이면 전력 손실을 막지 못합니다."},{"t":"④ 발전소 → 가정 → 송전선 → 변전소","a":0,"r":"가정이 목적지입니다."}]},
  {"id":52,"c":"전력 수송과 변압기","q":"집 주변의 전봇대에 달려있는 원통형 장치인 '주상 변압기'의 주된 역할은?","img":"","o":[{"t":"① 교류를 직류로 변환한다.","a":0,"r":"가정에도 220V 교류로 들어옵니다."},{"t":"② 정전 시 예비 전력을 공급한다.","a":0,"r":"배터리가 아닙니다."},{"t":"③ 배전선로의 높은 전압을 가정에서 사용할 수 있는 220V로 낮춘다.","a":1,"r":"가정으로 들어오기 직전 위험한 고전압을 안전한 220V로 낮추는 강압 변압기입니다."},{"t":"④ 발전소에서 온 전압을 수십만 볼트로 높인다.","a":0,"r":"초고압 변전소의 역할입니다."}]},
  {"id":53,"c":"전력 수송과 변압기","q":"전력 수송망에서 일어날 수 있는 안전사고와 피해를 막기 위한 시설이 아닌 것은?","img":"","o":[{"t":"① 송전탑을 높게 세워 전선이 지면에서 멀리 떨어지게 한다.","a":0,"r":"고압선 감전 사고를 막는 방법입니다."},{"t":"② 도심에서는 송전선을 지하에 매설하는 지중화 작업을 한다.","a":0,"r":"안전과 미관을 위해 지중화를 합니다."},{"t":"③ 선로에 전류가 과도하게 흐를 때 자동으로 회로를 차단하는 차단기를 설치한다.","a":0,"r":"과전류 피해를 막습니다."},{"t":"④ 전선의 저항을 높이기 위해 알루미늄 대신 고무로 된 전선을 사용한다.","a":1,"r":"고무는 절연체이므로 전기가 통하지 않아 송전선으로 쓸 수 없으며, 저항을 높이면 전력 손실만 커집니다."}]},
  {"id":54,"c":"전력 수송과 변압기","q":"지능형 전력망 시스템인 '스마트 그리드(Smart Grid)'의 특징으로 가장 옳지 않은 것은?","img":"","o":[{"t":"① 전력 공급자와 소비자가 양방향으로 실시간 정보를 교환한다.","a":0,"r":"가장 큰 특징입니다."},{"t":"② 시간대별 전력 요금을 탄력적으로 적용하여 전력 소비를 분산시킨다.","a":0,"r":"피크 시간대의 부하를 줄입니다."},{"t":"③ 신재생 에너지와 에너지 저장 장치(ESS)를 연계하여 효율을 극대화한다.","a":0,"r":"맞는 설명입니다."},{"t":"④ 남는 전력이 생기면 무조건 땅으로 흘려보내 소멸시킨다.","a":1,"r":"남는 전력은 ESS에 저장하거나 필요한 곳으로 다시 분배하여 효율을 높입니다."}]},
  {"id":55,"c":"전력 수송과 변압기","q":"어떤 공장의 하루 전력 소비량이 240kWh이다. 이 공장에서 10kW의 전력으로 평균 몇 시간을 가동한 것인가?","img":"","o":[{"t":"① 12 시간","a":0,"r":"계산이 틀렸습니다."},{"t":"② 24 시간","a":1,"r":"전력량(Wh) = 전력(W) × 시간(h) 이므로, 240kWh = 10kW × h. 따라서 h = 24시간입니다."},{"t":"③ 48 시간","a":0,"r":"계산이 틀렸습니다."},{"t":"④ 240 시간","a":0,"r":"단위 계산 오류입니다."}]},
  {"id":56,"c":"전력 수송과 변압기","q":"송전선 A와 B가 있다. A의 저항은 B의 2배이다. 두 송전선에 같은 크기의 전류를 흘려보낼 때, A의 손실 전력은 B의 몇 배인가?","img":"","o":[{"t":"① 1 배","a":0,"r":"저항이 다릅니다."},{"t":"② 2 배","a":1,"r":"손실 전력 Ploss = I²R 입니다. I가 같을 때 Ploss는 R에 비례하므로 A의 손실 전력은 B의 2배입니다."},{"t":"③ 4 배","a":0,"r":"전류가 2배일 때 4배가 됩니다."},{"t":"④ 1/2 배","a":0,"r":"반비례가 아닙니다."}]},
  {"id":57,"c":"전력 수송과 변압기","q":"초전도 케이블을 송전선으로 사용할 때의 가장 큰 장점은?","img":"","o":[{"t":"① 굵기를 1m 이상으로 두껍게 만들 수 있다.","a":0,"r":"굵게 만들 필요가 없습니다."},{"t":"② 전기 저항이 0이므로 열에 의한 전력 손실이 전혀 없다.","a":1,"r":"특정 온도(임계 온도) 이하에서 저항이 0이 되어 전력 손실 없이 송전할 수 있습니다."},{"t":"③ 교류를 사용할 때만 저항이 0이 된다.","a":0,"r":"직류 송전 시에도 저항이 0입니다."},{"t":"④ 상온에서도 항상 초전도 현상이 일어난다.","a":0,"r":"현재 기술로는 상온에서 초전도 현상을 유지하기 어렵습니다."}]},
  {"id":58,"c":"전력 수송과 변압기","q":"송전선의 전압을 3배로 높이고, 동시에 송전선의 저항을 3배로 늘린 전선으로 교체했다면, 손실 전력은 처음의 몇 배가 되는가? (단, 송전 전력은 동일)","img":"","o":[{"t":"① 1배 (변화 없음)","a":0,"r":"계산이 틀렸습니다."},{"t":"② 1/3 배","a":1,"r":"전압이 3배가 되면 전류는 1/3배. 전류의 제곱은 1/9. 저항이 3배이므로 손실 전력 = (1/9) × 3 = 1/3 배가 됩니다."},{"t":"③ 1/9 배","a":0,"r":"저항이 3배 늘어난 것을 반영하지 않은 값입니다."},{"t":"④ 3 배","a":0,"r":"계산이 틀렸습니다."}]},
  {"id":59,"c":"전력 수송과 변압기","q":"고전압 송전탑 주변을 지나갈 때 형광등을 들고 있으면 불이 들어올 수 있다. 이 현상의 원인은?","img":"","o":[{"t":"① 태양의 광전 효과","a":0,"r":"태양광이 아닙니다."},{"t":"② 전자기 유도 및 전기장 형성","a":1,"r":"송전선의 고전압 주변에는 강한 전기장과 자기장이 형성되어, 무선으로도 전자기 유도 등이 일어나 형광등 기체와 반응해 빛이 날 수 있습니다."},{"t":"③ 열전도","a":0,"r":"열 때문이 아닙니다."},{"t":"④ 정전기적 마찰","a":0,"r":"들고 있는 것만으로 마찰이 일어나진 않습니다."}]},
  {"id":60,"c":"전력 수송과 변압기","q":"가정으로 들어오는 전력선 중 하나가 단선(끊어짐)되었을 때 일어나는 현상으로 옳은 것은?","img":"","o":[{"t":"① 전압이 2배로 뛰어 위험해진다.","a":0,"r":"회로가 끊기면 전류가 흐르지 않습니다."},{"t":"② 해당 선로에 연결된 가전제품에 전류가 흐르지 않아 작동이 멈춘다.","a":1,"r":"직렬 구조의 일부(또는 메인 공급선)가 끊어지면 폐회로가 구성되지 않아 전기가 통하지 않습니다."},{"t":"③ 끊어진 선을 통해 무한한 전류가 방출된다.","a":0,"r":"공기 중으로 쉽게 방전되지 않습니다."},{"t":"④ 스마트 그리드가 자동으로 배터리를 생성해낸다.","a":0,"r":"배터리를 '생성'할 수는 없습니다."}]},
  {"id":61,"c":"열기관과 에너지 효율","q":"열기관(Heat Engine)의 기본 원리에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 저온의 열원에서 열을 흡수하여 고온으로 방출한다.","a":0,"r":"이것은 냉장고나 에어컨(열펌프)의 원리입니다."},{"t":"② 고온의 열원에서 열을 흡수하여 일부를 일(역학적 에너지)로 바꾸고 나머지를 저온의 열원으로 방출한다.","a":1,"r":"열기관은 고온에서 Q₁을 흡수해 W만큼 일을 하고 나머지 Q₂를 저온으로 버리는 장치입니다."},{"t":"③ 열에너지를 전기 에너지로 변환하는 장치이다.","a":0,"r":"일차적으로 역학적 에너지(일)로 바꿉니다."},{"t":"④ 공급받은 열을 100% 일로 바꿀 수 있다.","a":0,"r":"열역학 제2법칙에 의해 불가능합니다."}]},
  {"id":62,"c":"열기관과 에너지 효율","q":"어떤 열기관이 고온의 열원에서 1000J의 열을 흡수하여 400J의 일을 하였다. 저온의 열원으로 방출된 열량(Q₂)은 얼마인가?","img":"","o":[{"t":"① 0 J","a":0,"r":"에너지 보존에 위배됩니다."},{"t":"② 400 J","a":0,"r":"이것은 한 일의 양입니다."},{"t":"③ 600 J","a":1,"r":"Q₁ = W + Q₂ 이므로, 1000J = 400J + Q₂. 따라서 방출된 열량은 600J입니다."},{"t":"④ 1400 J","a":0,"r":"흡수열보다 방출열이 클 수 없습니다."}]},
  {"id":63,"c":"열기관과 에너지 효율","q":"위 문제(62번)의 열기관의 열효율(e)은 얼마인가?","img":"","o":[{"t":"① 0.4 (40%)","a":1,"r":"열효율 e = W / Q₁ = 400 / 1000 = 0.4 (40%) 입니다."},{"t":"② 0.6 (60%)","a":0,"r":"이것은 버려진 열의 비율입니다."},{"t":"③ 1.0 (100%)","a":0,"r":"효율은 100%가 될 수 없습니다."},{"t":"④ 1.4 (140%)","a":0,"r":"효율이 100%를 넘을 수 없습니다."}]},
  {"id":64,"c":"열기관과 에너지 효율","q":"열효율이 1 (100%)인 열기관을 만들 수 없는 가장 근본적인 이유는?","img":"","o":[{"t":"① 기술력이 아직 부족해서","a":0,"r":"이론적으로 불가능합니다."},{"t":"② 금속의 마찰 계수를 0으로 만들 수 없어서","a":0,"r":"마찰이 없더라도 불가능합니다."},{"t":"③ 열은 항상 고온에서 저온으로 흐르며, 흡수한 열의 일부는 반드시 저온으로 방출되어야 하기 때문 (열역학 제2법칙)","a":1,"r":"열역학 제2법칙에 따라 열이 100% 일로 전환되는 제2종 영구 기관은 불가능하며 반드시 방출되는 열(Q₂)이 존재합니다."},{"t":"④ 연료가 완전 연소하지 않기 때문","a":0,"r":"완전 연소해도 100% 효율은 불가능합니다."}]},
  {"id":65,"c":"열기관과 에너지 효율","q":"다음 중 에너지 소비 효율 등급에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 5등급일수록 에너지를 절약하는 효율이 높은 제품이다.","a":0,"r":"1등급일수록 효율이 높습니다."},{"t":"② 1등급 제품은 5등급 제품에 비해 에너지를 약 30~40% 절약할 수 있다.","a":1,"r":"1등급은 전력 낭비가 적어 5등급 대비 상당한 전기 요금을 절약할 수 있습니다."},{"t":"③ 등급이 높을수록(숫자가 클수록) 대기 전력이 적다.","a":0,"r":"숫자가 작을수록(1등급) 대기 전력이 적고 효율이 좋습니다."},{"t":"④ 에너지 소비 효율 등급 라벨은 제조사가 임의로 붙이는 것이다.","a":0,"r":"국가 공인 기관의 검사를 거쳐 의무적으로 부착합니다."}]},
  {"id":66,"c":"열기관과 에너지 효율","q":"가전제품의 전원을 끄고 사용하지 않는 상태에서도 플러그가 꽂혀 있어 소모되는 전력을 무엇이라고 하는가?","img":"","o":[{"t":"① 유효 전력","a":0,"r":"작동할 때 필요한 전력입니다."},{"t":"② 소비 전력","a":0,"r":"사용 중 단위 시간당 소모 전력입니다."},{"t":"③ 대기 전력 (Standby Power)","a":1,"r":"전원을 끈 상태에서도 대기 상태 유지를 위해 암암리에 소모되는 전력으로 '전기 흡혈귀'라고도 부릅니다."},{"t":"④ 겉보기 전력","a":0,"r":"교류 회로에서 전압과 전류의 단순 곱입니다."}]},
  {"id":67,"c":"열기관과 에너지 효율","q":"다음 중 대기 전력을 줄이는 실천 방법으로 가장 알맞은 것은?","img":"","o":[{"t":"① 가전제품을 항상 최대 출력으로 사용한다.","a":0,"r":"소비 전력만 증가시킵니다."},{"t":"② 사용하지 않는 가전제품의 플러그를 뽑아두거나 절전형 멀티탭을 사용한다.","a":1,"r":"스위치가 달린 멀티탭으로 대기 전력을 완벽히 차단할 수 있습니다."},{"t":"③ 플러그를 콘센트에 더 꽉 꽂아둔다.","a":0,"r":"대기 전력과는 무관합니다."},{"t":"④ 1등급 가전제품은 플러그를 뽑지 않아도 전기를 전혀 소모하지 않으므로 그대로 둔다.","a":0,"r":"1등급도 대기 전력은 소모합니다 (물론 저감 우수 제품이 있습니다)."}]},
  {"id":68,"c":"열기관과 에너지 효율","q":"하이브리드 자동차(Hybrid Car)가 기존 내연 기관 자동차보다 에너지 효율이 높은 이유로 가장 적절한 것은?","img":"","o":[{"t":"① 엔진이 아예 없고 전기 모터로만 달리기 때문","a":0,"r":"이것은 순수 전기차(EV)입니다."},{"t":"② 제동할 때나 내리막길에서 버려지는 운동 에너지를 전기 에너지로 회수하여 배터리를 충전하기 때문","a":1,"r":"회생 제동 시스템을 통해 버려지는 열에너지(브레이크 마찰열) 대신 전기 에너지로 전환해 다시 사용하므로 연비가 높습니다."},{"t":"③ 물을 연료로 사용하여 엔진을 식혀주기 때문","a":0,"r":"물을 연료로 쓰지 않습니다."},{"t":"④ 차체가 가벼운 종이로 만들어져서","a":0,"r":"가벼운 소재를 쓰긴 하지만 종이는 아닙니다."}]},
  {"id":69,"c":"열기관과 에너지 효율","q":"형광등을 LED(발광 다이오드) 조명으로 교체할 때 얻을 수 있는 장점(에너지 측면)으로 옳은 것은?","img":"","o":[{"t":"① LED는 열을 전혀 발생시키지 않아 효율이 100%이다.","a":0,"r":"LED도 약간의 열은 발생시킵니다."},{"t":"② LED는 형광등보다 전기 에너지를 빛에너지로 전환하는 효율이 매우 높아 전력 소모가 적다.","a":1,"r":"동일한 밝기를 내는 데 필요한 전력이 형광등이나 백열등보다 훨씬 적습니다."},{"t":"③ LED는 화학 에너지를 흡수하여 작동하므로 전기가 필요 없다.","a":0,"r":"전기 에너지가 필요합니다."},{"t":"④ 수명이 형광등보다 짧아 자주 교체해야 한다.","a":0,"r":"수명이 훨씬 깁니다."}]},
  {"id":70,"c":"열기관과 에너지 효율","q":"겨울철 건물의 난방 효율을 높이기 위해 이중창을 설치하는 과학적 원리는?","img":"","o":[{"t":"① 이중창 사이의 공기층이 열의 '전도'를 차단하는 단열재 역할을 하기 때문","a":1,"r":"공기는 열전도율이 매우 낮아 이중창 사이의 공기(또는 진공)층이 실내 열이 밖으로 빠져나가는 것을 막아줍니다."},{"t":"② 유리가 빛에너지를 증폭시켜 온도를 높여주기 때문","a":0,"r":"빛 증폭과는 무관합니다."},{"t":"③ 공기층이 바람을 만들어 실내를 데우기 때문","a":0,"r":"바람을 만들지 않습니다."},{"t":"④ 창문이 두 개라 시야가 차단되어 심리적으로 따뜻하게 느끼기 때문","a":0,"r":"물리적 단열 효과입니다."}]},
  {"id":71,"c":"열기관과 에너지 효율","q":"에너지 절약을 위한 건축 기술 중 '제로 에너지 빌딩'의 특징이 아닌 것은?","img":"","o":[{"t":"① 고효율 단열재를 사용하여 에너지 손실을 최소화한다 (패시브 기술).","a":0,"r":"맞는 설명입니다."},{"t":"② 태양광 발전이나 지열 발전 등을 이용해 건물 자체에서 에너지를 생산한다 (액티브 기술).","a":0,"r":"맞는 설명입니다."},{"t":"③ 건물의 창문을 모두 없애고 100% 인공조명만 사용한다.","a":1,"r":"창문을 없애는 것이 아니라, 자연 채광을 적극 활용하여 조명 에너지를 절약합니다."},{"t":"④ 필요한 에너지와 자체 생산하는 에너지의 합이 0에 가깝도록 설계된다.","a":0,"r":"제로 에너지 빌딩의 정의입니다."}]},
  {"id":72,"c":"열기관과 에너지 효율","q":"열효율이 30%인 가솔린 엔진에 10L의 휘발유를 넣었을 때, 바퀴를 굴리는 등 유용한 일로 전환되는 휘발유의 양은 (이론상) 얼마에 해당하는가?","img":"","o":[{"t":"① 3 L","a":1,"r":"10L의 30%만 유용한 일에 쓰이므로 3L 분량만이 일로 전환되고, 나머지 7L 분량은 열로 버려집니다."},{"t":"② 5 L","a":0,"r":"효율이 50%일 때입니다."},{"t":"③ 7 L","a":0,"r":"버려지는 양입니다."},{"t":"④ 10 L","a":0,"r":"효율이 100%일 때입니다."}]},
  {"id":73,"c":"열기관과 에너지 효율","q":"전구의 효율을 나타낼 때 '광효율(lm/W)'이 의미하는 것은?","img":"","o":[{"t":"① 1초당 소비하는 전기 에너지","a":0,"r":"소비 전력(W)을 뜻합니다."},{"t":"② 1와트(W)의 전력을 소비할 때 방출하는 빛의 양(루멘)","a":1,"r":"입력 전력 대비 얼마나 밝은 빛을 내는지를 나타내는 지표로, 광효율이 높을수록 전기 절약이 됩니다."},{"t":"③ 1루멘의 빛을 내는 데 걸리는 시간","a":0,"r":"틀린 설명입니다."},{"t":"④ 전구가 내뿜는 열의 양","a":0,"r":"빛의 양입니다."}]},
  {"id":74,"c":"열기관과 에너지 효율","q":"다음 중 에너지를 절약하는 생활 습관으로 옳지 않은 것은?","img":"","o":[{"t":"① 냉장고 문을 자주 열고 닫는다.","a":1,"r":"냉장고 문을 열면 찬 공기가 빠져나가고 더운 공기가 들어와 다시 식히는 데 많은 에너지가 소모됩니다."},{"t":"② 여름철 에어컨 설정 온도를 26~28℃로 유지한다.","a":0,"r":"과도한 냉방을 막아 에너지를 절약합니다."},{"t":"③ 세탁물은 모아서 한 번에 세탁한다.","a":0,"r":"세탁기 가동 횟수를 줄여 전기를 아낍니다."},{"t":"④ 백열등을 LED 조명으로 교체한다.","a":0,"r":"광효율을 높입니다."}]},
  {"id":75,"c":"열기관과 에너지 효율","q":"열역학 제1법칙과 제2법칙에 대한 설명으로 옳은 것은?","img":"","o":[{"t":"① 제1법칙은 에너지가 소멸될 수 있음을 증명한다.","a":0,"r":"제1법칙은 에너지 보존을 뜻합니다."},{"t":"② 제2법칙에 의해 열은 스스로 저온에서 고온으로 이동할 수 없다.","a":1,"r":"열은 항상 고온에서 저온으로 흐르며, 반대로 가려면 외부에서 일을 해줘야 합니다(엔트로피 증가의 법칙)."},{"t":"③ 제1법칙과 제2법칙은 서로 모순된다.","a":0,"r":"서로 보완적입니다."},{"t":"④ 100% 효율의 열기관은 제1법칙에는 위배되나 제2법칙에는 위배되지 않는다.","a":0,"r":"제1법칙은 만족할 수 있으나(에너지 보존), 제2법칙에 위배되어 만들 수 없습니다."}]},
  {"id":76,"c":"열기관과 에너지 효율","q":"'에너지 절약 마크(e-boy 마크)'가 붙은 제품의 주된 특징은?","img":"","o":[{"t":"① 디자인이 우수한 제품이다.","a":0,"r":"디자인 마크가 아닙니다."},{"t":"② 대기 전력을 최소화하여 에너지 낭비를 줄이는 우수 제품이다.","a":1,"r":"대기 전력 저감 우수 제품에 부여되는 마크입니다."},{"t":"③ 100% 태양광으로만 작동하는 제품이다.","a":0,"r":"태양광과는 무관합니다."},{"t":"④ 사용하면 오히려 전기를 생산하는 제품이다.","a":0,"r":"불가능합니다."}]},
  {"id":77,"c":"열기관과 에너지 효율","q":"다음 식 중 열기관의 열효율(e)을 올바르게 나타낸 것은? (고온 흡수열 Q₁, 저온 방출열 Q₂, 한 일 W)","img":"","o":[{"t":"① e = Q₁ / W","a":0,"r":"역수입니다."},{"t":"② e = Q₂ / Q₁","a":0,"r":"이것은 버려진 열의 비율입니다."},{"t":"③ e = W / Q₁ = (Q₁ - Q₂) / Q₁","a":1,"r":"효율은 투입된 열(Q₁) 대비 한 일(W)이며, 에너지 보존에 의해 W = Q₁ - Q₂ 이므로 같이 표현할 수 있습니다."},{"t":"④ e = W / Q₂","a":0,"r":"틀린 공식입니다."}]},

  {"id":96,"c":"신재생 에너지","q":"태양 전지(Solar Cell) 여러 개를 직렬이나 병렬로 연결하여 판 형태로 만든 것을 무엇이라 부르는가?","img":"","o":[{"t":"① 인버터","a":0,"r":"직류를 교류로 바꾸는 장치입니다."},{"t":"② 모터","a":0,"r":"전동기입니다."},{"t":"③ 스마트 그리드","a":0,"r":"지능형 전력망입니다."},{"t":"④ 태양광 모듈(패널)","a":1,"r":"셀(Cell)을 모아 모듈(Module)을 만들고 이를 연결해 어레이(Array)를 구성합니다."}]},
  {"id":97,"c":"신재생 에너지","q":"파도의 상하 운동 에너지를 이용하여 발전기 터빈을 돌리는 발전 방식은?","img":"","o":[{"t":"① 파력 발전","a":1,"r":"파도가 칠 때 공기실 안의 공기가 압축/팽창하는 힘으로 터빈을 돌리는 발전 방식입니다."},{"t":"② 조류 발전","a":0,"r":"빠른 바닷물의 흐름을 이용합니다."},{"t":"③ 조력 발전","a":0,"r":"조수 간만의 수위 차를 이용합니다."},{"t":"④ 해양 온도차 발전","a":0,"r":"표층수와 심층수의 온도 차를 이용합니다."}]},
  {"id":98,"c":"신재생 에너지","q":"다음 중 온실가스(이산화 탄소) 배출량이 가장 적은 발전 방식은?","img":"","o":[{"t":"① 석탄 화력 발전","a":0,"r":"가장 많이 배출합니다."},{"t":"② 석유 화력 발전","a":0,"r":"많이 배출합니다."},{"t":"③ 액화 천연가스(LNG) 발전","a":0,"r":"석탄보다는 적지만 여전히 배출합니다."},{"t":"④ 태양광 발전","a":1,"r":"발전 과정 자체에서는 이산화 탄소를 배출하지 않는 친환경 에너지입니다."}]},
  {"id":99,"c":"신재생 에너지","q":"지열 발전(Geothermal Power)의 장점으로 옳은 것은?","img":"","o":[{"t":"① 우리나라 어느 곳에서나 쉽게 대규모로 건설할 수 있다.","a":0,"r":"지열 발전은 화산 지대 등 특정 지형적 조건이 맞아야 유리합니다."},{"t":"② 날씨나 계절, 밤낮의 영향을 받지 않고 24시간 연속 발전이 가능하다.","a":1,"r":"태양광이나 풍력과 달리 지하의 열은 항상 존재하므로 기상 조건에 상관없이 안정적인 기저 부하 발전이 가능합니다."},{"t":"③ 화석 연료를 태워 땅을 데워야 한다.","a":0,"r":"지구 내부의 자연적인 열을 이용합니다."},{"t":"④ 설치하면 주변 온도를 영하로 떨어뜨린다.","a":0,"r":"영하로 떨어뜨리지 않습니다."}]},
  {"id":100,"c":"신재생 에너지","q":"수소 연료 전지의 한계점 및 풀어야 할 과제로 가장 적절한 것은?","img":"","o":[{"t":"① 발전 시 매연과 온실가스가 너무 많이 나온다.","a":0,"r":"물만 배출하여 매우 친환경적입니다."},{"t":"② 수소를 얻기 위해 다시 화석 연료를 개질하거나 많은 전기를 써서 물을 전기분해해야 하며, 폭발 위험으로 수소 저장 및 운반 기술이 까다롭다.","a":1,"r":"연료인 순수 수소를 자연에서 바로 캐낼 수 없고 생산 단가가 높으며, 안전한 저장 인프라 구축이 현재의 가장 큰 과제입니다."},{"t":"③ 산소가 부족해지면 작동이 아예 불가능하다.","a":0,"r":"공기 중 산소를 씁니다."},{"t":"④ 효율이 10% 미만으로 화력 발전보다 터무니없이 낮다.","a":0,"r":"효율이 매우 높습니다 (보통 40~60% 이상)."}]}
]
  </script>

  <script>
    let rawQuizData = [];
    try {
      const jsonText = document.getElementById("quiz-data").textContent;
      rawQuizData = JSON.parse(jsonText);
    } catch (e) {
      showCustomAlert("문제 데이터를 불러오는 중 오류가 발생했습니다. JSON 형식을 확인해주세요.");
      console.error("JSON Parsing Error:", e);
    }

    let currentIdx = 0;
    let userAnswers = new Array(rawQuizData.length).fill(null);

    const questionBadge = document.getElementById("question-badge");
    const categoryBadge = document.getElementById("category-badge");
    const questionCounter = document.getElementById("question-counter");
    const questionText = document.getElementById("question-text");
    const questionImage = document.getElementById("question-image");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const resultAlert = document.getElementById("result-alert");
    const rationalesList = document.getElementById("rationales-list");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const navGrid = document.getElementById("nav-grid");
    const scoreDisplay = document.getElementById("score-display");
    const progressBar = document.getElementById("progress-bar");
    const resetBtn = document.getElementById("reset-btn");
    const editModal = document.getElementById("edit-modal");
    const nextBtnTop = document.getElementById("next-btn-top");

    function showCustomAlert(msg) {
      document.getElementById('custom-alert-msg').innerText = msg;
      document.getElementById('custom-alert').classList.remove('hidden');
    }

    function showCustomConfirm(msg, onConfirm) {
      document.getElementById('custom-confirm-msg').innerText = msg;
      const confirmModal = document.getElementById('custom-confirm');
      confirmModal.classList.remove('hidden');
      
      document.getElementById('custom-confirm-ok').onclick = function() {
        confirmModal.classList.add('hidden');
        if(onConfirm) onConfirm();
      };
      
      document.getElementById('custom-confirm-cancel').onclick = function() {
        confirmModal.classList.add('hidden');
      };
    }

    function initNavGrid() {
      navGrid.innerHTML = "";
      rawQuizData.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.innerText = idx + 1;
        btn.id = `nav-btn-${idx}`;
        btn.className = "w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs border border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200 transition shadow-sm flex items-center justify-center";
        btn.onclick = () => loadQuestion(idx);
        navGrid.appendChild(btn);
      });
      updateScoreAndProgress();
    }

    function updateScoreAndProgress() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null && rawQuizData[idx].o[ans].a === 1) correctCount++;
      });
      scoreDisplay.innerText = `${correctCount} / ${answeredCount} (총 ${rawQuizData.length}문항)`;
      progressBar.style.width = `${(answeredCount / rawQuizData.length) * 100}%`;

      rawQuizData.forEach((_, idx) => {
        const navBtn = document.getElementById(`nav-btn-${idx}`);
        if(!navBtn) return;
        if (userAnswers[idx] === null) {
          navBtn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs border shadow-sm flex items-center justify-center transition ${idx === currentIdx ? 'border-indigo-600 ring-2 ring-indigo-400 bg-white text-indigo-700 scale-110' : 'border-slate-300 bg-slate-50 text-slate-600 hover:bg-slate-200'}`;
        } else {
          const isUserCorrect = rawQuizData[idx].o[userAnswers[idx]].a === 1;
          navBtn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs shadow-sm flex items-center justify-center transition bg-${isUserCorrect ? 'emerald' : 'rose'}-500 text-white ${idx === currentIdx ? `ring-2 ring-${isUserCorrect ? 'emerald' : 'rose'}-300 scale-110` : ''}`;
        }
      });
    }

    function loadQuestion(idx) {
      if (idx < 0 || idx >= rawQuizData.length) return;
      currentIdx = idx;
      const q = rawQuizData[idx];

      window.scrollTo(0, 0);

      questionBadge.innerText = `문항 ${q.id || (idx+1)}`;
      categoryBadge.innerText = q.c;
      questionCounter.innerText = `${idx + 1} / ${rawQuizData.length}`;
      questionText.innerText = q.q;
      
      if(q.img && q.img.trim() !== "") {
          questionImage.src = q.img;
          questionImage.classList.remove('hidden');
      } else {
          questionImage.src = "";
          questionImage.classList.add('hidden');
      }

      optionsContainer.innerHTML = "";
      const selected = userAnswers[idx];

      q.o.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3 text-sm md:text-base font-medium shadow-sm ";
        
        if (selected === null) {
          btn.className += "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 text-slate-800";
          btn.onclick = () => selectOption(optIdx);
        } else {
          if (opt.a === 1) btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold z-10 scale-[1.01]";
          else if (selected === optIdx) btn.className += "border-rose-500 bg-rose-50 text-rose-900";
          else btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
          btn.disabled = true;
        }

        const iconSpan = document.createElement("span");
        iconSpan.className = "pt-0.5 shrink-0"; 
        if (selected !== null) {
          if (opt.a === 1) iconSpan.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-xl drop-shadow-md"></i>';
          else if (selected === optIdx) iconSpan.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-xl"></i>';
          else iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-300 text-xl"></i>';
        } else {
          iconSpan.innerHTML = '<i class="fa-regular fa-circle text-slate-400 text-xl group-hover:text-indigo-600"></i>';
        }

        const textSpan = document.createElement("span");
        textSpan.className = "flex-1 leading-relaxed";
        textSpan.innerText = opt.t;
        
        btn.appendChild(iconSpan);
        btn.appendChild(textSpan);
        optionsContainer.appendChild(btn);
      });

      if (selected !== null) {
        renderExplanation(selected);
        explanationBox.classList.remove("hidden");
      } else {
        explanationBox.classList.add("hidden");
      }

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === rawQuizData.length - 1;
      nextBtnTop.disabled = idx === rawQuizData.length - 1;
      updateScoreAndProgress();
    }

    function selectOption(optIdx) {
      userAnswers[currentIdx] = optIdx;
      loadQuestion(currentIdx);
    }

    function renderExplanation(selectedIdx) {
      const q = rawQuizData[currentIdx];
      const isCorrect = q.o[selectedIdx].a === 1;

      if (isCorrect) {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-emerald-900 bg-emerald-100 border border-emerald-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-2xl drop-shadow"></i> <div>정답입니다! 훌륭합니다.</div>';
      } else {
        resultAlert.className = "p-4 rounded-xl flex items-center gap-3 mb-4 font-bold text-rose-900 bg-rose-100 border border-rose-300 shadow-inner";
        resultAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 text-2xl drop-shadow"></i> <div>오답입니다. 아래의 해설을 꼼꼼히 확인하세요.</div>';
      }

      rationalesList.innerHTML = "";
      q.o.forEach((opt) => {
        const item = document.createElement("div");
        item.className = `p-3 rounded-lg border shadow-sm ${opt.a === 1 ? 'bg-emerald-50/80 border-emerald-200' : 'bg-white border-slate-200'}`;
        
        const header = document.createElement("div");
        header.className = "font-bold mb-1.5 flex items-start gap-2";
        if (opt.a === 1) header.innerHTML = `<span class="bg-emerald-600 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5 shadow-sm">정답 보기</span> <span class="text-emerald-900">${opt.t}</span>`;
        else header.innerHTML = `<span class="bg-slate-400 text-white text-[10px] md:text-xs px-2 py-0.5 rounded flex-shrink-0 mt-0.5">오답 보기</span> <span class="text-slate-800">${opt.t}</span>`;
        
        const body = document.createElement("div");
        body.className = "text-xs md:text-sm text-slate-600 pl-1 leading-relaxed";
        body.innerText = opt.r;

        item.appendChild(header);
        item.appendChild(body);
        rationalesList.appendChild(item);
      });
    }

    function openEditModal() {
      const q = rawQuizData[currentIdx];
      document.getElementById('edit-cat').value = q.c;
      document.getElementById('edit-q').value = q.q;
      
      if(q.img && q.img.trim() !== "") {
          document.getElementById('edit-img-base64').value = q.img;
          document.getElementById('edit-img-preview').src = q.img;
          document.getElementById('edit-img-preview').classList.remove('hidden');
          document.getElementById('btn-clear-img').classList.remove('hidden');
      } else {
          clearImage(); 
      }

      for(let i=0; i<4; i++) {
        document.getElementById(`edit-opt-${i}`).value = q.o[i].t;
        document.getElementById(`edit-rat-${i}`).value = q.o[i].r;
        if(q.o[i].a === 1) {
          document.querySelector(`input[name="edit-ans"][value="${i}"]`).checked = true;
        }
      }
      
      document.body.classList.add('modal-open');
      editModal.classList.remove('hidden');
    }

    function closeEditModal() {
      document.body.classList.remove('modal-open');
      editModal.classList.add('hidden');
    }

    function saveEditedQuestion() {
      const q = rawQuizData[currentIdx];
      q.c = document.getElementById('edit-cat').value;
      q.q = document.getElementById('edit-q').value;
      q.img = document.getElementById('edit-img-base64').value;
      
      const checkedOpt = document.querySelector('input[name="edit-ans"]:checked');
      if(!checkedOpt) {
          showCustomAlert("정답 라디오 버튼을 선택해주세요.");
          return;
      }
      const correctVal = checkedOpt.value;
      
      for(let i=0; i<4; i++) {
        q.o[i].t = document.getElementById(`edit-opt-${i}`).value;
        q.o[i].r = document.getElementById(`edit-rat-${i}`).value;
        q.o[i].a = (i.toString() === correctVal) ? 1 : 0;
      }
      
      closeEditModal();
      loadQuestion(currentIdx);
      showCustomAlert("문제가 성공적으로 수정되었습니다.\n\n※ 영구 저장을 원하시면 상단의 [파일 다운로드]를 클릭하세요.");
    }

    function addNewQuestion() {
      const newQ = {
        id: rawQuizData.length + 1,
        c: "에너지와 전환",
        q: "새로운 문제를 입력하세요.",
        img: "",
        o: [
          { t: "① 보기 1", a: 1, r: "해설 1" },
          { t: "② 보기 2", a: 0, r: "해설 2" },
          { t: "③ 보기 3", a: 0, r: "해설 3" },
          { t: "④ 보기 4", a: 0, r: "해설 4" }
        ]
      };
      rawQuizData.push(newQ);
      userAnswers.push(null);
      initNavGrid();
      loadQuestion(rawQuizData.length - 1);
      openEditModal(); 
    }

    function deleteCurrentQuestion() {
      if(rawQuizData.length <= 1) {
          showCustomAlert("최소 1개의 문제는 남아있어야 합니다.");
          return;
      }
      showCustomConfirm("정말로 이 문제를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.", () => {
          rawQuizData.splice(currentIdx, 1);
          userAnswers.splice(currentIdx, 1);
          
          rawQuizData.forEach((q, i) => q.id = i + 1);
          
          initNavGrid();
          closeEditModal();
          
          let nextIdx = currentIdx >= rawQuizData.length ? rawQuizData.length - 1 : currentIdx;
          loadQuestion(nextIdx);
      });
    }

    function encodeImageFileAsURL(element) {
      const file = element.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        document.getElementById('edit-img-base64').value = reader.result;
        document.getElementById('edit-img-preview').src = reader.result;
        document.getElementById('edit-img-preview').classList.remove('hidden');
        document.getElementById('btn-clear-img').classList.remove('hidden');
      }
      reader.readAsDataURL(file);
    }

    function clearImage() {
      document.getElementById('edit-img-upload').value = "";
      document.getElementById('edit-img-base64').value = "";
      document.getElementById('edit-img-preview').src = "";
      document.getElementById('edit-img-preview').classList.add('hidden');
      document.getElementById('btn-clear-img').classList.add('hidden');
    }

    function downloadUpdatedHTML() {
      const dataScript = document.getElementById('quiz-data');
      dataScript.textContent = "\n" + JSON.stringify(rawQuizData, null, 2) + "\n";
      
      let htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "고1_통합과학2_에너지전환과활용_100제.html"; 
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    prevBtn.addEventListener("click", () => { if (currentIdx > 0) loadQuestion(currentIdx - 1); });
    nextBtn.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    nextBtnTop.addEventListener("click", () => { if (currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1); });
    
    resetBtn.addEventListener("click", () => {
      showCustomConfirm("풀이 기록을 모두 초기화하시겠습니까? 처음부터 다시 풉니다.", () => {
        userAnswers = new Array(rawQuizData.length).fill(null);
        loadQuestion(0);
      });
    });

    document.addEventListener("keydown", (e) => {
      if(!editModal.classList.contains('hidden') || !document.getElementById('custom-alert').classList.contains('hidden') || !document.getElementById('custom-confirm').classList.contains('hidden')) return;
      if (e.key === "ArrowLeft" && currentIdx > 0) loadQuestion(currentIdx - 1);
      else if (e.key === "ArrowRight" && currentIdx < rawQuizData.length - 1) loadQuestion(currentIdx + 1);
      else if (["1", "2", "3", "4"].includes(e.key) && userAnswers[currentIdx] === null) selectOption(parseInt(e.key) - 1);
    });

    if (rawQuizData.length > 0) {
      initNavGrid();
      loadQuestion(0);
    }
  </script>
</body></html>
